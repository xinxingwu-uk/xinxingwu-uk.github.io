	<script>
		Reveal.initialize({

		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}
	</script>

    /* Animated KYSU green-and-gold flyer dragonfly: circles around the visible webpage */
    .flying-flyer {
      --green-deep: #003527;
      --gold: #f2c94c;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10000;
      width: 136px;
      height: 70px;
      display: block;
      color: var(--green-deep);
      cursor: pointer;
      filter: drop-shadow(0 10px 12px rgba(0, 53, 39, 0.28));
      will-change: transform;
      transform: translate3d(24px, 84px, 0);
      touch-action: manipulation;
    }

    .flying-flyer:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 5px;
      border-radius: 22px;
    }

    .flyer-bird-bob {
      display: block;
      width: 100%;
      height: 100%;
      animation: flyerBob 1.15s ease-in-out infinite;
    }

    .flyer-bird-art {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transition: transform 0.18s ease, filter 0.18s ease;
      transform-origin: center;
    }

    .flying-flyer:hover .flyer-bird-art,
    .flying-flyer:focus-visible .flyer-bird-art {
      transform: scale(1.08);
      filter: brightness(1.06);
    }

    .flyer-bird-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
      transform-origin: center;
      transition: transform 0.12s linear;
    }

    .dragon-wing {
      transform-box: view-box;
      transform-origin: 100px 50px;
      will-change: transform, opacity, filter;
      pointer-events: none;
    }

    .dragonfly-body {
      transform-box: view-box;
      transform-origin: 100px 50px;
      will-change: transform;
    }

    .flyer-tail {
      transform-box: fill-box;
      transform-origin: right center;
      animation: flyerTail 0.9s ease-in-out infinite alternate;
    }

    .flyer-bird-label {
      position: absolute;
      left: 50%;
      bottom: -1px;
      transform: translateX(-50%);
      min-width: 66px;
      padding: 4px 13px 5px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      background: var(--gold);
      color: var(--green-deep);
      box-shadow: 0 5px 12px rgba(0, 53, 39, 0.26);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 950;

      line-height: 1;

      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(242, 201, 76, 0.35), 0 7px 16px rgba(0, 53, 39, 0.3);
    }

    @keyframes flyerBob {
      0%, 100% { transform: translateY(0.4px) rotate(-0.18deg); }

    @keyframes flyerTail {

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>


  <script>
    /* Fly the clickable dragonfly around a smooth loop over the visible webpage. */
    (function animateFlyerDragonfly() {
      const bird = document.querySelector(".flying-flyer");
      if (!bird) return;

      const birdSvg = bird.querySelector(".flyer-bird-svg");
      const wingTopFore = bird.querySelector(".wing-top-fore");
      const wingTopHind = bird.querySelector(".wing-top-hind");
      const wingBottomFore = bird.querySelector(".wing-bottom-fore");
      const wingBottomHind = bird.querySelector(".wing-bottom-hind");
      const dragonflyBody = bird.querySelector(".dragonfly-body");
      const loopDuration = 24000;
      const points = [
        [0.08, 0.10],
        [0.48, 0.035],
        [0.88, 0.11],
        [0.955, 0.46],
        [0.88, 0.88],
        [0.50, 0.955],
        [0.11, 0.88],
        [0.035, 0.50]
      ];

      let phase = 0;
      let lastTime = 0;
      let paused = false;

      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        return 0.5 * (
          2 * p1 +
          (-p0 + p2) * t +
          (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
          (-p0 + 3 * p1 - 3 * p2 + p3) * t3
        );
      }

      function getLoopPoint(progress) {
        const count = points.length;
        const scaled = ((progress % 1) + 1) % 1 * count;
        const index = Math.floor(scaled);
        const localT = scaled - index;
        const p0 = points[(index - 1 + count) % count];
        const p1 = points[index % count];
        const p2 = points[(index + 1) % count];
        const p3 = points[(index + 2) % count];

        return {
          x: catmullRom(p0[0], p1[0], p2[0], p3[0], localT),
          y: catmullRom(p0[1], p1[1], p2[1], p3[1], localT)
        };
      }

      function placeBird(progress) {
        const rect = bird.getBoundingClientRect();
        const margin = 12;
        const availableWidth = Math.max(0, window.innerWidth - rect.width - margin * 2);
        const availableHeight = Math.max(0, window.innerHeight - rect.height - margin * 2);
        const current = getLoopPoint(progress);
        const next = getLoopPoint(progress + 0.0015);
        const x = margin + current.x * availableWidth;
        const y = margin + current.y * availableHeight;

        bird.style.transform = `translate3d(${x}px, ${y}px, 0)`;

        if (birdSvg) {
          birdSvg.style.transform = next.x >= current.x ? "scaleX(1)" : "scaleX(-1)";
        }
      }

      function poseWing(wing, rootX, rootY, angle, lengthScale, widthScale, opacity, blur) {
        if (!wing) return;
        wing.setAttribute(
          "transform",
          `translate(${rootX} ${rootY}) rotate(${angle.toFixed(2)}) scale(${widthScale.toFixed(3)} ${lengthScale.toFixed(3)}) translate(${-rootX} ${-rootY})`
        );
        wing.style.opacity = opacity.toFixed(3);
        wing.style.filter = `blur(${blur.toFixed(2)}px)`;
      }

      function flapWings(now) {
        // Real dragonfly wings move mostly out of the viewing plane. In a top view,
        // that appears as rapid shortening/lengthening rather than broad paddle-like rotation.
        const cycle = now * 0.155;
        const foreTopWave = Math.sin(cycle);
        const foreBottomWave = Math.sin(cycle + 0.10);
        const hindTopWave = Math.sin(cycle + 0.72);
        const hindBottomWave = Math.sin(cycle + 0.82);

        function wingValues(wave, baseAngle, angleSwing) {
          const edge = Math.abs(wave);
          return {
            angle: baseAngle + wave * angleSwing,
            length: 0.54 + edge * 0.46,
            width: 0.90 + edge * 0.10,
            opacity: 0.34 + edge * 0.52,
            blur: 0.10 + (1 - edge) * 0.42
          };
        }

        const topFore = wingValues(foreTopWave, 0.8, 3.2);
        const bottomFore = wingValues(foreBottomWave, -0.5, -2.2);
        const topHind = wingValues(hindTopWave, -0.4, 1.8);
        const bottomHind = wingValues(hindBottomWave, 0.4, -1.8);

        poseWing(wingTopFore, 106, 46, topFore.angle, topFore.length, topFore.width, topFore.opacity, topFore.blur);
        poseWing(wingBottomFore, 106, 54, bottomFore.angle, bottomFore.length, bottomFore.width, bottomFore.opacity, bottomFore.blur);
        poseWing(wingTopHind, 99, 46, topHind.angle, topHind.length, topHind.width, topHind.opacity, topHind.blur);
        poseWing(wingBottomHind, 99, 54, bottomHind.angle, bottomHind.length, bottomHind.width, bottomHind.opacity, bottomHind.blur);

        if (dragonflyBody) {
          const recoil = Math.sin(cycle * 0.25) * 0.08;
          dragonflyBody.setAttribute(
            "transform",
            `translate(0 ${recoil.toFixed(2)}) rotate(${(recoil * 0.12).toFixed(2)} 100 50)`
          );
        }
      }

      function frame(now) {
        if (!lastTime) lastTime = now;
        const elapsed = Math.min(now - lastTime, 64);
        lastTime = now;

        if (!paused) {
          phase = (phase + elapsed / loopDuration) % 1;
        }

        placeBird(phase);
        flapWings(now);
        window.requestAnimationFrame(frame);
      }

      function pauseFlight() { paused = true; }
      function resumeFlight() { paused = false; }

      bird.addEventListener("pointerenter", pauseFlight);
      bird.addEventListener("pointerleave", resumeFlight);
      bird.addEventListener("focus", pauseFlight);
      bird.addEventListener("blur", resumeFlight);
      bird.addEventListener("click", function () {
        paused = false;
        bird.blur();
        lastTime = performance.now();
      });
      window.addEventListener("resize", function () { placeBird(phase); });

      placeBird(phase);
      window.requestAnimationFrame(frame);
    })();
