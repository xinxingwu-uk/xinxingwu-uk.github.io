			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';

					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Public-key cryptography uses different keys for encryption and decryption. One key can be public while the other remains private.

- RSA-style ideas rely on modular exponentiation and the difficulty of reversing certain number-theoretic operations at large sizes.

- Homomorphic encryption is an advanced idea: some computations can be performed on encrypted data without first decrypting it.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Tiny RSA-style demonstration</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Choose p=5, q=11, so n=55 and $\phi(n)=40$. Choose e=3 because gcd(3,40)=1.

- **Step-by-step solution.** Find d with $3d≡1 (\bmod 40): d=27$. A message m=7 encrypts to c=$7^3$ mod 55=13; decrypting uses $13^{27}$ mod 55=7.

- **Why it matters.** Tiny numbers are insecure, but the structure shows the idea.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Affine cipher</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Encrypt x by E(x)=5x+8 mod 26. Encrypt A=0.

- **Step-by-step solution.** E(0)=8, so A encrypts to I. To decrypt, use the inverse of 5 mod 26, which is 21.

- **Why it matters.** Invertibility requires gcd(5,26)=1.
   </div>
</div>
</textarea></section>

</section>

> Caesar Cipher



<div class="definition-com-container">
  <div class="definition-com-title">Cipher Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A Caesar cipher shifts every letter in a message by a fixed number of positions in the alphabet.

- Use the numerical representation

$$
A=0,\ B=1,\ C=2,\ \ldots,\ Z=25.
$$

Let:
- $x$ be the numerical value of the original letter.
- $k$ be the shift key.
- $E(x)$ be the encrypted letter.
- $D(x)$ be the decrypted letter.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Cipher Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The encryption rule is

$$
E(x)=(x+k)\bmod 26.
$$

- The decryption rule is

$$
D(x)=(x-k)\bmod 26.
$$
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Cipher Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For this example, use the key

$$
\boxed{k=3}.
$$

- This means that every letter moves three positions forward.

| Original | A | B | C | D | E | F | G | H |
|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|:---:|
| Encrypted | D | E | F | G | H | I | J | K |
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Cipher Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The pattern continues through the alphabet. Letters near the end wrap around:

$$
X\rightarrow A,\qquad
Y\rightarrow B,\qquad
Z\rightarrow C.
$$
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Encryption Pseudocode</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
PROCEDURE CaesarEncrypt(message, key)

    encryptedMessage ← empty string

    FOR each character in message

        IF character is a letter THEN

            x ← numerical position of character
            encryptedValue ← (x + key) MOD 26
            encryptedLetter ← letter represented by encryptedValue

            ADD encryptedLetter to encryptedMessage

        ELSE

            ADD character to encryptedMessage

        END IF

    END FOR

    RETURN encryptedMessage

END PROCEDURE
```
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Decryption Pseudocode</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
PROCEDURE CaesarDecrypt(ciphertext, key)

    originalMessage ← empty string

    FOR each character in ciphertext

        IF character is a letter THEN

            x ← numerical position of character
            originalValue ← (x - key) MOD 26
            originalLetter ← letter represented by originalValue

            ADD originalLetter to originalMessage

        ELSE

            ADD character to originalMessage

        END IF

    END FOR

    RETURN originalMessage

END PROCEDURE
```
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Worked Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Encrypt the message

```
MEET AT NOON
```

using the shift key

$$
k=3.
$$
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Letter-by-Letter Encryption


<div style="font-size: 20px;">

| Original letter | Numerical value |    Calculation   | Encrypted value | Encrypted letter |
| :-------------: | :-------------: | :--------------: | :-------------: | :--------------: |
|        M        |        12       | $(12+3)\bmod 26$ |        15       |         P        |

<div class="definition-com-container">

- To decrypt the first letter $P$, use

$$P=15.$$

- Apply the decryption rule:

$$D(15)=(15−3)\bmod 26.$$
$$D(15)=12.$$

- The letter represented by 12 is M.
   </div>

<div class="definition-com-container">

<div class="definition-com-container">

- Sender
	- Choose a short message.

	- Encrypt the message.

- Receiver
	- Obtain the shift key from the sender.

<div class="definition-com-container">

  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A Caesar cipher is not secure because there are only 25 possible nonzero shift keys.

- An attacker can try every possible key. This method is called a brute-force attack.

- For the ciphertext

<div style="text-align:center;">

<div class="definition-com-container">
  <div class="definition-com-title">Frequency Analysis</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- An attacker may also study how often letters appear.

- In English:

	- E is one of the most common letters.
	- T, A, O, I, and N are also common.
	- Common short words include A, I, THE, TO, and AT.

- In a long encrypted message, the attacker may guess that the most frequent encrypted letter represents E. The attacker can then estimate the shift.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Frequency Analysis (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For example, suppose the most common ciphertext letter is H.

- Using numerical values,

$$H=7,E=4.$$

- The possible shift is

$$7−4=3.$$

- Thus, the attacker may guess

$$k=3.$$
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The Caesar cipher successfully hides the original message from someone who reads only the ciphertext casually. The same shift key is used for every letter, so encryption and decryption are simple.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Explanation of the Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- However, the cipher is weak because:

	- It has only 25 useful keys.
	- Every occurrence of the same letter is encrypted in the same way.
	- Common letter and word patterns remain visible.
	- An attacker can quickly test every possible key.

- The Caesar cipher is useful for learning modular arithmetic and basic cryptography, but it should not be used to protect real passwords, financial data, student records, or private communications.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
