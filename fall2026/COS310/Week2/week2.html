		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);

		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A set is a collection of distinct objects. Set operations such as union, intersection, difference, and complement describe relationships among collections.

- A function maps each element of a domain to exactly one element of a codomain.

- Sequences list ordered terms, summations add patterned terms, and matrices arrange values in rows and columns.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<p class="definition-rainbow-title">Basic examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Course enrollment sets</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Let A={students in AI}, B={students in Discrete Math}. Interpret $A\cap B$ and $A\cup B$.

- **Step-by-step solution.** $A\cap B$ contains students taking both courses. A∪B contains students taking at least one of the two courses.

- **Check.** A Venn diagram helps see overlap and total participation.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Function or not?</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Rule: f(student)=student ID. Rule: g(student)=courses the student takes.

- **Step-by-step solution.** $f$ is a function because each student has one ID. $g$ is not a function to a single course because one student may take many courses, unless the codomain is sets of courses.

- **Check.** Choosing the codomain carefully can turn messy data into a valid model.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Cardinality compares set sizes. Finite sets are counted by number of elements; infinite sets require one-to-one correspondences.

- Function composition combines processes: $(g \circ f)(x) = g(f(x))$. Inverse functions undo mappings when they are one-to-one and onto.

- Matrices can represent relations, networks, image pixels, and transformations.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Composition of functions</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Let $f(x)=2x+1$ and $g(x)=x^2$. Find $g(f(3))$ and $f(g(3))$.

- **Step-by-step solution.** $f(3)=7$, so $g(f(3))=49$. $g(3)=9$, so $f(g(3))=19$.

- **Why it matters.** Order matters; composition is usually not commutative.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Matrix representation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Represent friendship among $A$, $B$, $C$ with a 0-1 matrix where 1 means “is friends with.”

- **Step-by-step solution.** If $A$ is friends with $B$ and $C$, first row is [0,1,1]. If friendship is mutual, the matrix is symmetric.

- **Why it matters.** A matrix makes social structure computable.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Build a tiny student-course dataset. Use set operations to answer three questions, define one valid function from the data, and represent one relationship as a 0-1 matrix.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Dataset Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Let the set of students be

$$
S = \lbrace\text{Ana},\text{Ben},\text{Cara},\text{Diego}\rbrace.
$$

Let the set of courses be

$$
C = \lbrace\text{Discrete Math},\text{Programming},\text{Statistics}\rbrace.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Dataset Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The course enrollment sets are:

$$
D =\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace
$$

where $D$ is the set of students enrolled in **Discrete Math**,

$$
P = \lbrace\text{Ben},\text{Diego}\rbrace
$$

where $P$ is the set of students enrolled in **Programming**, and

$$
T = \lbrace\text{Cara},\text{Diego}\rbrace
$$

where $T$ is the set of students enrolled in **Statistics**.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Student–Course Table</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Student | Discrete Math | Programming | Statistics |
|:---|:---:|:---:|:---:|
| Ana | Yes | No | No |
| Ben | Yes | Yes | No |
| Cara | Yes | No | Yes |
| Diego | No | Yes | Yes |
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Question 1**: Who Is Enrolled in Both Discrete Math and Programming?

Use the intersection operation:

$$
D \cap P
$$

Substitute the course enrollment sets:

$$
D \cap P =
\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace
\cap
\lbrace\text{Ben},\text{Diego}\rbrace.
$$

Therefore,

$$
\boxed{D \cap P = \lbrace\text{Ben}\rbrace}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

**Answer:** Ben is enrolled in both Discrete Math and Programming.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Question 2**: Who Is Enrolled in Discrete Math or Statistics?

Use the union operation:

$$
D \cup T.
$$

Substitute the course enrollment sets:

$$
D \cup T=\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace
\cup
\lbrace\text{Cara},\text{Diego}\rbrace.
$$

Therefore,

$$
\boxed{D \cup T =
\lbrace\text{Ana},\text{Ben},\text{Cara},\text{Diego}\rbrace
}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

**Answer:** All four students are enrolled in Discrete Math or Statistics.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Question 3**: Who Is Enrolled in Discrete Math but Not Programming?

Use the set-difference operation:

$$
D - P.
$$

Substitute the course enrollment sets:

$$
D - P =\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace-\lbrace\text{Ben},\text{Diego}\rbrace.
$$

Ben is removed because Ben is also enrolled in Programming.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Questions (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Therefore,

$$
\boxed{D - P = \lbrace\text{Ana},\text{Cara}\rbrace}.
$$

**Answer:** Ana and Cara are enrolled in Discrete Math but not Programming.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">A Valid Function</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Define a function

$$
f:S\rightarrow C
$$

that assigns each student exactly one primary course.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">A Valid Function (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Let

$$
f(\text{Ana})=\text{Discrete Math},
$$

$$
f(\text{Ben})=\text{Programming},
$$

$$
f(\text{Cara})=\text{Statistics},
$$

and

$$
f(\text{Diego})=\text{Programming}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">A Valid Function (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The function can be written as

$$
f=\lbrace
(\text{Ana},\text{Discrete Math}),
(\text{Ben},\text{Programming}),
$$

$$
(\text{Cara},\text{Statistics}),
(\text{Diego},\text{Programming})
\rbrace.
$$

- This is a valid function because every student in \(S\) is assigned to exactly one primary course in \(C\).

- Different students may be assigned to the same course. Therefore, the function does not need to be one-to-one.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Student–Course Relationship</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Define the enrollment relation

$$
R\subseteq S\times C.
$$

- A pair \((s,c)\) belongs to \(R\) when student \(s\) is enrolled in course \(c\).
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Student–Course Relationship (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The relation is

$$
\begin{aligned}
R=\lbrace&
(\text{Ana},\text{Discrete Math}),\newline
&
(\text{Ben},\text{Discrete Math}),
(\text{Ben},\text{Programming}),\newline
&
(\text{Cara},\text{Discrete Math}),
(\text{Cara},\text{Statistics}),\newline
&
(\text{Diego},\text{Programming}),
(\text{Diego},\text{Statistics})
\rbrace.
\end{aligned}
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Use the following row order:

$$
\text{Ana},\text{Ben},\text{Cara},\text{Diego}.
$$

Use the following column order:

$$
\text{Discrete Math},\text{Programming},\text{Statistics}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The enrollment relation is represented by the matrix

$$
M_R=
\begin{bmatrix}
1 & 0 & 0\newline
1 & 1 & 0\newline
1 & 0 & 1\newline
0 & 1 & 1
\end{bmatrix}.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

In this matrix:

- \(1\) means that the student is enrolled in the course.
- \(0\) means that the student is not enrolled in the course.

For example, the second row is

$$
\begin{bmatrix}
1 & 1 & 0
\end{bmatrix}.
$$

- This row shows that Ben is enrolled in Discrete Math and Programming but not Statistics.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Question**

Which students are enrolled in Discrete Math but not Programming?

**Step 1**: Identify the Sets

$$
D=\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace
$$

and

$$
P=\lbrace\text{Ben},\text{Diego}\rbrace.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

**Step 2**: Apply Set Difference

$$
D-P.
$$

Start with the students in \(D\):

$$
\lbrace\text{Ana},\text{Ben},\text{Cara}\rbrace.
$$

Remove anyone who also appears in \(P\).

Because Ben appears in both sets, Ben is removed.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Therefore,

$$
D-P=\lbrace\text{Ana},\text{Cara}\rbrace.
$$

- **Result**

$$
\boxed{\text{Ana and Cara}}
$$

are enrolled in Discrete Math but not Programming.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This model shows how sets, functions, relations, and matrices can describe the same student-course dataset in different ways.

	- Sets make it easy to compare course enrollments.
	- Intersection finds students shared by two courses.
	- Union combines students from multiple courses.
	- Set difference finds students in one course but not another.
	- A function assigns exactly one primary course to every student.
	- A 0–1 matrix provides a compact representation of the complete enrollment relationship.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The model could be used by a college to compare class rosters, identify students taking multiple courses, and store enrollment data in a computer system.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
