		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A sample space is the set of possible outcomes. An event is a subset of the sample space.

- For equally likely outcomes, probability is favorable outcomes divided by total outcomes.

- Probability connects counting to uncertainty.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Rolling a die</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** What is the probability of rolling an even number?

- **Step-by-step solution.** Sample space {1,2,3,4,5,6}. Favorable outcomes {2,4,6}. Probability =3/6=1/2.

- **Check.** The event is a subset of outcomes.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Two coins</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** What is the probability of exactly one head?

- **Step-by-step solution.** Outcomes: HH, HT, TH, TT. Favorable: HT, TH. Probability=2/4=1/2.

- **Check.** Order matters in the sample space if coins are distinguishable by position.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Conditional probability $P(A|B)$ measures the probability of $A$ after knowing $B$ occurred.

- Bayes’ theorem reverses conditional probabilities and is important in diagnosis, classification, and evidence updating.

- Expected value is the long-run average outcome of a random process.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Conditional probability</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** A class has 12 CS majors and 8 math majors. Six CS majors and two math majors are seniors. If a randomly chosen student is a senior, what is P(CS)?

- **Step-by-step solution.** There are 8 seniors, 6 of whom are CS. ${\rm{P}}({\rm{CS}} | {\rm{senior}})=6/8=3/4$.

- **Why it matters.** Conditioning changes the sample space.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Expected value</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** A game pays `$10` with probability 0.2 and `$0` otherwise. What is expected payout?

- **Step-by-step solution.** $E=10(0.2)+0(0.8)=2$ dollars.

- **Why it matters.** Expected value is not necessarily a possible single outcome.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Create a small probability experiment using cards, dice, or simulated outcomes. Define the sample space, compute one probability, one conditional probability, and one expected value.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



> Probability Experiment: Rolling a Fair Die



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Experiment Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Roll one fair six-sided die one time.

- Let the random variable $X$ represent the number shown on the die.

- Because the die is fair, every outcome has the same probability:

$$
P(X=x)=\frac{1}{6},
\qquad
x\in\lbrace 1,2,3,4,5,6\rbrace.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Sample Space</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The sample space contains all possible outcomes:

$$
S=\lbrace 1,2,3,4,5,6\rbrace.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Sample Space (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Each outcome is equally likely.

| Outcome | Probability |
|:---:|:---:|
| 1 | $\frac{1}{6}$ |
| 2 | $\frac{1}{6}$ |
| 3 | $\frac{1}{6}$ |
| 4 | $\frac{1}{6}$ |
| 5 | $\frac{1}{6}$ |
| 6 | $\frac{1}{6}$ |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Define Two Events</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let $A$ be the event that the result is even:

$$
A=\lbrace 2,4,6\rbrace.
$$

- Let $B$ be the event that the result is greater than $3$:

$$
B=\lbrace 4,5,6\rbrace.
$$

- The outcomes that are both even and greater than $3$ are

$$
A\cap B=\lbrace 4,6\rbrace.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Probability of an Even Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- We want to compute

$$
P(A).
$$

- Event $A$ contains three outcomes:

$$
A=\lbrace 2,4,6\rbrace.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Probability of an Even Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The sample space contains six outcomes. Therefore,

$$
P(A)=\frac{|A|}{|S|}.
$$

- Substitute the values:

$$
P(A)=\frac{3}{6}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Probability of an Even Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Simplify:

$$
\boxed{P(A)=\frac{1}{2}}.
$$

- Therefore, the probability of rolling an even number is

$$
\frac{1}{2}=0.5=50\%.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Conditional Probability</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Now suppose we already know that the result is greater than \(3\).

- The possible outcomes are restricted to

$$
B=\lbrace 4,5,6\rbrace.
$$
  </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Conditional Probability (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Among these outcomes, the even results are

$$
A\cap B=\lbrace 4,6\rbrace.
$$

- The conditional probability is

$$
P(A\mid B)=\frac{P(A\cap B)}{P(B)}.
$$
  </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Conditional Probability (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Because

$$
P(A\cap B)=\frac{2}{6}
$$

and

$$
P(B)=\frac{3}{6},
$$

- we obtain

$$
P(A\mid B)=\frac{\frac{2}{6}}{\frac{3}{6}}.
$$
  </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Conditional Probability (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Simplifying gives

$$
P(A\mid B)=\frac{2}{3}.
$$

- Therefore,

$$
\boxed{P(A\mid B)=\frac{2}{3}}.
$$

- This means that when the result is known to be greater than \(3\), the probability that it is even is approximately

$$
66.7\%.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Expected Value</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let $X$ be the number shown on the die.

- The expected value of $X$ is

$$
E(X)=\sum_x xP(X=x).
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Expected Value (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Because each outcome has probability $\frac{1}{6}$,

$$
E(X)=
1\left(\frac{1}{6}\right)
+
2\left(\frac{1}{6}\right)
+
3\left(\frac{1}{6}\right)
+
4\left(\frac{1}{6}\right)
+
5\left(\frac{1}{6}\right)
+
6\left(\frac{1}{6}\right).
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Expected Value (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

-  Factor out $\frac{1}{6}$:

$$
E(X)=\frac{1}{6}(1+2+3+4+5+6).
$$

- Add the outcomes:

$$
1+2+3+4+5+6=21.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Expected Value (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Therefore,

$$
E(X)=\frac{21}{6}.
$$

Simplify:

$$
\boxed{E(X)=3.5}.
$$

- The expected value is not an outcome that must appear on one roll. Instead, it represents the long-run average result after many rolls.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose the die is rolled and the instructor tells us:

> The result is greater than $3$.

The possible outcomes are now

$$
\lbrace 4,5,6\rbrace.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- We want to determine the probability that the result is even.

- The even outcomes in this restricted sample space are

$$
\lbrace 4,6\rbrace.
$$

- Therefore,

$$
P(\text{even}\mid\text{greater than }3)=\frac{2}{3}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The final result is

$$
\boxed{\frac{2}{3}}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Results Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Question | Calculation | Result |
|:---|:---|:---:|
| Probability of an even result | $\frac{3}{6}$ | $\frac{1}{2}$ |
| Probability of even given greater than $3$ | $\frac{2}{3}$ | $\frac{2}{3}$ |
| Expected die value | $\frac{1+2+3+4+5+6}{6}$ | $3.5$ |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The probability of rolling an even number is

$$
\frac{1}{2}
$$

because three of the six possible outcomes are even.

- When we know that the result is greater than $3$, the sample space changes from six outcomes to only three outcomes:

$$
\lbrace 4,5,6\rbrace.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Two of these three outcomes are even, so the conditional probability becomes

$$
\frac{2}{3}.
$$

- The expected value is

$$
3.5,
$$

which represents the average outcome we would expect over many die rolls. It does not mean that a single roll can produce $3.5$.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Sample space:**

$$
S=\lbrace 1,2,3,4,5,6\rbrace.
$$

- **Probability of an even result:**

$$
\boxed{P(A)=\frac{1}{2}}.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Conditional probability of an even result given that it is greater than $3$:**

$$
\boxed{P(A\mid B)=\frac{2}{3}}.
$$

- **Expected value:**

$$
\boxed{E(X)=3.5}.
$$
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
