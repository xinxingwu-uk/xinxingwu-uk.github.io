		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

<section data-markdown id="ch1" class="center"><textarea data-template>

<p class="definition-rainbow-title">Introduction</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">LLM vs. Agent AI</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

LLM and Agent AI are related, but they are not the same.

<hr>

- LLM = the brain

- Agent AI = the brain + tools + goals + actions

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">LLM</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- An LLM, or Large Language Model, mainly generates text based on your prompt. For example,

```
Qwen3-8B
DeepSeek-R1-8B
Llama
GPT
Claude
Gemini
```

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">LLM</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

An LLM can:

```
answer questions
summarize text
write emails
explain code
translate
brainstorm ideas
```

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">LLM</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- But by itself, an LLM usually does not automatically take actions unless connected to tools.

```
You: Summarize this paper.
LLM: Here is the summary...
```
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Model recommendations (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Gemma 4 12B is worth considering for laptop-friendly multimodal use; Google describes it as designed to bring high-performance multimodal intelligence directly to laptops. 

- Llama 4 Scout and Maverick are open-weight multimodal MoE models, but they are more hardware-demanding.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Agent AI</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

An Agent AI uses an LLM as its brain, but also has extra abilities. An Agent AI can:

```
follow a goal
choose steps
use tools
search documents
call APIs
run code
use RAG
remember context
make decisions within limits
complete workflows
```
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Agent AI</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Example

```
You: Review my grant draft and prepare a weakness report.
Agent AI:
1. Searches your uploaded grant documents
2. Reads the specific aims
3. Checks the research strategy
4. Identifies weaknesses
5. Suggests revisions
6. Produces a structured report
```

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Comparison</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
| Feature                     |                      LLM |                     Agent AI |
| --------------------------- | -----------------------: | ---------------------------: |
| Generates text              |                      Yes |                          Yes |
| Understands prompts         |                      Yes |                          Yes |
| Uses tools                  |            Not by itself |                          Yes |
| Searches local documents    | Only if connected to RAG |             Yes, through RAG |
| Runs code                   |            Not by itself |         Can, if tool enabled |
| Follows multi-step workflow |                  Limited |                     Stronger |
| Takes actions               |                       No |            Can, if permitted |
| Has a role/task             |                  General |                  Specialized |
| Example                     |                 Qwen3-8B | LocalMind Grant Review Agent |

```
   </div>
</div>


</textarea></section>

</section>

<section data-markdown id="ch2" class="center"><textarea data-template>

<p class="definition-rainbow-title">Local Agent AI vs. LocalMind Studio</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="question-container">
  <div class="question-title">Local Agent AI vs. LocalMind Studio</div>
  <div class="question-shadebox">
  <div style="width: 800px;"></div>

LocalMind Studio is the whole local AI system/project.

Local Agent AI is one intelligent assistant you create inside that system.

```
LocalMind Studio = the whole office/lab
Local Agent AI = one worker/assistant inside the office
```
   </div>
</div>




<div class="definition-container">
  <div class="definition-title">Difference</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

```
| Item                   | Meaning                                        | Example                                        |
| ---------------------- | ---------------------------------------------- | ---------------------------------------------- |
| **LocalMind Studio**   | The full local AI platform on your computer    | Ollama + Open WebUI + models + RAG + documents |
| **Local Agent AI**     | A customized assistant inside LocalMind Studio | LocalMind Agent, LocalMind Reasoning Agent     |
| **Qwen3-8B**           | A base model/brain                             | Good for writing, grants, teaching             |
| **DeepSeek-R1-8B**     | Another base model/brain                       | Good for reasoning, coding, math               |
| **RAG**                | Local document memory/search                   | Your PDFs, grants, papers, course materials    |
| **Agent instructions** | The role/personality/task rules                | “You are a grant-review assistant…”            |

```
   </div>
</div>




<div class="definition-container">
  <div class="definition-title">Structure</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

```

LocalMind Studio
│
├── Ollama
│   ├── qwen3:8b
│   ├── deepseek-r1:8b
│   └── nomic-embed-text
│
├── Open WebUI
│
├── RAG / Knowledge Base
│   ├── Papers
│   ├── Grants
│   ├── Course materials
│   └── Other documents
│
└── Local Agent AIs
    ├── LocalMind Agent
    └── LocalMind Reasoning Agent
```
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">LocalMind Studio Lite</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

```
Ollama
+ Open WebUI
+ Qwen3-8B
+ DeepSeek-R1-8B
+ nomic-embed-text
+ RAG
```
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Local Agent AI</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

LocalMind Agent With

```
Base model: qwen3:8b
Knowledge: your uploaded documents
Role: help with research, grant writing, teaching, email polishing
```
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Local Agent AI</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

LocalMind Reasoning Agent with

```
Base model: deepseek-r1:8b
Knowledge: your uploaded documents
Role: coding, logic, math, technical reasoning
```
   </div>
</div>




<div class="definition-container">
  <div class="definition-title">Summary</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

LocalMind Studio is the environment.

Local Agent AI is the customized assistant living inside that environment.

So you are not choosing one over the other. You are building:

```
LocalMind Studio
```

and inside it, you create:

```
LocalMind Agent
LocalMind Reasoning Agent
Grant Review Agent
Course Design Agent
Paper Review Agent
```
   </div>
</div>



<div class="question-container">
  <div class="question-title">My LLM is:</div>
  <div class="question-shadebox">
  <div style="width: 800px;"></div>

```

```

   </div>
</div>

- LocalMind Agent = qwen3:8b + system prompt + RAG + documents + optional tools

   </div>
</div>




<div class="question-container">

  <div class="question-shadebox">
  <div style="width: 800px;"></div>

- LLM = a smart professor

- Agent AI = a smart professor with a computer, files, calculator, checklist, and permission to complete tasks

   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
