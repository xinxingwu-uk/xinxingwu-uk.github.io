		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}
	</script>

<section data-markdown id="ch1" class="center"><textarea data-template>

<p class="definition-rainbow-title">Environment and Strucutrue</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Structure</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Ollama or LM Studio + Open WebUI + Qwen/DeepSeek/Gemma/Llama model + RAG

<hr>

- Ollama is simple for local model running, and its model library already includes families like Qwen3 in sizes from small models to large MoE variants. 

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Structure (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- LM Studio is also good, especially if you prefer a GUI; its system requirements recommend at least 16 GB RAM and 4 GB dedicated VRAM.

- Open WebUI can run self-hosted/offline, supports runners such as Ollama and OpenAI-compatible APIs, and includes RAG features.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Model recommendations</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Purpose                    | Good local models                                                        |
| -------------------------- | ------------------------------------------------------------------------ |
| General research assistant | **Qwen3 14B/32B**, **Gemma 4 12B**, **Llama 3.3 70B** if hardware allows |
| Reasoning/math/coding      | **DeepSeek-R1-Distill 14B/32B/70B**, **Qwen3-Coder**                     |
| Coding assistant           | **Qwen3-Coder-30B-A3B**, Qwen3-Coder-Next, DeepSeek-Coder/R1 distill     |
| Lightweight laptop use     | Qwen3 4B/8B, Gemma 4 12B, DeepSeek-R1-Distill 8B                         |
| Multimodal/image-text      | Gemma 4, Llama 4 Scout/Maverick, Qwen3-VL                                |

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Model recommendations</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Qwen3 is a strong general choice because it includes dense and MoE models from 0.6B to 235B parameters, supports thinking/non-thinking modes, and is publicly accessible under Apache 2.0 according to its technical report.

- DeepSeek-R1 is especially attractive for reasoning; its released distill models include 1.5B, 7B, 8B, 14B, 32B, and 70B checkpoints. 
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Model recommendations (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Gemma 4 12B is worth considering for laptop-friendly multimodal use; Google describes it as designed to bring high-performance multimodal intelligence directly to laptops. 

- Llama 4 Scout and Maverick are open-weight multimodal MoE models, but they are more hardware-demanding.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Hardware recommendation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Hardware                    | What to run                                        |
| --------------------------- | -------------------------------------------------- |
| 16–32 GB RAM, no strong GPU | 4B–8B quantized models                             |
| 16 GB GPU VRAM              | 8B–14B models comfortably                          |
| 24 GB GPU VRAM              | 14B–32B quantized models                           |
| 48 GB GPU VRAM              | 32B very good; some 70B quantized models possible  |
| 2×48 GB or more             | 70B models much better; larger MoE models possible |
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Hardware recommendation (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For local LLMs, VRAM is usually more important than raw GPU speed. 

- Quantization is key: Q4 or Q5 GGUF models can greatly reduce memory while preserving much of the quality.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">VRAM</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- VRAM (Video Random Access Memory) is a specialized type of computer memory dedicated to storing image data and visual assets. Acting as a high-speed holding zone, it provides your graphics card (GPU) with instant access to the textures, shapes, and lighting calculations required to render visuals smoothly.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">My computer has</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

RAM: 32 GB

GPU: 4 GB

Storage: more 150 GB free

CPU: Intel i7-1370P


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Structure</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ollama = local model engine

- Open WebUI = ChatGPT-like interface

- Qwen3-8B = daily assistant for writing, summarizing, teaching, email, grants

- DeepSeek-R1-8B = reasoning assistant for logic, math, coding, analysis

- RAG = local document search over your PDFs, Word files, papers, grants

   </div>
</div>




> Ollama + Open WebUI + Qwen3-8B + DeepSeek-R1-8B + RAG


</textarea></section>

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
