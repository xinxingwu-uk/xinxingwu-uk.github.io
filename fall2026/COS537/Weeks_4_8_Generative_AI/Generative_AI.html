MOVIE_TOOLS = {
    "image_generator_tool",
    "image_variation_tool",
    "add_title_tool",
    "image_to_story_tool",
}

def extract_json_array(text: str) -> list[str] | None:
    match = re.search(r"\[[\s\S]*?\]", text)
    if not match:
        return None
    try:
        value = json.loads(match.group(0))
    except json.JSONDecodeError:
        return None
    if not isinstance(value, list) or not all(isinstance(x, str) for x in value):
        return None
    return value

def plan_movie_task(instruction: str) -> tuple[list[str], str]:
    planner_prompt = f"""
    You are planning a tool workflow. Available tools:
    - image_generator_tool: create the first poster
    - image_variation_tool: create a different poster
    - add_title_tool: add the movie title to an image
    - image_to_story_tool: write a story from an image

    User request: {instruction}

    Return only a JSON array of tool names in execution order.
    """
    raw = ask_vlm(planner_prompt, max_new_tokens=120)
    plan = extract_json_array(raw)
    required_plan = [
        "image_generator_tool",
        "add_title_tool",
        "image_variation_tool",
        "add_title_tool",
        "image_to_story_tool",
    ]
    # The planner may omit a required step or repeat tools in an unsafe order.
    # Normalize to the validated workflow when its proposal is incomplete.
    if plan != required_plan:
        plan = required_plan
    return plan, raw

def run_movie_agent(title: str, concept: str, rating: str = "PG-13") -> AgentResult:
    instruction = (
        f"Create two different posters and a poster-grounded story for a {rating} movie "
        f"called {title}. Concept: {concept}"
    )
    plan, raw_plan = plan_movie_task(instruction)
    trace: list[ToolEvent] = [ToolEvent("planner_raw_output", instruction, raw_plan)]

    base_prompt = (
        f"cinematic {rating} movie poster for {title}, {concept}, dramatic lighting, "
        "clear focal subject, no readable text"
    )
    first_path = image_generator_tool(base_prompt)
    trace.append(ToolEvent("image_generator_tool", base_prompt, first_path))

    first_path = add_title_tool(first_path, title.upper())
    trace.append(ToolEvent("add_title_tool", title, first_path))

    second_path = image_variation_tool(base_prompt)
    trace.append(ToolEvent("image_variation_tool", base_prompt, second_path))

    second_path = add_title_tool(second_path, title.upper())
    trace.append(ToolEvent("add_title_tool", title, second_path))

    story = image_to_story_tool(first_path, title=title, rating=rating)
    trace.append(ToolEvent("image_to_story_tool", first_path, story))

    return AgentResult(
        output={"poster_1": first_path, "poster_2": second_path, "story": story},
        plan=plan,
        trace=trace,
    )

from ddgs import DDGS
from urllib.parse import urlparse

def product_web_search(query: str, max_results: int = 5) -> list[dict]:
    """Return text search results for a product query."""
    try:
        return DDGS(timeout=15).text(
            query,
            region="us-en",
            safesearch="on",
            max_results=max_results,
        )
    except Exception as exc:
        return [{"error": f"Search failed: {type(exc).__name__}: {exc}"}]

def image_web_search(query: str, output_path: str = "retrieved_product.jpg") -> dict:
    """Find and download one candidate reference image."""
    try:
        results = DDGS(timeout=15).images(
            query,
            region="us-en",
            safesearch="on",
            max_results=5,
        )
    except Exception as exc:
        return {"error": f"Image search failed: {type(exc).__name__}: {exc}"}

    for item in results:
        url = item.get("image")
        if not url:
            continue
        try:
            response = requests.get(
                url,
                timeout=20,
                headers={"User-Agent": "Mozilla/5.0"},
            )
            response.raise_for_status()
            image = PILImage.open(__import__("io").BytesIO(response.content)).convert("RGB")
            image.thumbnail((1000, 1000))
            image.save(output_path)
            return {
                "local_path": output_path,
                "image_url": url,
                "source_page": item.get("url"),
                "title": item.get("title"),
            }
        except Exception:
            continue
    return {"error": "No downloadable image was found."}

def image_comparison_tool(image_path_1: str, image_path_2: str, product_name: str) -> str:
    prompt = f"""
    Compare these two product images for visible similarity to {product_name!r}.
    Discuss silhouette, colors, materials, logos, panel layout, sole, stitching, and other visible details.
    Clearly state that image similarity cannot establish authenticity.
    Do not invent model numbers or hidden manufacturing details.
    """
    return ask_vlm(prompt, [image_path_1, image_path_2], max_new_tokens=420)

def plan_product_task(instruction: str) -> tuple[list[str], str]:
    prompt = f"""
    Plan a product-image research workflow using only these tools:
    product_web_search, image_web_search, image_comparison_tool.
    User request: {instruction}
    Return only a JSON array of tool names in order.
    """
    raw = ask_vlm(prompt, max_new_tokens=100)
    plan = extract_json_array(raw)
    required_plan = ["product_web_search", "image_web_search", "image_comparison_tool"]
    if plan != required_plan:
        plan = required_plan
    return plan, raw

def run_product_research_agent(local_image: str, product_name: str) -> AgentResult:
    instruction = f"Research whether the pictured item visually resembles {product_name}."
    plan, raw_plan = plan_product_task(instruction)
    trace = [ToolEvent("planner_raw_output", instruction, raw_plan)]

    search_results = product_web_search(product_name)
    trace.append(ToolEvent("product_web_search", product_name, search_results))

    image_result = image_web_search(product_name)
    trace.append(ToolEvent("image_web_search", product_name, image_result))

    if "local_path" in image_result:
        comparison = image_comparison_tool(
            local_image,
            image_result["local_path"],
            product_name,
        )
    else:
        comparison = "A reference image could not be downloaded, so visual comparison was not completed."
    trace.append(ToolEvent("image_comparison_tool", image_result, comparison))

    report = {
        "comparison": comparison,
        "search_results": search_results,
        "reference_image": image_result,
        "caution": (
            "This is visual research, not authentication. Confirm model numbers, seller reputation, "
            "receipts, labels, and manufacturer or authorized-retailer records."
        ),
    }
    return AgentResult(output=report, plan=plan, trace=trace)

- Step 6 - Agent evaluation rubric

<div style="font-size: 16px;">

| Dimension | Questions |
|---|---|
| Planning | Were all required tools selected in a valid order? |
| Tool correctness | Did each tool receive the right arguments? |
| Grounding | Is the final response supported by images and retrieved evidence? |
| Recovery | Does the workflow handle search, download, or parsing failure? |
| Safety | Does it avoid unsafe links and overconfident authenticity claims? |
| Transparency | Can a reviewer inspect the plan and every tool result? |
</div>

<details><summary><b>Knowledge check answers</b></summary>
<div style="font-size: 16px;">

- **What makes this agentic?** The system creates a plan, invokes specialized tools, passes outputs between steps, and records a trace.
- **Why validate the plan?** Model-generated tool names or order can be malformed or unsafe.
- **Why is image comparison insufficient for authentication?** Counterfeit and genuine items can look similar, and key evidence may not be visible.
</div>

        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,

        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]

        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
