		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

> Introduction to Generative AI



<div class="definition-com-container">
  <div class="definition-com-title">Introduction</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Generative AI is an emerging and fascinating field that harnesses the power of machine learning models to create new content across various formats, including text, images, audio, and video. 
- This section delves into the fundamental concepts and foundational models that underpin Generative AI, shedding light on its remarkable capabilities to generate novel data. 
- We will use Google Colab, for more details, see <a href="../GoogleColab/Google_Colab.html">Introduction of Google Colab</a>

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

> “Generative models are a key enabler of machine creativity, allowing machines to go beyond what they’ve seen before and create something new” 

From Ian Goodfellow, Computer Scientist

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- It shows how generative models empower machines to surpass the limitations of their training data and generate truly novel content. 
	- Generative models unlock exciting possibilities for content creation across various domains like text, images, audio, and video. 
	- By training on large datasets, these models can generate entirely new pieces of content, assisting and augmenting human creativity in unprecedented ways. 
- This capability opens up a world of possibilities for creative expression, with machines aiding and enhancing human creativity
   </div>
</div>



<div class="definition-com-container">

- Foundation models, particularly large language models, have grown to an immense scale in recent years. These state-of-the-art models are trained on vast amounts of data, equivalent to millions of books, hours of video content, or billions of lines of code. Building such massive models requires significant computational resources, financial investment potentially exceeding $100 million, and the involvement of large teams of researchers and engineers. The sheer size of these models, some weighing over 700 GB, highlights the computational power and data required to train them. This scale enables these foundation models to develop a deep understanding of language and remarkable generalization capabilities, allowing them to adapt to various downstream tasks with minimal task-specific data.
   </div>

> Foundation Models and Large Language Models



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Foundation models and large language models are at the core of generative AI. These powerful models serve as the foundation for numerous advanced applications, enabling us to tackle challenging tasks more effectively. Foundation models and large language models are versatile and can be adapted to various domains. 

- This section delves into the concepts and capabilities of these models, which are driving innovation in the field of generative AI.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Popular machine learning approaches involve training models on specific tasks using labeled data. Foundation models and large language models are powerful neural networks trained on vast amounts of unlabeled data, allowing them to acquire broad knowledge and capabilities. The Transformers architecture, with its self-attention mechanism, is a key innovation enabling the success of large language models. However, these models face challenges like lack of grounding, biases, and the need for efficient inference. 
- This section explores the evolution from traditional ML to foundation models, their underlying architecture, and the current limitations being addressed.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Review: Traditional ML</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Trained on task-specific data
	- Models specialized for the task
- Training typically starts from scratch
- Several model choices
	- Tree-based models, linear models, neural networks, etc.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Review: Traditional ML (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Optimized for one task
	- Classification, regression, clustering
- Challenging to adapt to another similar task
   </div>
</div>

<div class="definition-com-container">
  <div class="definition-com-title">The growth of LLMs</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The growth of large language models has been remarkable, as illustrated by the graph showing the increasing number of parameters in notable artificial intelligence systems over time. Parameters or weights are variables in a model whose values are adjusted during training to establish how input data gets transformed into the desired output, such as the connection weights in an artificial neural network.
- The graph traces the evolution of maximum parameter counts, starting from a modest 120 million parameters in December 2001 for early models. Over the years, the parameter counts have grown exponentially, reaching 1.7 billion by July 2014, 175 billion by January 2020, and a staggering trillion parameters by the most recent data point. 
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">The growth of LLMs (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This rapid growth in parameter counts reflects the increasing complexity and capability of LLMs, enabling them to capture and model intricate language patterns and semantics more effectively. However, it's important to note that parameter count alone is not the sole determinant of an LLM's performance; factors such as model architecture, training data quality, and optimization techniques also play crucial roles.

   </div>
</div>

<div class="definition-com-container">
  <div class="definition-com-title">Transformer Networks</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Transformer networks have emerged as a pivotal architecture in the field of generative AI applications. 
- Let's examine their architecture and some key concepts that led to their rise in popularity.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Sequence-to-sequence models</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Use input sequences to produce output sequences.
	- Input and output are both variable-length sequences
	- Examples:
   </div>
</div>



<img src="images/fig7.png"  align="left" height="300px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Encoder-Decoder Architecture</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The encoder-decoder architecture is commonly used for sequence-to-sequence tasks, where the input and output can have variable lengths. It consists of two main components: the encoder and the decoder.  The encoder processes the input sequence and converts it into a numerical representation called the context vector.
- This context vector captures the meaning of the input sequence in a compact form. The decoder then takes this context vector and generates the output sequence, one element at a time, based on the information encoded in the context vector. 
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Encoder-Decoder Architecture (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This architecture is particularly useful for tasks like machine translation, where the input sentence in one language needs to be translated into an output sentence in another language. The encoder can process the input sentence and encode its meaning into the context vector, while the decoder can then use this context vector to generate the translated sentence in the target language.
   </div>
</div>



<img src="images/fig8.png"  align="left" height="500px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Transformers</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Developed as an encoder-decoder model
- Uses the attention mechanism

- Step 4 - Send Prompts and Control Generation

Chat models expect messages with roles. The tokenizer's **chat template** converts those messages into the exact token format expected by the selected model.

Generation parameters:

- **`max_new_tokens`**: maximum number of newly generated tokens;
- **`temperature`**: controls randomness; `0` uses greedy decoding;
- **`top_p`**: nucleus-sampling cutoff, used when sampling is enabled;
- **`system_prompt`**: tells the model how it should behave.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Lab a (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
from typing import Optional

def send_prompt(
    prompt_data: str,
    temperature: float = 0.0,
    top_p: float = 1.0,
    max_new_tokens: int = 300,
    system_prompt: Optional[str] = "You are a helpful and accurate teaching assistant.",
    seed: int = 42,
) -> str:
    """Generate one response from the local open-source chat model."""
    if not isinstance(prompt_data, str) or not prompt_data.strip():
        raise ValueError("prompt_data must be a non-empty string.")
    if temperature < 0:
        raise ValueError("temperature must be non-negative.")
    if not 0 < top_p <= 1:
        raise ValueError("top_p must be in the interval (0, 1].")
    if max_new_tokens < 1:
        raise ValueError("max_new_tokens must be positive.")

    messages = []
    if system_prompt:
        messages.append({"role": "system", "content": system_prompt})
    messages.append({"role": "user", "content": prompt_data.strip()})

    model_inputs = tokenizer.apply_chat_template(
        messages,
        add_generation_prompt=True,
        tokenize=True,
        return_tensors="pt",
        return_dict=True,
    )
    model_inputs = {key: value.to(model.device) for key, value in model_inputs.items()}

    set_seed(seed)
    do_sample = temperature > 0

    generation_kwargs = {
        "max_new_tokens": max_new_tokens,
        "do_sample": do_sample,
        "pad_token_id": tokenizer.eos_token_id,
    }

    if do_sample:
        generation_kwargs.update(
            {
                "temperature": temperature,
                "top_p": top_p,
            }
        )

    with torch.inference_mode():
        output_ids = model.generate(**model_inputs, **generation_kwargs)

    prompt_length = model_inputs["input_ids"].shape[-1]
    generated_ids = output_ids[0, prompt_length:]
    return tokenizer.decode(generated_ids, skip_special_tokens=True).strip()

The prompt contains:

- a **history placeholder** where prior messages are inserted;
- the newest **human message**.

`RunnableWithMessageHistory` automatically reads and updates the history for each session ID.

```
from langchain_core.chat_history import BaseChatMessageHistory, InMemoryChatMessageHistory
from langchain_core.prompts import ChatPromptTemplate, MessagesPlaceholder
from langchain_core.runnables.history import RunnableWithMessageHistory

SYSTEM_INSTRUCTION = (
    "You are a friendly teaching assistant. "
    "Answer clearly and concisely. "
    "Use earlier messages when they are relevant. "
    "If you do not know something, say that you do not know."
)

prompt_template = ChatPromptTemplate.from_messages(
    [
        ("system", SYSTEM_INSTRUCTION),
        MessagesPlaceholder(variable_name="history"),
        ("human", "{input}"),
    ]
)

base_chain = prompt_template | chat_model

store = {}

def get_session_history(session_id: str) -> BaseChatMessageHistory:
    if session_id not in store:
        store[session_id] = InMemoryChatMessageHistory()
    return store[session_id]

conversation = RunnableWithMessageHistory(
    base_chain,
    get_session_history,
    input_messages_key="input",
    history_messages_key="history",
)

SESSION_ID = "colab_demo_session"

def chat(user_input: str, session_id: str = SESSION_ID) -> str:
    if not isinstance(user_input, str) or not user_input.strip():
        raise ValueError("user_input must be a non-empty string.")

    response = conversation.invoke(
        {"input": user_input.strip()},
        config={"configurable": {"session_id": session_id}},
    )
    return response.content

print("Conversation chain created successfully.")

- They typically take the form of natural language queries or instructions, allowing users to clearly communicate their intent and requirements to the model.  Through prompts, users can provide detailed explanations of the task at hand, set constraints or boundaries for the model's response, offer examples to illustrate the desired output, and even specify the preferred format for the generated content.
- This level of control and customization ensures that the model's output aligns with the user's goals and expectations.

> Let's move on to the topic of inference parameters.



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This is an important aspect when working with language models, as the choice of inference parameters can significantly impact the model's performance and the quality of the generated outputs. We'll delve into the details and considerations around setting appropriate inference parameters in this section.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Inference parameters help control and customize the model’s response
	- Does not affect model architecture or weights
	- Control output generation during inference

<hr>

- Affect properties such as:
	- Creativity and diversity in responses
	- Confidence of the response generation
	- Response length
	- Determine end of response generation
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Inference parameters help control and customize the model's response during inference or prediction. They do not affect the model architecture or weights, but rather influence the output generation process.
- These parameters can impact various aspects of the model's behavior, such as creativity and diversity in responses, confidence levels, response length, and determining when to end the response generation.
- By adjusting inference parameters, users can control the model's outputs to align with their specific requirements.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Temperature: controls the randomness 
	- Use T=0 to make the output deterministic 
	- Use higher temperatures to generate more diverse text and control creativity
- Top p: selects next word from those with probabilities summing up to said value
- Top k: picks up next token from the top “k”, sorted by probability
- Maximum number of tokens: controls the length of the generated response
	- May result in incomplete responses if value too low
- Stop sequences: stops generating text when it encounters these sequences
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The temperature parameter controls the randomness or diversity in the generated text output. A temperature of 0 makes the output completely deterministic, while higher temperature values introduce more randomness, leading to more diverse and creative responses.
- Top p and top k are techniques for sampling the next token or word during text generation. Top p selects the next word from the set of words whose cumulative probabilities sum up to the specified p value. Top k simply picks the next token from the top k most probable options according to the model's predictions.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Inference parameters (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The maximum number of tokens parameter sets a limit on the length of the generated response. If this value is set too low, the model may produce incomplete or truncated responses.
- Stop sequences are specific sequences of text that instruct the model to stop generating further output when encountered. This allows controlling when the response should end based on certain conditions or patterns in the generated text.  These inference parameters provide flexibility in controlling the model's behavior during inference, enabling users to strike a balance between diversity, coherence, and response length based on their specific requirements.
   </div>
</div>



> Best Practices in Prompt Engineering



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- In this section, we will discuss some best practices in prompt engineering.
- Following best practices in this area is crucial for effectively leveraging the capabilities of these models and obtaining high-quality outputs.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Good prompting practices</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Write clear and specific instructions (unambiguous and specific)
- Highlight or specify the part of the prompt that the model should focus on
- Add relevant details or restrictions to your prompt
- Separate the instruction, content, question, and output directions
- Prefer using positive instructions
- Finding the optimum prompt is usually an iterative process which may take a few attempts
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Good prompting practices (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Good prompting practices play a crucial role in effectively utilizing language models and obtaining high-quality outputs that align with your requirements. Clarity and specificity are paramount when crafting instructions, as ambiguity can lead to misinterpretations and undesired results. Highlighting or explicitly specifying the aspects of the prompt that the model should prioritize helps ensure that it focuses on the most relevant information.
- Incorporating relevant details or constraints into the prompt allows you to shape the output according to your specific needs. For instance, you can provide context, set boundaries, or specify desired characteristics to guide the model's response in the intended direction.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Good prompting practices (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Separating the instruction, content, question, and output directions into distinct components enhances clarity and makes it easier for the model to understand and follow the different elements of the prompt. This structured approach can lead to more coherent and focused outputs.
- Positive instructions, which frame the task in a constructive manner, are generally preferred over negative ones, as they provide a more encouraging and productive framing for the model to work with.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Good prompting practices (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Importantly, finding the optimal prompt is often an iterative process that requires multiple attempts and refinements. It may involve experimenting with different phrasings, adjusting the level of detail or specificity, or incorporating additional constraints or context.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Prompts for instruction-tuned models</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- LLMs are pre-trained on vast amounts of data
	- They have learned patterns, grammar, facts, and some reasoning capabilities
- Instruction-tuned LLMs are fine-tuned to predict responses to textual instructions
	- They can generate content that aligns closely with user intent
	- They follow guidelines to arrive at desired outcomes
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Prompts for instruction-tuned models (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Instruction-tuned LLMs are further fine-tuned to generate responses to textual instructions. This enables them to generate content that aligns closely with user intent by following guidelines to arrive at desired outcomes.
- The key advantage of instruction-tuned models is their ability to understand and respond to prompts in a way that aligns with the user's goals. By providing clear and specific instructions, users can guide the model to generate relevant and tailored content. This makes instruction-tuned LLMs particularly useful for tasks that require understanding and following instructions.
- This level of control and specificity in content generation is a significant advantage over traditional language models, which may generate more generic or unfocused outputs.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Model-specific prompts</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Different large language models might need specific prompt formats
- Refer to the model cards or documentation for prompting guidelines

The helper function below provides the same simple interface used throughout the original lab:

```python

- `temperature=0.0` uses greedy decoding for more repeatable answers.
- A higher temperature introduces more variation.

<div class="definition-com-container">
  <div class="definition-com-title">Lab (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
def send_prompt(
    prompt_data,
    temperature=0.0,
    top_p=0.9,
    max_token_count=500,
    system_prompt="You are a helpful, accurate assistant. Follow the user's instructions carefully.",
):
    """Generate a response locally with the loaded open-source chat model."""
    if not isinstance(prompt_data, str) or not prompt_data.strip():
        raise ValueError("prompt_data must be a non-empty string.")
    if temperature < 0:
        raise ValueError("temperature must be non-negative.")
    if not 0 < top_p <= 1:
        raise ValueError("top_p must be in the interval (0, 1].")
    if max_token_count < 1:
        raise ValueError("max_token_count must be positive.")

    messages = [
        {"role": "system", "content": system_prompt},
        {"role": "user", "content": prompt_data.strip()},
    ]

    formatted_prompt = tokenizer.apply_chat_template(
        messages,
        tokenize=False,
        add_generation_prompt=True,
    )

    model_inputs = tokenizer(
        formatted_prompt,
        return_tensors="pt",
        add_special_tokens=False,  # The chat template already adds required tokens.
    )

    # For this model, all inputs can be placed on the model's primary device.
    input_device = next(model.parameters()).device
    model_inputs = {name: tensor.to(input_device) for name, tensor in model_inputs.items()}

    generation_kwargs = {
        "max_new_tokens": max_token_count,
        "pad_token_id": tokenizer.eos_token_id,
        "do_sample": temperature > 0,
    }
    if temperature > 0:
        generation_kwargs.update(
            temperature=temperature,
            top_p=top_p,
        )

    with torch.inference_mode():
        generated = model.generate(
            **model_inputs,
            **generation_kwargs,
        )

    new_tokens = generated[:, model_inputs["input_ids"].shape[1]:]
    response = tokenizer.batch_decode(
        new_tokens,
        skip_special_tokens=True,
    )[0]

    return response.strip()


# Optional reproducibility seed for sampling examples.
set_seed(42)
print("send_prompt() is ready.")
```

- In this section, we first revisit the basics of prompt engineering covered previously.
- We then explore advanced prompting techniques like chain-of-thought prompting, which involves providing step-by-step reasoning to guide the model through complex tasks.
- Additionally, we discuss self-consistency to ensure coherent and reliable outputs from the model.
- Finally, we examine the tree-of-thought approach, where prompts are structured as decision trees to explore multiple lines of reasoning.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Basics of prompt engineering</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let's start with a review of basic prompting techniques.
- We'll cover the fundamentals of crafting effective prompts for language models, ensuring clear communication and optimal performance.
- This will lay the groundwork for exploring more advanced prompting strategies in subsequent sections.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Review: Good prompting practices</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Write clear and specific instructions (unambiguous and specific)
- Highlight or specify the part of the prompt that the model should focus on
- Add relevant details or restrictions to your prompt
- Separate the instruction, content, question, and output directions
- Prefer using positive instructions
- Try using examples to guide the model’s response
	- In-context learning
- Finding the optimum prompt is usually an iterative process which may take a few attempts
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Chain-of-thought prompting</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- In this section, we will discuss chain-of-thought prompting.
- This technique involves guiding language models to break down complex problems into a series of smaller, more manageable steps.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Chain-of-thought (CoT) prompting</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Technique that breaks down complex tasks through intermediate reasoning steps
- Encourages model to explain its reasoning process by decomposing the solution into a series of steps
	- This behaviour can be facilitated through various strategies (few-shot CoT, zero-shot CoT, …)
	- CoT is the basis for other prompting techniques which separate out the task’s decomposition and its solving
   </div>
</div>



<img src="images/fig23.png"  align="left" height="500px" width="200px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Zero-shot CoT</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Appending instructions like “Let’s think step by step” to the prompt elicits the generation of a sequential reasoning chain by the LLM. This derives more precise answers
   </div>
</div>



<img src="images/fig24.png"  align="left" height="300px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Further Reading</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Link <a href="./files/paper_1.pdf">Large Language Models are Zero-Shot Reasoners</a>
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Few-shot CoT</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Few-shot Chain of Thought is a technique that involves providing the language model with examples that include step-by-step reasoning or explanations, rather than just the final answer. By showing the model these reasoned examples, it learns to generate its own reasoning chain when solving new problems. This approach often leads to more accurate results as the model breaks down the problem into intermediate steps, enabling it to arrive at the solution through a structured thought process.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Few-shot CoT (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Few-shot chain-of-thought leverages the model's ability to learn from examples that demonstrate the reasoning process, allowing it to apply similar step-by-step reasoning to new tasks, particularly those requiring multi-step logical reasoning or problem-solving. By prompting the model to generate its own chain of thought, this technique can enhance the interpretability and accuracy of the model's outputs for complex tasks.
   </div>
</div>



<img src="images/fig25.png"  align="left" height="350px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Further Reading</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Link <a href="./files/paper_2.pdf">Chain-of-Thought Prompting Elicits Reasoning in Large Language Models</a>
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Benefits of CoT</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- LLMs can benefit from detailed and logical steps to process the prompt 
- Such chains of thought can be facilitated by:
	- Addition of smaller logical steps in the prompt to break down the question or task
	- A series of demonstrations, composed of question and reasoning chain leading to an answer
	- Prompt augmentations like “Let’s think step by step”
- CoT can enhance performance of LLMs on tasks requiring arithmetic, common-sense, and symbolic reasoning
- Performance gains in models of ~100B parameters (See <a href="./files/paper_2.pdf">Chain-of-Thought Prompting Elicits Reasoning in Large Language Models</a>)
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Limitations of CoT</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- CoT prompts (especially few-shot examples) are specific to a problem type
- Smaller models might produce fluent but illogical CoT, with lower performance
- Increased cost of generation
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Overview of prompting techniques</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<table style="font-size: 22px;">
  <thead>
    <tr>
      <th>Method</th>
      <th>Use Case</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Zero-Shot Prompting</strong></td>
      <td>
        Tasks that the LLM can perform by using information learned from the

      </td>
    </tr>
    <tr>
      <td><strong>One-Shot Prompting</strong></td>
      <td>
        The output needs to follow a specific structure that can be
        demonstrated through one example.
      </td>
    </tr>
    <tr>
      <td><strong>Few-Shot Prompting</strong></td>
      <td>
        The output needs to follow a specific structure that can be
        demonstrated through several examples.
      </td>
    </tr>
    <tr>
      <td><strong>Chain-of-Thought Prompting</strong></td>
      <td>
        Complex tasks that require reasoning before a response can be
        generated.
      </td>
    </tr>
  </tbody>
</table>
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Review: Standard prompting strategies</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Standard prompt engineering techniques helps get improved results from LLMs for different tasks. Best practices:
	- Write clear, concise, positive, and precise instructions
	- Supplement with examples (one/few-shot prompting)
	- Ask the model to decompose a task into reasoning steps (CoT prompting)
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Towards advanced prompting</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Difficult questions might require the LLM to follow complex instructions and perform multi-step reasoning. Standard prompting techniques are often not enough.
	- Few-shot learning requires the limited context window of most LLMs to be occupied with exemplars
	- CoT does not guarantee correct reasoning paths and can give rise to both correct and incorrect answers
	- LLMs can be tricked into providing harmful output if safeguards aren’t put in place
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Self-consistency</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let's discuss self-consistency, an essential property for large language models to generate coherent and reliable outputs.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Decoding for text generation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Decoder-only models generate text word by word
LLMs calculate logits: scores assigned to every possible token in their vocabulary via a probability distribution
Decoding is the process of turning the logits coming from the probability distributions generated by the model into actual text 
   </div>
</div>



<img src="images/fig26.png"  align="left" height="200px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Greedy vs stochastic decoding</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<table style="font-size: 18px;">
  <thead>
    <tr>
      <th>Greedy</th>
      <th>Stochastic</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Deterministic</strong> decoding method</td>
      <td><strong>Non-deterministic</strong> decoding method</td>
    </tr>
    <tr>
      <td>
        At each step, select the token with the
        <strong>highest probability</strong>.
      </td>
      <td>
        At each step, select the next token based on the
        <strong>probability distribution</strong>.
      </td>
    </tr>
    <tr>
      <td>
        <strong>Fast and efficient</strong>, because it does not keep track of
        multiple sequences.
      </td>
      <td>
        The sampled token is <strong>not guaranteed</strong> to have the
        highest individual probability.
      </td>
    </tr>
    <tr>
      <td>
        Can become stuck in repetitive loops; the generated output is not
        “creative.”
      </td>
      <td>
        Allows for <strong>greater diversity</strong> in the generated output.
      </td>
    </tr>
    <tr>
      <td>Equivalent to sampling with <strong>T = 0</strong>.</td>
      <td>
        Sampling is controlled by <strong>several parameters</strong>.
      </td>
    </tr>
  </tbody>
</table>
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Self-consistency</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Technique that builds on chain-of-thought prompting
- Idea: generate multiple, diverse reasoning paths through few-shot CoT, and use them to verify the consistency of the responses
- Model gains the ability to explore multiple possibilities for the elicited reasoning chain and helps boost performance on arithmetic and common-sense reasoning tasks
   </div>
</div>



<img src="images/fig27.png"  align="left" height="500px" width="450px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Self-consistency improves performance</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Usual baseline for comparison: Chain-of-thought
- Self-consistency generates multiple chains of thought and takes the majority vote of these multiple outputs as the final answer
	- This improves reliability and accuracy
	- The idea reminds of “model ensembling” in machine learning
- Self-consistency improves CoT when used in a range of common arithmetic and common-sense reasoning benchmarks
	- Use to improve on tasks that admit a unique correct answer, such as quantitative business questions
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Limitations of self-consistency</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Self-consistency incurs more computational cost than CoT
	- In practice, generate a small number of paths (e.g. 5-10); in most cases the performance saturates quickly
	- Potential solution: use self-consistency to generate better supervised data to fine-tune the model, and use the fine-tuned model to get improved accuracy in a single inference run
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Limitations of self-consistency (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- LLMs can often generate incorrect or non-sensical reasoning
	- If most CoT paths are erroneous, self-consistency marginalization will fail
	- Further work needed to understand what elicits proper reasoning
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Tree-of-thought</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let's discuss the tree-of-thought approach, which aims to enhance the reasoning capabilities of language models by generating multiple reasoning paths or "thoughts" for a given input.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Tree-of-thoughts prompting</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Strategy that guides LLMs to generate, evaluate, expand on, and decide among multiple solutions
- Similar to problem-solving by humans: evaluate potential solutions before deciding on the most promising one
- ToT builds a tree where thoughts represent coherent language sequences that serve as intermediate steps toward solving a problem
	- Creative writing tasks such as ad copy generation
	- Mathematical reasoning tasks, crosswords, …
   </div>
</div>



<img src="images/fig28.png"  align="left" height="500px" width="450px"/>



<div class="definition-com-container">
  <div class="definition-com-title">ToT helps decision-making</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Tree-of-thoughts prompting generalizes over chain of thought
- ToT encourages exploration over "thoughts" that serve as intermediate steps for general problem solving with LLMs
	- LLM generates thoughts (via CoT prompting)
	- Add tree-branching technique (breadth-first and depth-first search)
	- This enables systematic exploration with look-ahead and back-tracking
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Benefits and limitations of ToT</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- ToT is especially effective for tasks that involve important initial decisions, strategies for the future, and exploration of multiple solutions
- Deliberate search might not be necessary for tasks for which powerful models already excel at
- ToT requires more resources than sampling methods
	- Flexibility in tree construction allows users to customize cost-performance trade-offs
   </div>
</div>

    *,
    temperature: float = 0.7,
    top_p: float = 0.9,
    max_new_tokens: int = 220,
    do_sample: bool = True,
    seed: int | None = None,
    system_prompt: str = "You are a careful and concise reasoning assistant.",
) -> str:
    """Generate one assistant response with the local model."""
    if seed is not None:
        set_seed(seed)

    messages = [
        {"role": "system", "content": system_prompt},
        {"role": "user", "content": prompt},
    ]
    formatted = tokenizer.apply_chat_template(
        messages,
        tokenize=False,
        add_generation_prompt=True,
    )
    inputs = tokenizer(formatted, return_tensors="pt").to(_model_device())

    generation_kwargs = {
        "max_new_tokens": max_new_tokens,
        "do_sample": do_sample,
        "pad_token_id": tokenizer.eos_token_id,
        "eos_token_id": tokenizer.eos_token_id,
    }
    if do_sample:
        generation_kwargs.update({"temperature": temperature, "top_p": top_p})

    output_ids = model.generate(**inputs, **generation_kwargs)
    new_tokens = output_ids[0, inputs["input_ids"].shape[1]:]
    return tokenizer.decode(new_tokens, skip_special_tokens=True).strip()


def generate_many(prompt: str, n: int = 5, seed_start: int = 100, **kwargs) -> list[str]:
    """Generate n independent samples using different reproducible seeds."""
    return [
        generate_text(prompt, seed=seed_start + i, **kwargs)
        for i in range(n)
    ]

- Step 3 - Greedy decoding versus stochastic sampling

**Greedy decoding** chooses the highest-probability next token at every step. With the same model and prompt, it is usually deterministic.

**Sampling** draws tokens from the model's probability distribution. Temperature and `top_p` control how broadly the model explores possible continuations. This diversity is essential for self-consistency because the method needs several different reasoning paths.

- Step 5 - Self-consistency: sample, extract, and vote

- The algorithm is:

	- Sample several CoT responses with temperature greater than zero.
	- Extract the final answer from each response.
	- Count answer frequencies.
	- Return the majority answer, together with vote information.

- A larger sample can be more stable, but it also requires more computation.
   </div>

```
def extract_final_answer(text: str):
    """Extract a numeric answer from a marked final line, with a safe fallback."""
    marked = re.findall(
        r"FINAL_ANSWER\s*:\s*([-+]?\d+(?:\.\d+)?)",
        text,
        flags=re.IGNORECASE,
    )
    if marked:
        value = float(marked[-1])
        return int(value) if value.is_integer() else value

    # Fallback: use the final number in the response.
    numbers = re.findall(r"[-+]?\d+(?:\.\d+)?", text)
    if numbers:
        value = float(numbers[-1])
        return int(value) if value.is_integer() else value
    return None


def self_consistent_solve(
    prompt: str,
    *,
    n_samples: int = 9,
    temperature: float = 0.7,
    top_p: float = 0.95,
    seed_start: int = 500,
):
    """Run sampled CoT and select the most frequent parsed answer."""
    completions = generate_many(
        prompt,
        n=n_samples,
        seed_start=seed_start,
        temperature=temperature,
        top_p=top_p,
        max_new_tokens=180,
        do_sample=True,
    )
    answers = [extract_final_answer(text) for text in completions]
    valid_answers = [answer for answer in answers if answer is not None]
    counts = Counter(valid_answers)
    majority = counts.most_common(1)[0][0] if counts else None

    rows = []
    for i, (completion, answer) in enumerate(zip(completions, answers), 1):
        rows.append({"sample": i, "parsed_answer": answer, "response": completion})

    return {
        "majority_answer": majority,
        "counts": counts,
        "samples": pd.DataFrame(rows),
    }

- Summary

	- Self-consistency is a decoding strategy rather than a new trained model. It samples multiple reasoning paths and marginalizes over them by answer voting. It can improve robustness when independent paths reach the same correct answer, but results depend on model quality, prompt design, sample diversity, answer parsing, and computational budget.

def generate_text(
    prompt: str,
    *,
    temperature: float = 0.75,

        "pad_token_id": tokenizer.eos_token_id,
        "eos_token_id": tokenizer.eos_token_id,

    if do_sample:

- Step 6 - Tree-of-Thought search

- This implementation uses a depth-2 tree:

	- Generate several candidate plans.
	- Vote for the best plan.
	- Generate several passages from the selected plan.
	- Vote for the best passage.

- To reduce position bias, each voting round shuffles the alternatives before asking the model to judge them.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Lab b (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
def clean_plan(text: str) -> str:
    return text.split("PLAN:", 1)[-1].strip() if "PLAN:" in text else text.strip()


def parse_best_choice(text: str, n_choices: int):
    """Parse BEST_CHOICE: N and validate the 1-based choice number."""
    matches = re.findall(r"BEST_CHOICE\s*:\s*(\d+)", text, flags=re.IGNORECASE)
    if not matches:
        return None
    choice = int(matches[-1])
    return choice if 1 <= choice <= n_choices else None


def make_vote_prompt(choices: list[str], criterion: str) -> str:
    enumerated = "\n\n".join(
        f"CHOICE {i}:\n{choice}" for i, choice in enumerate(choices, 1)
    )
    return f"""
Evaluate the choices using this criterion:
{criterion}

{enumerated}

Select exactly one choice. Consider constraint satisfaction, coherence, specificity,
and professional quality. End with exactly:
BEST_CHOICE: <number>
""".strip()


def vote_with_randomized_order(
    choices: list[str],
    criterion: str,
    *,
    n_rounds: int = 3,
    seed_start: int = 1000,
):
    """Run repeated votes while randomizing presentation order."""
    original_votes = []
    records = []

    for round_id in range(n_rounds):
        rng = random.Random(seed_start + round_id)
        permutation = list(range(len(choices)))
        rng.shuffle(permutation)
        shuffled = [choices[i] for i in permutation]

        prompt = make_vote_prompt(shuffled, criterion)
        response = generate_text(
            prompt,
            do_sample=True,
            temperature=0.35,
            top_p=0.9,
            max_new_tokens=180,
            seed=seed_start + round_id,
            system_prompt="You are a strict editor. Follow the requested output format.",
        )
        parsed = parse_best_choice(response, len(shuffled))
        original_index = permutation[parsed - 1] if parsed is not None else None
        original_votes.append(original_index)
        records.append({
            "round": round_id + 1,
            "permutation": permutation,
            "parsed_shuffled_choice": parsed,
            "original_choice_index": original_index,
            "judge_response": response,
        })

    valid_votes = [v for v in original_votes if v is not None]
    counts = Counter(valid_votes)
    winner_index = counts.most_common(1)[0][0] if counts else 0
    return winner_index, counts, pd.DataFrame(records)

```
class TextTaskToT:
    """A compact, inspectable Tree-of-Thought workflow for creative writing."""

    def __init__(self, data: dict, temperature: float = 0.8):
        self.data = data
        self.temperature = temperature
        self.plans = []
        self.passages = []
        self.best_plan_index = None
        self.best_passage_index = None
        self.plan_votes = None
        self.passage_votes = None

    def generate_plans(self, n_branches: int = 3):
        raw_plans = generate_many(
            plans_only_prompt(self.data),
            n=n_branches,
            seed_start=3000,
            temperature=self.temperature,
            top_p=0.95,
            max_new_tokens=220,
            do_sample=True,
        )
        self.plans = [clean_plan(plan) for plan in raw_plans]
        return self.plans

    def choose_plan(self, n_rounds: int = 3):
        criterion = (
            "Choose the plan most likely to produce a coherent press release that "
            "satisfies every exact-sentence and phrase constraint."
        )
        index, counts, records = vote_with_randomized_order(
            self.plans,
            criterion,
            n_rounds=n_rounds,
            seed_start=4000,
        )
        self.best_plan_index = index
        self.plan_votes = {"counts": counts, "records": records}
        return self.plans[index]

    def generate_passages(self, n_branches: int = 3):
        best_plan = self.plans[self.best_plan_index]
        self.passages = generate_many(
            passage_from_plan_prompt(self.data, best_plan),
            n=n_branches,
            seed_start=5000,
            temperature=self.temperature,
            top_p=0.95,
            max_new_tokens=380,
            do_sample=True,
        )
        return self.passages

    def choose_passage(self, n_rounds: int = 3):
        criterion = (
            "Choose the strongest final press release. It must satisfy all exact "
            "constraints, be coherent, avoid repetition, and sound professional."
        )
        index, counts, records = vote_with_randomized_order(
            self.passages,
            criterion,
            n_rounds=n_rounds,
            seed_start=6000,
        )
        self.best_passage_index = index
        self.passage_votes = {"counts": counts, "records": records}
        return self.passages[index]

    def run(self, n_branches: int = 3, n_rounds: int = 3):
        self.generate_plans(n_branches)
        self.choose_plan(n_rounds)
        self.generate_passages(n_branches)
        return self.choose_passage(n_rounds)

def deterministic_metrics(passage: str, data: dict) -> dict:
    normalized = passage.strip()
    lines = [line.strip() for line in normalized.splitlines() if line.strip()]
    title_correct = bool(lines) and lines[0].lstrip("# ").strip() == data["title"]
    body = "\n".join(lines[1:]).strip() if title_correct else normalized
    words = re.findall(r"\b\w+[’'-]?\w*\b|\b\w+\b", body)
    return {
        "title_correct": title_correct,
        "starts_correctly": body.startswith(data["start"]),
        "contains_phrase": data["required_phrase"] in body,
        "ends_correctly": body.endswith(data["end"]),
        "word_count": len(words),
        "within_word_range": 180 <= len(words) <= 260,
    }

    "plan_and_write": plan_and_write_passage,
    "tree_of_thoughts": tot_passage,
}

deterministic_table = pd.DataFrame({

    for method, passage in passages.items()
}).T

display(deterministic_table)

def rubric_prompt(passage: str, data: dict) -> str:
    return f"""
Score this press release from 1 to 5 on each criterion:
- constraint_satisfaction
- coherence
- specificity
- professional_tone
- overall_quality

Return ONLY valid JSON with integer values, for example:
{{"constraint_satisfaction": 5, "coherence": 4, "specificity": 4, "professional_tone": 5, "overall_quality": 4}}

Required title: {data['title']}
Required first sentence: {data['start']}
Required phrase: {data['required_phrase']}
Required final sentence: {data['end']}

PASSAGE:
{passage}
""".strip()


def parse_json_scores(text: str):
    match = re.search(r"\{.*\}", text, flags=re.DOTALL)
    if not match:
        return None
    try:
        data = json.loads(match.group(0))
        required = [
            "constraint_satisfaction",
            "coherence",
            "specificity",
            "professional_tone",
            "overall_quality",
        ]
        if not all(key in data for key in required):
            return None
        return {key: int(data[key]) for key in required}
    except (json.JSONDecodeError, TypeError, ValueError):
        return None


def score_passage_repeated(passage: str, n_rounds: int = 3, seed_start: int = 7000):
    rows = []
    for i in range(n_rounds):
        response = generate_text(
            rubric_prompt(passage, input_data),
            do_sample=True,
            temperature=0.25,
            top_p=0.9,
            max_new_tokens=160,
            seed=seed_start + i,
            system_prompt="You are a strict editor. Return only the requested JSON.",
        )
        parsed = parse_json_scores(response)
        if parsed is not None:
            parsed["round"] = i + 1
            rows.append(parsed)
    return pd.DataFrame(rows)

<details>
<summary><b>Answer key</b></summary>
<div style="font-size: 20px;">

- ToT explores and evaluates multiple intermediate paths rather than committing to one plan.  
- A thought is a candidate writing plan that can be evaluated and expanded.  
- Shuffling reduces systematic preference for an option merely because of its position.  
- Deterministic checks reliably verify exact constraints; the LLM judge estimates softer qualities such as coherence.  
- Examples include extra computation, latency, judge bias, weak branching diversity, poor parsing, and early selection of a bad plan.

- Image prompts:
	- Input format: Most MLLMs use base64-encoded format
	- Image size: Adhere to the image size limitations (e.g. <5MB)

	- Image format: Follow the image format specified for the MLLM (e.g. jpg, png, etc.)

	- Image placement: In most cases, it works better when images come before text

def local_image(source, filename=None):
    """Return a local path for a local image or a downloaded URL."""
    source=str(source)
    if source.startswith(("http://","https://")):
        r=requests.get(source,timeout=30); r.raise_for_status()
        if filename is None:
            suffix=Path(urlparse(source).path).suffix or ".jpg"; filename="downloaded"+suffix
        path=ASSET_DIR/filename; path.write_bytes(r.content)
        with PILImage.open(path) as im: im.verify()
        return str(path)
    path=Path(source)
    if not path.exists(): raise FileNotFoundError(path)
    return str(path.resolve())

def ask_vlm(prompt, images, max_new_tokens=256, temperature=0.0):
    """Ask the local vision-language model about one or more images."""
    if isinstance(images,(str,Path)): images=[images]
    paths=[local_image(x,f"url_{i}.jpg") for i,x in enumerate(images)]
    content=[{"type":"image","image":p} for p in paths]+[{"type":"text","text":prompt}]
    messages=[{"role":"user","content":content}]
    text=processor.apply_chat_template(messages,tokenize=False,add_generation_prompt=True)
    image_inputs,video_inputs=process_vision_info(messages)
    inputs=processor(text=[text],images=image_inputs,videos=video_inputs,padding=True,return_tensors="pt").to(model.device)
    kwargs={"max_new_tokens":max_new_tokens,"do_sample":temperature>0}
    if temperature>0: kwargs.update(temperature=temperature,top_p=.9)
    with torch.inference_mode(): generated=model.generate(**inputs,**kwargs)
    trimmed=[out[len(inp):] for inp,out in zip(inputs.input_ids,generated)]
    answer=processor.batch_decode(trimmed,skip_special_tokens=True,clean_up_tokenization_spaces=False)[0].strip()
    del inputs,generated,trimmed; gc.collect(); torch.cuda.empty_cache(); return answer

def show_answer(text):
    display(Markdown("<div style='background:#F7FBFF;border-left:5px solid #2E75B6;padding:14px'><b>Model response</b><br>"+text.replace("\n","<br>")+"</div>"))

def contact_sheet(gif_path,out_path,max_frames=8):
    frames=[]
    with PILImage.open(gif_path) as g:
        for i,fr in enumerate(ImageSequence.Iterator(g)):
            if i>=max_frames: break
            frames.append(fr.convert("RGB").resize((350,210)))
    sheet=PILImage.new("RGB",(1400,490),"white"); dr=ImageDraw.Draw(sheet)
    for i,fr in enumerate(frames):
        x=(i%4)*350; y=(i//4)*245; sheet.paste(fr,(x,y)); dr.text((x+8,y+214),f"Frame {i+1}",font=font(20),fill="#111827")
    sheet.save(out_path); return str(out_path)
cs=contact_sheet(gif,ASSET_DIR/"gif_contact_sheet.png"); display(Image(filename=cs,width=850))

import pypdfium2 as pdfium

def pdf_to_images(pdf_path,out_dir,page_numbers=None,scale=1.8):
    pdf=pdfium.PdfDocument(str(pdf_path)); out=Path(out_dir); out.mkdir(parents=True,exist_ok=True)
    page_numbers=list(range(len(pdf))) if page_numbers is None else page_numbers
    paths=[]
    for i in page_numbers:
        if not 0<=i<len(pdf): raise IndexError(i)
        image=pdf.get_page(i).render(scale=scale).to_pil().convert("RGB"); path=out/f"page_{i+1:03d}.png"; image.save(path); paths.append(str(path))
    return paths

def highlight_matches(text: str, matches: Iterable[str]) -> str:
    """Return HTML with matched substrings highlighted."""
    highlighted = text
    for match in sorted(set(matches), key=len, reverse=True):
        highlighted = highlighted.replace(
            match,
            f"<mark style='background:#FFF59D'>{match}</mark>",
        )
    return highlighted.replace("\n", "<br>")

EMAIL_PATTERN = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")

)

from presidio_analyzer import AnalyzerEngine, Pattern, PatternRecognizer
from presidio_analyzer.nlp_engine import NlpEngineProvider

nlp_configuration = {
    "nlp_engine_name": "spacy",
    "models": [{"lang_code": "en", "model_name": "en_core_web_sm"}],
}

provider = NlpEngineProvider(nlp_configuration=nlp_configuration)
nlp_engine = provider.create_engine()
analyzer = AnalyzerEngine(nlp_engine=nlp_engine, supported_languages=["en"])

street_pattern = Pattern(
    name="us_street_address",
    regex=(
        r"\b\d{1,5}(?:-\d{1,5})?\s+"
        r"(?:[A-Za-z0-9.'-]+\s+){0,4}"
        r"(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way)"
        r"\b(?:,\s*[A-Za-z .'-]+)?"
    ),
    score=0.75,
)
address_recognizer = PatternRecognizer(
    supported_entity="STREET_ADDRESS",
    patterns=[street_pattern],
    context=["address", "live", "located", "mail", "ship"],
)

aws_key_pattern = Pattern(
    name="aws_access_key_format",
    regex=r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b",
    score=0.90,
)
aws_key_recognizer = PatternRecognizer(
    supported_entity="AWS_ACCESS_KEY",
    patterns=[aws_key_pattern],
    context=["aws", "access", "key", "credential"],
)

analyzer.registry.add_recognizer(address_recognizer)
analyzer.registry.add_recognizer(aws_key_recognizer)
print("Presidio analyzer is ready.")

ENTITY_LABEL_MAP = {
    "PERSON": "NAME",
    "PHONE_NUMBER": "PHONE",
    "EMAIL_ADDRESS": "EMAIL",
    "STREET_ADDRESS": "ADDRESS",
    "LOCATION": "LOCATION",
    "US_SSN": "SSN",
    "CREDIT_CARD": "CREDIT_CARD",
    "IP_ADDRESS": "IP_ADDRESS",
    "DATE_TIME": "DATE_TIME",
    "AWS_ACCESS_KEY": "AWS_ACCESS_KEY",
}


def detect_pii_entities(
    text: str,
    score_threshold: float = 0.35,
    entities: Optional[Sequence[str]] = None,
) -> List[Dict[str, Any]]:
    """Return Presidio detections in a service-neutral, offset-based format."""
    results = analyzer.analyze(
        text=text,
        language="en",
        score_threshold=score_threshold,
        entities=list(entities) if entities else None,
    )
    converted = []
    for result in results:
        converted.append(
            {
                "Type": ENTITY_LABEL_MAP.get(result.entity_type, result.entity_type),
                "OriginalType": result.entity_type,
                "BeginOffset": int(result.start),
                "EndOffset": int(result.end),
                "Score": float(result.score),
                "Text": text[result.start : result.end],
            }
        )
    return sorted(converted, key=lambda x: (x["BeginOffset"], x["EndOffset"]))


def detections_dataframe(text: str, **kwargs) -> pd.DataFrame:
    columns = ["Type", "OriginalType", "Text", "BeginOffset", "EndOffset", "Score"]
    return pd.DataFrame(detect_pii_entities(text, **kwargs), columns=columns)

- Challenge 2 - Implement offset-based sanitization
- Write a `sanitize(text)` function that:

	- uses `BeginOffset` and `EndOffset` rather than `str.replace()`;
	- handles overlapping detections;
	- replaces each entity with `[TYPE]`, such as `[NAME]`, `[ADDRESS]`, or `[PHONE]`.

<div class="definition-com-container">

```
def resolve_overlaps(entities: List[Dict[str, Any]]) -> List[Dict[str, Any]]:
    """Select a non-overlapping set, preferring broader and higher-confidence spans."""
    type_priority = {"ADDRESS": 3, "CREDIT_CARD": 3, "PHONE": 2, "EMAIL": 2, "NAME": 1}
    ranked = sorted(
        entities,
        key=lambda e: (
            -type_priority.get(e["Type"], 0),
            -(e["EndOffset"] - e["BeginOffset"]),
            -e["Score"],
            e["BeginOffset"],
        ),
    )

    selected: List[Dict[str, Any]] = []
    for candidate in ranked:
        overlaps = any(
            candidate["BeginOffset"] < kept["EndOffset"]
            and kept["BeginOffset"] < candidate["EndOffset"]
            for kept in selected
        )
        if not overlaps:
            selected.append(candidate)

    return sorted(selected, key=lambda e: e["BeginOffset"])


def replace_entities(
    text: str,
    entities: List[Dict[str, Any]],
    left_bracket: str = "[",
    right_bracket: str = "]",
) -> str:
    """Replace spans from right to left so original offsets stay valid."""
    sanitized = text
    for entity in sorted(resolve_overlaps(entities), key=lambda e: e["BeginOffset"], reverse=True):
        placeholder = f"{left_bracket}{entity['Type']}{right_bracket}"
        sanitized = (
            sanitized[: entity["BeginOffset"]]
            + placeholder
            + sanitized[entity["EndOffset"] :]
        )
    return sanitized


def sanitize(text: str, score_threshold: float = 0.35) -> str:
    entities = detect_pii_entities(text, score_threshold=score_threshold)
    return replace_entities(text, entities)

- Step 2. Build local open-source guardrails

- A guardrail is a policy layer placed around a model or application. It may inspect **inputs**, **outputs**, or both. This lab implements an educational local guardrail with four policy types:

	- **Content policy:** score potentially toxic output with Detoxify.
	- **Denied-topic policy:** block personalized financial-transaction advice with transparent rules.
	- **Word policy:** block configured terms.
	- **Sensitive-information policy:** mask selected PII types with Presidio.

- This class is intentionally small and readable. Production guardrails normally require stronger models, multilingual testing, policy governance, audit logs, appeals, and human review.
   </div>
</div>

@dataclass
class GuardrailConfig:
    blocked_input_message: str = "Sorry, your input has been blocked."
    blocked_output_message: str = "Sorry, your output has been blocked."
    denied_topics: List[str] = field(default_factory=lambda: ["personalized financial advice"])
    banned_words: List[str] = field(default_factory=lambda: ["Google"])
    pii_entities: List[str] = field(default_factory=lambda: ["NAME"])
    pii_sources: List[str] = field(default_factory=lambda: ["OUTPUT"])
    toxicity_sources: List[str] = field(default_factory=lambda: ["OUTPUT"])
    toxicity_threshold: float = 0.55


class LocalOpenSourceGuardrail:
    """Small educational guardrail with deterministic, inspectable policies."""

    FINANCE_TERMS = {
        "stock", "stocks", "bond", "bonds", "crypto", "bitcoin", "ethereum",
        "investment", "invest", "retirement", "401k", "ira", "mortgage",
        "loan", "etf", "mutual fund", "options"
    }
    ADVICE_TERMS = {
        "should i", "should we", "recommend", "tell me whether", "which should",
        "buy", "sell", "put my", "move my", "allocate", "invest my"
    }

    def __init__(self, config: GuardrailConfig, analyzer_engine, toxicity_model):
        self.config = config
        self.analyzer = analyzer_engine
        self.toxicity_model = toxicity_model

    @staticmethod
    def _contains_word(text: str, word: str) -> bool:
        return re.search(rf"\b{re.escape(word)}\b", text, flags=re.IGNORECASE) is not None

    def _denied_financial_advice(self, text: str) -> bool:
        lowered = text.lower()
        has_finance = any(term in lowered for term in self.FINANCE_TERMS)
        has_advice = any(term in lowered for term in self.ADVICE_TERMS)
        return has_finance and has_advice

    def _toxicity_scores(self, text: str) -> Dict[str, float]:
        scores = self.toxicity_model.predict(text)
        return {name: float(value) for name, value in scores.items()}

    def _mask_selected_pii(self, text: str) -> tuple[str, List[Dict[str, Any]]]:
        all_entities = detect_pii_entities(text)
        selected = [e for e in all_entities if e["Type"] in self.config.pii_entities]
        masked = replace_entities(text, selected, left_bracket="{", right_bracket="}")
        return masked, selected

    def apply(self, text: str, source: str = "INPUT") -> Dict[str, Any]:
        source = source.upper()
        if source not in {"INPUT", "OUTPUT"}:
            raise ValueError("source must be 'INPUT' or 'OUTPUT'")

        assessments: Dict[str, Any] = {}
        blocked_message = (
            self.config.blocked_input_message if source == "INPUT"
            else self.config.blocked_output_message
        )

        matched_words = [
            word for word in self.config.banned_words if self._contains_word(text, word)
        ]
        if matched_words:
            assessments["word_policy"] = {"matched": matched_words}
            return {
                "action": "GUARDRAIL_INTERVENED",
                "source": source,
                "output": blocked_message,
                "assessments": assessments,
            }

        if "personalized financial advice" in self.config.denied_topics:
            if self._denied_financial_advice(text):
                assessments["topic_policy"] = {
                    "topic": "personalized financial advice",
                    "detected": True,
                }
                return {
                    "action": "GUARDRAIL_INTERVENED",
                    "source": source,
                    "output": blocked_message,
                    "assessments": assessments,
                }

        if source in self.config.toxicity_sources:
            scores = self._toxicity_scores(text)
            assessments["content_policy"] = scores
            relevant_score = max(
                scores.get("toxicity", 0.0),
                scores.get("identity_attack", 0.0),
                scores.get("identity_hate", 0.0),
                scores.get("insult", 0.0),
                scores.get("threat", 0.0),
            )
            if relevant_score >= self.config.toxicity_threshold:
                return {
                    "action": "GUARDRAIL_INTERVENED",
                    "source": source,
                    "output": blocked_message,
                    "assessments": assessments,
                }

        output_text = text
        if source in self.config.pii_sources:
            output_text, pii_entities = self._mask_selected_pii(text)
            if pii_entities:
                assessments["sensitive_information_policy"] = pii_entities

        return {
            "action": "GUARDRAIL_INTERVENED" if output_text != text else "NONE",
            "source": source,
            "output": output_text,
            "assessments": assessments,
        }

# Optional cell — run only when you want the local-model demonstration.
#
# Recent Transformers releases do not expose the former text-to-text
# pipeline task. FLAN-T5 is an encoder-decoder model, so load it with
# AutoModelForSeq2SeqLM and call generate() directly.
import transformers
from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

LOCAL_MODEL_NAME = "google/flan-t5-small"

print(f"Transformers version: {transformers.__version__}")
print(f"Loading {LOCAL_MODEL_NAME} on {DEVICE}...")

local_tokenizer = AutoTokenizer.from_pretrained(LOCAL_MODEL_NAME)
local_model = AutoModelForSeq2SeqLM.from_pretrained(LOCAL_MODEL_NAME)
local_model = local_model.to(DEVICE)
local_model.eval()


def generate_local_text(
    prompt: str,
    max_new_tokens: int = 80,
    max_input_tokens: int = 512,
) -> str:
    """Generate deterministic text with the local FLAN-T5 model."""
    encoded = local_tokenizer(
        prompt,
        return_tensors="pt",
        truncation=True,
        max_length=max_input_tokens,
    )
    encoded = {
        name: tensor.to(DEVICE)
        for name, tensor in encoded.items()
    }

    with torch.inference_mode():
        generated_ids = local_model.generate(
            **encoded,
            max_new_tokens=max_new_tokens,
            do_sample=False,
            num_beams=1,
        )

    return local_tokenizer.decode(
        generated_ids[0],
        skip_special_tokens=True,
    ).strip()


def guarded_generate(
    prompt: str,
    max_new_tokens: int = 80,
) -> Dict[str, Any]:
    input_check = guardrail.apply(prompt, source="INPUT")

    if (
        input_check["action"] == "GUARDRAIL_INTERVENED"
        and input_check["output"]
        == guardrail.config.blocked_input_message
    ):
        return {
            "stage": "input_guardrail",
            **input_check,
        }

    safe_prompt = input_check["output"]

    raw_output = generate_local_text(
        safe_prompt,
        max_new_tokens=max_new_tokens,
    )

    output_check = guardrail.apply(
        raw_output,
        source="OUTPUT",
    )

    return {
        "stage": "completed",
        "input_after_guardrail": safe_prompt,
        "raw_model_output": raw_output,
        "final_output": output_check["output"],
        "output_guardrail": output_check,
    }


demo_prompt = (
    "Explain in two sentences why personal data should be minimized "
    "in AI training."
)

print(
    json.dumps(
        guarded_generate(demo_prompt),
        indent=2,
    )
)

@torch.inference_mode()
def generate_text(
    user_prompt: str,
    system_prompt: str,
    max_new_tokens: int = MAX_NEW_TOKENS,
) -> str:
    """Generate one deterministic response with the local instruction model."""
    messages = [
        {"role": "system", "content": system_prompt},
        {"role": "user", "content": user_prompt},
    ]
    rendered = tokenizer.apply_chat_template(
        messages,
        tokenize=False,
        add_generation_prompt=True,
    )
    inputs = tokenizer(rendered, return_tensors="pt")
    input_device = next(model.parameters()).device
    inputs = {name: tensor.to(input_device) for name, tensor in inputs.items()}

    generated = model.generate(
        **inputs,
        max_new_tokens=max_new_tokens,
        do_sample=False,
        repetition_penalty=1.05,
        pad_token_id=tokenizer.eos_token_id,
        eos_token_id=tokenizer.eos_token_id,
    )
    new_tokens = generated[:, inputs["input_ids"].shape[1]:]
    return tokenizer.batch_decode(new_tokens, skip_special_tokens=True)[0].strip()

SMOKE_TEST_SYSTEM = "You are a concise teaching assistant."
