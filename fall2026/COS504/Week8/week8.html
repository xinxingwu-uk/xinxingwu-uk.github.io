		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Translate and test</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Statement: “Every student who passes the exam completed at least one practice quiz.”

- **Step-by-step solution.** Let $S(x)$, $P(x)$, $Q(x)$. A precise version is $\forall x\,\bigl((S(x)\land P(x))\rightarrow Q(x)\bigr)$.

- **Check.** The converse is different: completing a quiz does not guarantee passing.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: GCD and proof connection</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Compute gcd(48,18), then prove your answer divides both numbers.

- **Step-by-step solution.** $48=2\cdot 18+12$, $18=1\cdot 12+6$, $12=2\cdot 6+0$, so gcd=6. Since $48=8\cdot 6$ and $18=3\cdot 6$, 6 divides both.

- **Check.** Computation and proof support each other.
   </div>
</div>
</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Mixed proof</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Prove: if $a≡b (\bmod m)$ and $c≡d (\bmod m)$, then $a+c≡b+d (\bmod m)$.

- **Step-by-step solution.** By definition, m divides $a−b$ and $c−d$. Then $m$ divides $(a−b)+(c−d)=(a+c)−(b+d)$. Therefore $a+c≡b+d (\bmod m)$.

- **Why it matters.** This combines modular arithmetic with direct proof.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Algorithm + set thinking</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Remove duplicates from a list by scanning and storing seen elements in a set.

- **Step-by-step solution.** Each new value is checked against seen. If absent, add to output and seen. If present, skip.

- **Why it matters.** With efficient set lookup, the method is close to linear time.
   </div>
</div>
</textarea></section>

</section>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
