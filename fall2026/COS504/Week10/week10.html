		function startTime() {
			const today = new Date();
			let h = today.getHours();

			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Counting is about structured enumeration. The goal is to count efficiently and correctly.

- The product rule applies when a task has stages. The sum rule applies when choices come from disjoint cases.

- Permutations count ordered arrangements; combinations count unordered selections.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Password patterns</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** How many 4-digit PINs are possible if repetition is allowed?

- **Step-by-step solution.** Each digit has 10 choices, so $10\cdot 10\cdot 10\cdot 10=10,000$.

- **Check.** This is the product rule.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Committee selection</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Choose 3 students from 10 for a committee.

- **Step-by-step solution.** Order does not matter, so use $C(10,3)=10!/(3!7!)=120$.

- **Check.** If roles were president, secretary, treasurer, order would matter.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The pigeonhole principle says if more objects than boxes are placed into boxes, at least one box contains multiple objects.

- Inclusion-exclusion corrects overcounting when categories overlap.

- Generating permutations and combinations systematically is important for exhaustive search and testing.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Pigeonhole birthday version</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** In a group of 13 people, prove at least two were born in the same month.

- **Step-by-step solution.** There are 12 months as boxes and 13 people as objects. Since 13>12, one month has at least two birthdays.

- **Why it matters.** This proof gives existence without identifying the people.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Inclusion-exclusion</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** In a class, 18 like Python, 12 like Java, and 7 like both. How many like at least one?

- **Step-by-step solution.** Use $|P∪J|=|P|+|J|−|P∩J|=18+12−7=23$.

- **Why it matters.** Subtract the overlap because it was counted twice.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Design a small conference schedule problem. Count the number of ways to assign speakers to slots under two different constraints, and explain which rule you used.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.
   </div>
</div>



> Conference Speaker Schedule



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A small conference has four speakers:

	- Ana
	- Ben
	- Cara
	- Diego
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- There are four different presentation slots:

| Slot | Time |
|:---:|:---:|
| 1 | 9:00 a.m. |
| 2 | 10:00 a.m. |
| 3 | 11:00 a.m. |
| 4 | 1:00 p.m. |

- Each speaker must be assigned to exactly one slot.

- Because the slots have different times, the order of the speakers matters.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 1: Each Speaker Presents Exactly Once</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- Under the first constraint:

	- All four speakers must present.
	- No speaker may appear more than once.
	- There are no other restrictions.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 1: Each Speaker Presents Exactly Once (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- For Slot 1, there are four possible speakers.

- For Slot 2, there are three remaining speakers.

- For Slot 3, there are two remaining speakers.

- For Slot 4, there is one remaining speaker.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 1: Each Speaker Presents Exactly Once (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- Using the multiplication rule,

$$
4 \cdot 3 \cdot 2 \cdot 1 = 24.
$$

- Equivalently,

$$
4! = 24.
$$

- Therefore, the number of possible schedules is

$$
\boxed{24}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example for Constraint 1</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- One possible schedule is:

| Time | Speaker |
|:---:|:---:|
| 9:00 a.m. | Cara |
| 10:00 a.m. | Ana |
| 11:00 a.m. | Diego |
| 1:00 p.m. | Ben |

- This is one of the 24 possible schedules because every speaker appears exactly once.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example for Constraint 1 (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Another schedule with the same speakers in a different order is counted separately:

| Time | Speaker |
|:---:|:---:|
| 9:00 a.m. | Ana |
| 10:00 a.m. | Cara |
| 11:00 a.m. | Ben |
| 1:00 p.m. | Diego |

- The two schedules are different because the speakers have different presentation times.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Rule Used for Constraint 1</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This problem uses the **multiplication rule**.

- If one task can be completed in  $n_1$ ways and a second task can then be completed in $n_2$ ways, the two tasks can be completed together in

$$
n_1n_2
$$

ways.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Rule Used for Constraint 1 (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Here, the choices are

$$
4,\ 3,\ 2,\text{ and }1.
$$

- Therefore,

$$
4 \cdot 3 \cdot 2 \cdot 1 = 24.
$$

- This is also a permutation of four distinct speakers:

$$
P(4,4)=4!=24.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 2: Ana Must Present Before Ben</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Now add another scheduling requirement:

> Ana must present earlier than Ben.

- Cara and Diego may appear anywhere in the schedule.

- Start with the total number of unrestricted schedules:

$$
4! = 24.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 2: Ana Must Present Before Ben (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- For every schedule in which Ana appears before Ben, there is a corresponding schedule in which Ben appears before Ana.

	- For example:

| Valid: Ana Before Ben | Invalid: Ben Before Ana |
|:---|:---|
| Ana, Cara, Ben, Diego | Ben, Cara, Ana, Diego |
| Diego, Ana, Cara, Ben | Diego, Ben, Cara, Ana |
| Cara, Ana, Diego, Ben | Cara, Ben, Diego, Ana |

- Exactly half of the 24 schedules place Ana before Ben.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Constraint 2: Ana Must Present Before Ben (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- Therefore,

$$
\frac{24}{2}=12.
$$

- The number of schedules satisfying the second constraint is

$$
\boxed{12}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example for Constraint 2</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Consider the following schedule:

| Time | Speaker |
|:---:|:---:|
| 9:00 a.m. | Cara |
| 10:00 a.m. | Ana |
| 11:00 a.m. | Diego |
| 1:00 p.m. | Ben |

Ana presents at 10:00 a.m., while Ben presents at 1:00 p.m.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example for Constraint 2 (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Therefore,

$$
\text{Ana's slot} < \text{Ben's slot}.
$$

- This schedule satisfies the constraint.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example for Constraint 2 (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Now consider:

| Time | Speaker |
|:---:|:---:|
| 9:00 a.m. | Cara |
| 10:00 a.m. | Ben |
| 11:00 a.m. | Diego |
| 1:00 p.m. | Ana |

- This schedule does not satisfy the constraint because Ben presents before Ana.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Rule Used for Constraint 2</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This problem uses a **symmetry argument** together with the division rule.

- The 24 schedules can be divided into two equally sized groups:

	- Ana presents before Ben.
	- Ben presents before Ana.

- Because the two groups have the same size,

$$
\frac{4!}{2}=\frac{24}{2}=12.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Rule Used for Constraint 2 (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Therefore,

$$
\boxed{12}
$$

schedules place Ana before Ben.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Comparison of the Two Constraints</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Scheduling condition | Calculation | Number of schedules |
|:---|:---:|---:|
| Every speaker presents exactly once | $4!$ | 24 |
| Every speaker presents once and Ana is before Ben | $\dfrac{4!}{2}$ | 12 |
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Comparison of the Two Constraints (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Adding the second constraint reduces the number of valid schedules from 24 to 12.

- The percentage of schedules that satisfy the second constraint is

$$
\frac{12}{24}\cdot 100\%=50\%.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The first model counts every possible ordering of four different speakers. Because each speaker is used exactly once and the presentation slots are different, the permutation rule gives

$$
4!=24.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The second model requires Ana to present before Ben. Half of all schedules place Ana before Ben, while the other half place Ben before Ana. Therefore, only

$$
12
$$

schedules satisfy the additional condition.

- This demonstrates an important principle:

> Adding scheduling restrictions usually reduces the number of valid arrangements.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The conference has four speakers and four presentation slots.

- Under the first constraint,

$$
\boxed{4!=24}
$$

different schedules are possible.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Under the second constraint, Ana must present before Ben:

$$
\boxed{\frac{4!}{2}=12}.
$$

- The multiplication rule is used to count all arrangements, and a symmetry argument is used to count the schedules in which Ana appears before Ben.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
