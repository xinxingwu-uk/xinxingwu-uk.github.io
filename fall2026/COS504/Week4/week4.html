		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Divisibility asks whether a number can be written as a multiple of another.

- Modular arithmetic focuses on remainders: $a ≡ b$ (mod m) means $a$ and $b$ have the same remainder when divided by m.

- The greatest common divisor gcd(a,b) is the largest positive integer dividing both $a$ and $b$.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch3" class="center"><textarea data-template>

<p class="definition-rainbow-title">Basic examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Clock arithmetic</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** If it is 9 o’clock now, what time is it in 20 hours?

- **Step-by-step solution.** Compute 9+20=29. On a 12-hour clock, 29 ≡ 5 (mod 12).

- **Check.** The answer is 5 o’clock.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Euclidean algorithm</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Find gcd(84,30).

- **Step-by-step solution.** 84=2·30+24, 30=1·24+6, 24=4·6+0. The last nonzero remainder is 6.

- **Check.** So gcd(84,30)=6.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Bezout coefficients express gcd(a,b) as ax+by for some integers x and y. The extended Euclidean algorithm finds x and y.

- A modular inverse of a mod m is a number $a^{-1}$ such that $aa^{-1} ≡ 1 ({\rm{mod}}\quad m)$. It exists when gcd(a,m)=1.

- Linear congruences ax ≡ b (mod m) can be solved using inverses or gcd conditions.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Modular inverse</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Find the inverse of 3 modulo 7.

- **Step-by-step solution.** Try multiples: $3\cdot 5=15 ≡ 1$ (mod 7). So $3^{-1}$ (mod 7).

- **Why it matters.** This means dividing by 3 modulo 7 is the same as multiplying by 5.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Solve a congruence</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Solve 3x ≡ 6 (mod 7).

- **Step-by-step solution.** Multiply both sides by $3^{-1}=5: x ≡ 30 ≡ 2$ (mod 7).

- **Why it matters.** Check: $3\cdot 2=6$, so it works.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch8" class="center"><textarea data-template>

<p class="definition-rainbow-title">Task</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Create a check-digit rule for a 5-digit student code. Test whether your rule catches three simulated mistakes, then explain one mistake it may miss.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A student code contains five digits:

$$
d_1d_2d_3d_4c
$$

where:

- $d_1,d_2,d_3,d_4$ are the student-identification digits.
- $c$ is the check digit.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Define the check digit by

$$
c=(d_1+d_2+d_3+d_4)\quad\bmod\quad 10.
$$

- A code is valid when its fifth digit equals the remainder obtained by adding the first four digits and dividing by $10$.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Pseudocode</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
PROCEDURE IsValidStudentCode(code)

    IF code does not contain exactly 5 digits THEN
        RETURN False
    END IF

    d1 ← first digit
    d2 ← second digit
    d3 ← third digit
    d4 ← fourth digit
    c  ← fifth digit

    expectedCheckDigit ← (d1 + d2 + d3 + d4) MOD 10

    IF c = expectedCheckDigit THEN
        RETURN True
    ELSE
        RETURN False
    END IF

END PROCEDURE
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose the first four digits of a student code are

$$2748.$$

- Add the four digits:

$$2+7+4+8=21.$$

- Compute the remainder after division by 10:

$$21\quad \bmod\quad 10=1.$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Therefore, the check digit is

$$c=1.$$

- The complete student code is

$$27481.$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- To verify the code, calculate

$$(2+7+4+8)\quad \bmod\quad 10=1.$$

- Because the calculated check digit equals the final digit, the code is valid.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Testing Three Simulated Mistakes</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The original valid code is

$$27481.$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Mistake 1: A Data Digit Is Changed</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose the digit 8 is accidentally changed to 9:

$$27491.$$

- Calculate the expected check digit:

$$(2+7+4+9)\quad \bmod\quad 10=22\quad \bmod\quad 10=2.$$

- The code contains the check digit 1, but the expected check digit is 2.

$$1\neq 2.$$

- Result: The mistake is caught.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Mistake 2: The Check Digit Is Changed</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose the check digit 1 is accidentally changed to 6:

$$27486.$$

- The expected check digit is still

$$(2+7+4+8)\quad \bmod\quad 10=1.$$

- However, the code contains 6.

$$6\neq 1.$$

- Result: The mistake is caught.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Mistake 3: Another Data Digit Is Changed</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose the digit 7 is accidentally changed to 6:

$$26481.$$

- Calculate the expected check digit:

$$(2+6+4+8)\quad \bmod\quad 10=20\quad \bmod\quad10=0.$$

- The code contains the check digit 1, but the expected check digit is 0.

$$1\neq 0.$$

- Result: The mistake is caught.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Test Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

|   Code  | Simulated mistake   | Expected check digit | Stored check digit | Result |
| :-----: | :------------------ | :------------------: | :----------------: | :----: |
| `27481` | No mistake          |           1          |          1         |  Valid |
| `27491` | (8) changed to (9)  |           2          |          1         | Caught |
| `27486` | Check digit changed |           1          |          6         | Caught |
| `26481` | (7) changed to (6)  |           0          |          1         | Caught |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">A Mistake the Rule May Miss</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- This rule may fail to detect a transposition, where two digits exchange positions.

- For example, swap the first two digits of the valid code:

$$27481\rightarrow 72481.$$

- For the original code,

$$2+7+4+8=21.$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">A Mistake the Rule May Miss (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For the changed code,

$$7+2+4+8=21.$$

- Both codes produce the same check digit:

$$21\quad \rm{mod}\quad 10=1.$$

- Therefore, the incorrect code 72481 is still accepted.

- Result: The rule does not detect this transposition.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The check-digit rule successfully detects the three simulated single-digit mistakes because changing one digit changes the sum of the first four digits. The stored check digit then differs from the expected check digit.

- However, the rule only uses the sum of the digits. Changing the order of the digits does not change their sum, so some transposition mistakes may remain undetected.

- The rule is simple and useful for detecting common typing errors, but a weighted check-digit system would provide stronger error detection.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
