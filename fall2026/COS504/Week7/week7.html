			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A recursive definition has base cases and rules for building larger objects from smaller ones.

- A recursive algorithm solves a problem by calling itself on smaller inputs.

- A good recursive solution must make progress toward a base case; otherwise it never stops.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Factorial definition</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Define n! recursively.

- **Step-by-step solution.** Base: $0!=1$. Recursive rule: $n!=n·(n−1)!$ for $n\geqslant 1$. For 4!, compute $4·3·2·1·0!=24$.

- **Check.** The problem shrinks by one each call.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Fibonacci sequence</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Define $F_0=0, F_1=1$, and $F_n=F_{n-1}+F_{n-2}$ for $n\geqslant 2$.

- **Step-by-step solution.** $F_2=1, F_3=2, F_4=3, F_5=5$.

- **Check.** Each term depends on two previous terms.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Recursive algorithms can be elegant but expensive if they recompute the same subproblems.

- Recurrence relations describe running time, such as $T(n)=T(n−1)+1$ or $T(n)=2T(n/2)+n$.

- Memoization stores solved subproblems to avoid repeated work.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Naive vs memoized Fibonacci</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Naive $fib(5)$ computes $fib(3)$ multiple times. Memoized fib stores each result.

- **Step-by-step solution.** Naive recursion grows exponentially; memoization reduces the number of distinct subproblems to $n+1$.

- **Why it matters.** This is the core idea behind dynamic programming.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Recursive binary search recurrence</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Binary search satisfies $T(n)=T(n/2)+1$.

- **Step-by-step solution.** After k steps the size is $n/2^k$. Stop when $n/2^k\approx 1$, so $k\approx\log_₂ n$.

- **Why it matters.** This gives $\mathcal{O}(\log n)$ time.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Trace a recursive folder-size algorithm on a small folder tree. Then identify the base case, recursive call, and stopping condition.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A folder may contain:

	- Files, each with a known size.
	- Other folders, which may contain additional files and folders.

- The total size of a folder is the sum of the sizes of every file stored inside it, including files inside its subfolders.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Define

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    FolderSize(x)
  </div>
</div>

as the total size of item $x$.

- When $x$ is a file, return the file's size.
- When $x$ is a folder, recursively calculate the size of every item inside it and add the results.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Recursive Pseudocode</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
PROCEDURE FolderSize(item)

    IF item is a file THEN
        RETURN item.size
    END IF

    totalSize ← 0

    FOR each child in item

        totalSize ← totalSize + FolderSize(child)

    END FOR

    RETURN totalSize

END PROCEDURE
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Small Folder Tree</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Consider the following folder tree. File sizes are measured in megabytes.

```
CourseFiles/
│
├── syllabus.pdf              2 MB
│
├── Lectures/
│   ├── week1.pdf             5 MB
│   └── week2.pdf             7 MB
│
└── Labs/
    ├── lab1.py               3 MB
    └── Data/
        └── sample.csv        4 MB
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Small Folder Tree (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The goal is to calculate

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    FolderSize(CourseFiles).
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Base Case</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The base case occurs when the current item is a file.

- For a file, the algorithm does not make another recursive call. It simply returns the file size.

- For example,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    FolderSize(week1.pdf)=5.
  </div>
</div>

- Similarly,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    FolderSize(sample.csv)=4.
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Base Case (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

In pseudocode, the base case is:

```
IF item is a file THEN
    RETURN item.size
END IF
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Recursive Call</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The recursive call occurs when the current item is a folder.

```

```

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
