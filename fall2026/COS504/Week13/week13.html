		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A graph consists of vertices and edges. Vertices represent objects; edges represent relationships.

- Graphs may be directed or undirected, weighted or unweighted, simple or multigraphs.

- Connectivity asks whether there is a path between vertices.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Campus walking graph</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Vertices are buildings; edges are sidewalks.

- **Step-by-step solution.** A path is a sequence of connected buildings. A shortest path minimizes distance or time.

- **Check.** A graph turns a map into a problem we can compute on.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Degree count</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** In an undirected graph, vertex degree is the number of incident edges.

- **Step-by-step solution.** If A is connected to B, C, and D, degree(A)=3. The sum of all degrees equals twice the number of edges.

- **Check.** Every edge contributes 1 degree to each endpoint.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Euler paths use every edge exactly once; Hamilton paths visit every vertex exactly once. They answer different questions.

- Shortest-path algorithms find minimum-cost routes in weighted graphs.

- Graph coloring assigns labels so adjacent vertices differ; it models conflict avoidance.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Euler path criterion</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** A connected undirected graph has an Euler circuit if every vertex has even degree. It has an Euler path but not circuit if exactly two vertices have odd degree.

- **Step-by-step solution.** Check vertex degrees before trying to draw the route.

- **Why it matters.** Degree structure predicts route possibility.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Color a conflict graph</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Courses are vertices; an edge connects courses with shared students.

- **Step-by-step solution.** A coloring assigns exam slots so connected courses have different slots. The number of colors is the number of time slots.

- **Why it matters.** Graph coloring turns scheduling into a mathematical model.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch8" class="center"><textarea data-template>

<p class="definition-rainbow-title">Task</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Create a graph for a campus, social, or course-scheduling problem. List vertices and edges, compute degrees, find one path, and explain whether coloring or shortest path is useful.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A university wants to help students find efficient walking routes between important campus buildings.

- Represent the campus as a weighted, undirected graph

$$
G=(V,E).
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Problem Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

In this model:

- Each vertex represents a campus building.
- Each edge represents a direct walking path.
- Each edge weight represents the walking distance in meters.
- Because students can walk in either direction, the graph is undirected.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Vertices</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let the set of vertices be

$$
V=
\lbrace
L,S,C,D,G
\rbrace,
$$

where:

| Vertex | Campus location |
|:---:|:---|
| L | Library |
| S | Science Building |
| C | Student Center |
| D | Dormitory |
| G | Gymnasium |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Edges and Distances</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Let the weighted edge set be

$$
\begin{aligned}
E=\lbrace
&(L,S,200),\newline
&(L,C,150),\newline
&(S,C,100),\newline
&(S,G,250),\newline
&(C,D,300),\newline
&(C,G,180),\newline
&(D,G,120)
\rbrace.
\end{aligned}
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Edges and Distances (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For example,

$$
(L,S,200)
$$

means that a direct walking path of 200 meters connects the Library and the Science Building.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Campus Graph</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

```
                    200 m
          Library ---------- Science
             |                 |
       150 m |                 | 250 m
             |      100 m      |
       Student Center ---------+
             |  \
       300 m |   \ 180 m
             |    \
        Dormitory ---- Gymnasium
               120 m
```

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Campus Graph (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A more precise edge view is:

```
Library --------200-------- Science
   |                           |
  150                         250
   |                           |
Student Center ----100---- Science
   |       \
  300      180
   |          \
Dormitory ----120---- Gymnasium
```

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Adjacency List</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The same graph can be represented by an adjacency list.

```
Library:
    Science, 200 m
    Student Center, 150 m

Science:
    Library, 200 m
    Student Center, 100 m
    Gymnasium, 250 m

Student Center:
    Library, 150 m
    Science, 100 m
    Dormitory, 300 m
    Gymnasium, 180 m

Dormitory:
    Student Center, 300 m
    Gymnasium, 120 m

Gymnasium:
    Science, 250 m
    Student Center, 180 m
    Dormitory, 120 m
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Degree of a Vertex</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The degree of a vertex is the number of edges connected to it.

- The degree does not depend on the edge weights.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
