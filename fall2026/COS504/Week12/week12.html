		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);

			}

<p class="definition-rainbow-title">Basic knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A relation from A to B is a subset of A×B. A binary relation on A relates elements of A to other elements of A.

- Relations generalize functions: a single input may be related to zero, one, or many outputs.

- Properties such as reflexive, symmetric, and transitive describe the shape of a relation.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch3" class="center"><textarea data-template>

<p class="definition-rainbow-title">Basic examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Prerequisite relation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Let courses be vertices. Course A is related to Course B if A is a prerequisite for B.

- **Step-by-step solution.** This relation is usually not symmetric: if A is prerequisite for B, B is not prerequisite for A. It should be transitive in planning: prerequisite chains matter.

- **Check.** Relations model academic structure.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Friendship vs follows</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Friendship is often symmetric; follows on social media is not necessarily symmetric.

- **Step-by-step solution.** If A follows B, B may not follow A. Therefore “follows” is not symmetric.

- **Check.** The same people can have different relations depending on meaning.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Equivalence relations are reflexive, symmetric, and transitive. They partition a set into equivalence classes.

- Partial orders are reflexive, antisymmetric, and transitive. They model hierarchy, dependency, and precedence.

- Closures add the minimum pairs needed to make a relation have a property such as transitivity.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Equivalence classes</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** On integers, define $a\sim b$ if $a≡b (\bmod 3)$.

- **Step-by-step solution.** This relation partitions integers into three classes: remainder 0, remainder 1, and remainder 2.

- **Why it matters.** All numbers in one class behave the same modulo 3.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Partial order by divisibility</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** On {1,2,3,6}, define $a\leqslant b$ if a divides b.

- **Step-by-step solution.** 1 divides all; 2 and 3 divide 6; 2 and 3 are incomparable.

- **Why it matters.** A Hasse diagram shows the hierarchy.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Choose a relation from campus life, such as “has worked with,” “is prerequisite for,” or “is in same team as.” Test four relation properties and represent it as a matrix or directed graph.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



> Campus Prerequisite Relation



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Relation Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Consider four computer science courses:

$$
C=
\lbrace
\text{COS 107},
\text{COS 303},
\text{COS 364},
\text{COS 460}
\rbrace.
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Relation Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Define a relation $R$ on $C$ by:

> $xRy$ means that course $x$ is a prerequisite, directly or indirectly, for course $y$.

Assume the course sequence is:


COS 107 → COS 303 → COS 364 → COS 460

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Relation Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

$$R=\begin{pmatrix}
(\text{COS 107},\text{COS 303}),\newline
(\text{COS 107},\text{COS 364}),\newline
(\text{COS 107},\text{COS 460}),\newline
(\text{COS 303},\text{COS 364}),\newline
(\text{COS 303},\text{COS 460}),\newline
(\text{COS 364},\text{COS 460})
\end{pmatrix}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Directed-Graph Representation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The relation can be represented by the following directed graph:

```
COS 107 ───────→ COS 303 ───────→ COS 364 ───────→ COS 460
   │                 │                 │
   ├────────────────→│                 │
   ├──────────────────────────────────→│
   │                 └────────────────→│
   └──────────────────────────────────→│
```

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Directed-Graph Representation (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A simpler view of the direct prerequisite chain is:

COS 107 → COS 303 → COS 364 → COS 460

- Additional arrows represent indirect prerequisite relationships.

- For example:

	- COS 107 → COS 364
	- COS 107 → COS 460
	- COS 303 → COS 460

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Testing Four Relation Properties</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- We will test whether R is:

	- Reflexive
	- Symmetric
	- Antisymmetric
	- Transitive
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reflexive Property</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

A relation R on C is reflexive when

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(x,x)$\in$R
  </div>
</div>

for every $x\in C$.
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reflexive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

For example, reflexivity would require

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(COS 107,COS 107)$\in$R.
  </div>
</div>

However, a course is not considered its own prerequisite.

Similarly,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(COS 303,COS 303)$\not\in$R.
  </div>
</div>

Therefore, R is not reflexive.
	​
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reflexive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The relation is instead irreflexive because

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(x,x)$\not\in$R.
  </div>
</div>

for every course $x$.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Symmetric Property</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

A relation is symmetric when

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(x,y)$\in$R$\Rightarrow$(y,x)$\in$R.
  </div>
</div>
</div>

For example,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(COS 107,COS 303)$\in$R.
  </div>
</div>

- This means COS 107 is a prerequisite for COS 303.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Symmetric Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- For symmetry, we would also need

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">		
	(COS 303,COS 107)$\in$R.
  </div>
</div>

However, COS 303 is not a prerequisite for COS 107.

Therefore, R is not symmetric.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Antisymmetric Property</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

A relation is antisymmetric when

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">	
	(x,y)$\in$R and (y,x)$\in$R$\Rightarrow$x=y.
  </div>
</div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Antisymmetric Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- In the prerequisite relation, no two different courses are prerequisites for each other.

- For example,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">	
	(COS 107,COS 303) $\in$ R,
  </div>
</div>

but

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">	
	(COS 303,COS 107)$\not\in$ R.
  </div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Antisymmetric Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- There are no different courses $x$ and $y$ for which both

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">	
	(x,y) $\in$ R
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">	
	(y,x)$\in$ R.
  </div>
</div>

Therefore, R is antisymmetric.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Transitive Property</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

A relation is transitive when

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (x,y)$\in$R and (y,z)$\in$R $\Rightarrow$(x,z)$\in$R.
  </div>
</div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Transitive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Consider:


<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 107,COS 303) $\in$ R
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 303,COS 364) $\in$ R.
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Transitive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Because COS 107 is a prerequisite for COS 303 and COS 303 is a prerequisite for COS 364, COS 107 is indirectly a prerequisite for COS 364:

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 107,COS 364) $\in$ R.
  </div>
</div>

Therefore, this case satisfies transitivity.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Transitive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The same idea applies to:

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 303,COS 364)$\in$R
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 364,COS 460)$\in$R.
  </div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Transitive Property (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Thus,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    (COS 303,COS 460)$\in$R.
  </div>
</div>

Therefore,

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    R is transitive.
  </div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Property Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Property      | Does (R) have it? | Reason                                                                             |
| :------------ | :---------------: | :--------------------------------------------------------------------------------- |
| Reflexive     |         No        | A course is not its own prerequisite.                                              |
| Symmetric     |         No        | If (x) is a prerequisite for (y), then (y) is not normally a prerequisite for (x). |
| Antisymmetric |        Yes        | Two different courses cannot be prerequisites for each other.                      |
| Transitive    |        Yes        | A prerequisite of a prerequisite is also an indirect prerequisite.                 |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Use the following row and column order:

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107,COS 303,COS 364,COS 460.
  </div>
</div>

- The matrix entry $m_{ij}$ is defined by

$$
m_{ij}=
\begin{cases}
1, & \text{if course } i \text{ is a prerequisite for course } j,\newline
0, & \text{otherwise}.
\end{cases}
$$

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The relation matrix is

$$
M_R=
\begin{pmatrix}
0 & 1 & 1 & 1\newline
0 & 0 & 1 & 1\newline
0 & 0 & 0 & 1\newline
0 & 0 & 0 & 0
\end{pmatrix}.
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">The 0–1 Matrix (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- With labeled rows and columns:

$$
\begin{array}{c|cccc}
 & \text{COS 107} & \text{COS 303} & \text{COS 364} & \text{COS 460}\newline
\hline
\text{COS 107} & 0 & 1 & 1 & 1\newline
\text{COS 303} & 0 & 0 & 1 & 1\newline
\text{COS 364} & 0 & 0 & 0 & 1\newline
\text{COS 460} & 0 & 0 & 0 & 0
\end{array}
$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Labeled Matrix</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

|             | COS 107 | COS 303 | COS 364 | COS 460 |
| :---------- | :-----: | :-----: | :-----: | :-----: |
| **COS 107** |    0    |    1    |    1    |    1    |
| **COS 303** |    0    |    0    |    1    |    1    |
| **COS 364** |    0    |    0    |    0    |    1    |
| **COS 460** |    0    |    0    |    0    |    0    |

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Labeled Matrix (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Rows represent possible prerequisite courses.

- Columns represent courses that require those prerequisites.

- For example, the entry in the COS 303 row and COS 460 column is 1:

$$m_{2,4}=1.$$

- This means that COS 303 is an indirect prerequisite for COS 460.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

**Question**: Is COS 107 an indirect prerequisite for COS 460?
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step 1**: Follow the prerequisite sequence

We know that

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 R COS 303,
  </div>
</div>

<br>

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 303 R COS 364,
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 364 R COS 460.
  </div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step 2**: Apply transitivity

From

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 R COS 303
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 303 R COS 364,
  </div>
</div>

we conclude

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 R COS 364.
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Next, from

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 R COS 364
  </div>
</div>

and

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 364 R COS 460.
  </div>
</div>

we conclude

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 R COS 460.
  </div>
</div>

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step 3**: Check the matrix

- The first row and fourth column contain 1:

$$m_{1,4}=1.$$

- **Result**
	​
<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    COS 107 is an indirect prerequisite for COS 460.
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The prerequisite relation shows the order in which students should complete courses.

- It is not reflexive because a course cannot require itself. It is not symmetric because prerequisite relationships normally move in only one direction. It is antisymmetric because two different courses cannot each be prerequisites for the other. It is transitive because completing an earlier prerequisite may be necessary for every later course in the sequence.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The matrix provides a compact way to store the complete relationship. A 1 indicates a prerequisite relationship, while a 0 indicates that no such relationship exists.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The relation is

> $xRy$ when course $x$ is a direct or indirect prerequisite for course $y$.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Its properties are:

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    Not reflexive
  </div>
</div>

<br>
<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    Not symmetric
  </div>
</div>

<br>
<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    Antisymmetric
  </div>
</div>

<br>
<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    Transitive
  </div>
</div>


   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Summary (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The matrix representation is

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    $$
M_R=
\begin{pmatrix}
0 & 0 & 0 & 0\newline
1 & 0 & 0 & 0\newline
1 & 1 & 0 & 0\newline
1 & 1 & 1 & 0
\end{pmatrix}.
$$
  </div>
</div>

   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
