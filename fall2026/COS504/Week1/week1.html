		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);

		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

<section data-markdown id="ch2" class="center"><textarea data-template>

<p class="definition-rainbow-title">Basic knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A proposition is a statement that is true or false. Compound propositions combine simpler statements using

| Symbol              | LaTeX             | Meaning       | Pronunciation                       |
| ------------------- | ----------------- | ------------- | ----------------------------------- |
| $\neg$            | `\neg`            | Negation      | “not”                               |
| $\land$           | `\land`           | Conjunction   | “and”                               |
| $\lor$            | `\lor`            | Disjunction   | “or”                                |
| $\to$            | `\to`             | Implication   | “implies,” “if…then,” or “leads to” |
| $\leftrightarrow$ | `\leftrightarrow` | Biconditional | “if and only if,” abbreviated “iff” |
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A predicate contains variables, such as P(x): “x submitted the assignment.” Quantifiers say whether a predicate applies to all objects or at least one object.

- A proof is a carefully justified explanation that begins with assumptions and ends at a conclusion.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.

   </div>
</div>

</textarea></section>

</section>

<section data-markdown id="ch3" class="center"><textarea data-template>

<p class="definition-rainbow-title">Basic examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Truth table for a login rule</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Rule: access is granted when A $\land$ (P $\lor$ T), where A means authenticated, P means paid account, and T means temporary instructor override.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Truth table for a login rule (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step-by-step solution.** List all eight combinations of A, P, and T. Compute P $\lor$ T first, then A $\land$ (P $\lor$ T). Access is true only when A is true and at least one of P or T is true.

   </div>
</div>



> The rule protects the system because no unauthenticated user can access even if P or T is true.



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Direct proof with even numbers</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Prove: if n is even, then $n^2$ is even.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Direct proof with even numbers (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- **Step-by-step solution.** Assume $n=2k$ for an integer $k$. Then $n^2=(2k)^2=4k^2=2(2k^2)$. Since $2k^2$ is an integer, $n^2$ is even.

   </div>
</div>



> The structure is assumption $\rightarrow$ definition $\rightarrow$ algebra $\rightarrow$ conclusion.
</textarea></section>

</section>

<section data-markdown id="ch5" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced knowledge</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Logical equivalence lets us replace one statement with another that has the same truth value in every case.

- Rules of inference such as modus ponens and modus tollens allow short, checkable reasoning chains.

- Proof strategy matters: direct proof is efficient for constructive claims; contraposition helps with implications; contradiction helps when assuming the opposite creates an impossibility.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>

</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Contrapositive proof</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Prove: if $n^2$ is odd, then $n$ is odd.
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Contrapositive proof (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step-by-step solution.** Prove the contrapositive: if n is even, then $n^2$ is even. This was shown in the basic example. Therefore the original statement is true.

- **Why it matters.** The contrapositive often turns a difficult implication into an easier one.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Valid argument check</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Premises: $p \rightarrow q$, $q \rightarrow r$, and $p$. Conclusion: $r$.
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Valid argument check (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Step-by-step solution.** From $p$ and $p \rightarrow q$, use modus ponens to get $q$. From $q$ and $q \rightarrow r$, use modus ponens again to get $r$.

- **Why it matters.** This is a formal chain of reasoning, not just intuition.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch8" class="center"><textarea data-template>

<p class="definition-rainbow-title">Task</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Task</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Task.** Design a small “classroom access” policy using at least three propositions. Build its truth table, find one allowed case and one denied case, then explain why the result is fair or unfair.

- **Deliverable.** One clear model, one worked example, and a short explanation of the result.

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reference answer</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Classroom Access Policy

- Propositions

Let:

- $E$: The person is enrolled in the class.
- $I$: The person has a valid school ID.
- $P$: The person has permission from the instructor.
- $A$: The person is allowed to enter the classroom.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reference answer (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Policy Model

A person may enter when they have a valid school ID and they are either enrolled in the class or have instructor permission.

$$
A = I \land (E \lor P)
$$

This policy allows:

- Enrolled students with valid identification.
- Approved visitors with valid identification.

It denies access to anyone without valid identification.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Reference answer (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Truth Table

| $E$ | $I$ | $P$ | $E \lor P$ | $A = I \land (E \lor P)$ | Result |
|:---:|:---:|:---:|:---:|:---:|:---:|
| F | F | F | F | F | Denied |
| F | F | T | T | F | Denied |
| F | T | F | F | F | Denied |
| F | T | T | T | T | Allowed |
| T | F | F | T | F | Denied |
| T | F | T | T | F | Denied |
| T | T | F | T | T | Allowed |
| T | T | T | T | T | Allowed |
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
