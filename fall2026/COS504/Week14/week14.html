		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A tree is a connected graph with no cycles. Between any two vertices in a tree, there is exactly one simple path.

- Rooted trees organize hierarchy: each non-root vertex has a parent.

- Leaves have no children; internal vertices have at least one child.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Ideas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Identify the objects in the problem.
- Choose notation that makes relationships clear.
- Work on a small example before solving the general case.
- Explain the answer in plain English after the calculation.

   </div>
</div>
</textarea></section>

</section>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Folder tree</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** A computer folder system has a root folder, subfolders, and files.

- **Step-by-step solution.** The root is the top folder. Subfolders are children. Files or empty folders may be leaves.

- **Check.** The unique path property makes file addresses possible.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Expression tree</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Expression $(a+b)\cdot c$ has root $×$, left child $+$, and right child $c$.

- **Step-by-step solution.** The + node has children $a$ and $b$. Traversal determines notation: infix, prefix, or postfix.

- **Check.** Trees represent structure, not just text order.
   </div>
</div>
</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Tree traversal visits vertices in a systematic order: preorder, inorder, postorder, or level order.

- Spanning trees connect all vertices of a graph using no cycles.

- Minimum spanning trees minimize total edge weight and are important in network design.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">How to Think</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Ask what structure is hidden in the problem.
- Look for an invariant, equivalence, ordering, recurrence, or optimization goal.
- Use the simplest representation that preserves the important information.
- Check whether the method scales when the input becomes large.
   </div>
</div>
</textarea></section>

</section>

<section data-markdown id="ch6" class="center"><textarea data-template>

<p class="definition-rainbow-title">Advanced examples</p>

</textarea></section>

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

<div class="definition-com-container">
  <div class="definition-com-title">Example 1: Traversal example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** For a binary expression tree with root $×$, left $+$ with $a$,$b$, and right $c$.

- **Step-by-step solution.** Preorder gives $× + a b c$. Inorder gives $a + b × c$ with parentheses needed. Postorder gives $a b + c ×$.

- **Why it matters.** Different traversals support different computations.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Example 2: Minimum spanning tree idea</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- **Problem.** Given towns connected by possible roads with costs, choose roads connecting all towns with minimum total cost and no cycles.

- **Step-by-step solution.** Algorithms such as Kruskal’s or Prim’s add cheap useful edges while avoiding cycles.

- **Why it matters.** A tree is enough to connect everything without redundancy.
   </div>
</div>
</textarea></section>

</section>

> File-System Tree



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Tree Model</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

A file system can be represented as a rooted tree.

- Each folder or file is a vertex.
- An edge connects a folder to an item stored directly inside it.
- The top-level folder is the root.
- Files and empty folders are leaves.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Tree Model (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Consider the following file system:

```
CourseFiles/
│
├── syllabus.pdf
│
├── Lectures/
│   ├── week1.pdf
│   └── week2.pdf
│
└── Labs/
    ├── lab1.py
    └── Data/
        └── sample.csv
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Vertices and Edges</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The vertex set is

V={CourseFiles,syllabus.pdf,Lectures,week1.pdf,week2.pdf,Labs,lab1.py,Data,sample.csv}.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Vertices and Edges (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The parent-child edges are

```
CourseFiles → syllabus.pdf
CourseFiles → Lectures
CourseFiles → Labs
Lectures   → week1.pdf
Lectures   → week2.pdf
Labs       → lab1.py
Labs       → Data
Data       → sample.csv
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Root</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The root is the vertex with no parent.

- For this tree, the root is

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    CourseFiles.
  </div>
</div>

- Every other item can be reached by beginning at CourseFiles and following parent-child edges.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Leaves</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A leaf is a vertex with no children.

- The leaves are
​
<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    syllabus.pdf,week1.pdf,week2.pdf,lab1.py,sample.csv.
  </div>
</div>

- These vertices are files, so they do not contain other items.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Internal Vertices</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- An internal vertex has at least one child.

- The internal vertices are

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    CourseFiles,Lectures,Labs,Data.
  </div>
</div>

- For example, Lectures is an internal vertex because it contains week1.pdf and week2.pdf.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Height of the Tree</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Define the height as the number of edges in the longest path from the root to a leaf.

- The longest root-to-leaf path is

```
CourseFiles → Labs → Data → sample.csv
```

- This path contains three edges.

- Therefore, the height of the tree is

$$3.$$
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Preorder Traversal</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- A preorder traversal visits:

	- The current vertex
	- Each child subtree from left to right

   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Preorder Traversal (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The recursive pseudocode is:

```
PROCEDURE Preorder(item)

    VISIT item

    FOR each child of item from left to right

        Preorder(child)

    END FOR

END PROCEDURE
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example: Preorder Traversal</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Begin at the root:

```
CourseFiles
```

- Visit its first child:

```
syllabus.pdf
```

- Then visit the Lectures subtree:

```
Lectures
week1.pdf
week2.pdf
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Worked Example: Preorder Traversal (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Finally, visit the Labs subtree:

```
Labs
lab1.py
Data
sample.csv
```

- The complete preorder traversal is

```
CourseFiles,
syllabus.pdf,
Lectures,
week1.pdf,
week2.pdf,
Labs,
lab1.py,
Data,
sample.csv
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Traversal Trace</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

| Step | Visited vertex |
| :--: | :------------- |
|   1  | `CourseFiles`  |
|   2  | `syllabus.pdf` |
|   3  | `Lectures`     |
|   4  | `week1.pdf`    |
|   5  | `week2.pdf`    |
|   6  | `Labs`         |
|   7  | `lab1.py`      |
|   8  | `Data`         |
|   9  | `sample.csv`   |

- Every vertex is visited exactly once.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Finding a File</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Suppose we want to find sample.csv.

- Using preorder traversal, the search visits:

```
CourseFiles
→ syllabus.pdf
→ Lectures
→ week1.pdf
→ week2.pdf
→ Labs
→ lab1.py
→ Data
→ sample.csv
```
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Finding a File (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The file is found at the path

```
CourseFiles/Labs/Data/sample.csv
```

- The corresponding tree path is

<div style="text-align:center;">
  <div style="border:2px solid #333; padding:12px 20px; display:inline-block; border-radius:6px;">
    CourseFiles→Labs→Data→sample.csv.
  </div>
</div>
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Real Use of the Tree</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

File-system trees are used by operating systems to organize and locate files.

A recursive traversal can support tasks such as:

- Searching for a file
- Calculating folder size
- Copying an entire folder
- Creating a backup
- Deleting a folder and all its contents
- Displaying the directory structure

For example, a backup program can use preorder traversal to visit every folder and file under CourseFiles.
   </div>
</div>



<div class="definition-com-container no-copy">
  <div class="definition-com-title">Explanation of the Result</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The file system forms a tree because every item except the root has exactly one parent, and there are no cycles.
- The root is CourseFiles, and the files are leaves because they contain no children. The longest path from the root to a leaf contains three edges, so the height is three.
- The preorder traversal visits a folder before visiting its contents. This makes it useful for displaying directory structures, searching for files, and copying folders.
   </div>
</div>

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
