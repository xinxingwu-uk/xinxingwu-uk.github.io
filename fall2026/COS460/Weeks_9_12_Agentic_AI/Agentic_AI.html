<div class="definition-container">
  <div class="definition-title">Building and Customizing Agents - Session and Memory</div>
  <div class="definition-shadebox">
  <div style="width: 1000px;"></div>

This subsection explores how agents maintain context across interactions. Sessions and memory are what allow agents to go beyond single-turn interactions and operate effectively over extended, multi-step tasks. Understanding these concepts is essential for building agents that feel coherent and intelligent.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">What is a session?</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

A session is created on the first interaction with an agent and records the context for all ongoing interactions. It encapsulates conversational history, the state of the agent, and available tools. Sessions are the foundation of continuity in agentic systems.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">What is a session? (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The first interaction with an agent creates a new session
	- Records and defines the context for all ongoing interactions

- A session encapsulates several key elements such as:
	- Conversational history
	- State of the agent
	- Available tools
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Agent state</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Agent’s state tracks important information such as:
	- System prompt
	- Past interactions
		- Conversation history, tool usage, scratch pad logs, etc
	- Status of the agent
		- Such as ready, executing and error
	- User preferences and credentials
		- Login information, retry policy, default applications, etc

- Some frameworks assume session and state are the same

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Further Reading</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Link 1 - https://strandsagents.com/latest/documentation/docs/user-guide/concepts/agents/state/

Link 2 - https://strandsagents.com/latest/documentation/docs/user-guide/concepts/agents/session-management/

Link 3 - https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_SessionState.html#bedrock-Type-agent-runtime_SessionState

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">From single pass to continuous execution</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Single pass agent:
	- Generates a plan and executes the steps in a single interaction
	- Follows a clear linear path
	- Suitable for well-defined, linear tasks with clear objectives

- What happens if a single pass if not enough?
	- Next step depends on the output of the previous one
	- Requires dynamic reasoning and planning
	- Errors during execution

- Need for continuous execution

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Agent loop – continuous execution</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The agent loop enables agents to repeatedly and dynamically interact with their environment. It supports iterative reasoning, planning, and action — making agents more adaptive than single-pass execution. The loop tracks and updates the session at each iteration, allowing the agent to respond to new information.

   </div>
</div>



<img src="images/fig96.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Memory is used to persist session information across interactions. It stores user preferences, external knowledge, past interactions, tool outputs, and errors and retries. Without memory, agents cannot learn from past experiences or maintain context across sessions.
   </div>
</div>

<img src="images/fig97.png"  align="left" height="200px" width="300px"/>



<div class="definition-container">
  <div class="definition-title">Memory types</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- There are two primary types of memory: short-term memory (stored in the LLM's context window) and long-term memory (stored in an external memory store). The LLM accesses both types to generate responses. The choice of memory type depends on the retention period and the nature of the information being stored.

   </div>
</div>



<img src="images/fig98.png"  align="left" height="600px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Short-term vs long-term agentic memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Short-term memory retains information for seconds or minutes and supports immediate interactions. Long-term memory retains information for days, months, or years and supports historical data, knowledge bases, and extended user interactions. Both types are essential for building capable, context-aware agents. 	
   </div>
</div>



<img src="images/fig99.png"  align="left" height="400px" width="800px"/>



<img src="images/fig100.png"  align="left" height="500px" width="650px"/>



<div class="definition-container">
  <div class="definition-title">Short-term memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Mainly used to track current session and agent’s state
	- Working context
- Cleared once the session is reset
- Capacity limited by model’s context window
	- Even if context window is large, LLMs tend to perform poorly over long contexts
- Useful for enabling quick, real-time responses

   </div>
</div>



<img src="images/fig101.png"  align="left" height="300px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Long-term memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Long-term memory is the agent's persistent repository of information, accumulated over extended periods. It allows the agent to access stored information across multiple sessions — including learned patterns and past experiences. Long-term memory is the basis for an agent's growth, adaptability, and development of expertise.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Long-term memory: Episodic memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Episodic memory stores recall of past events and actions — such as agent traces and tool use logs.

- Example: a user asks, "What was the mean and std of the dataset we used yesterday?" The agent retrieves the relevant trace from episodic memory and provides an accurate answer without re-running the analysis.

   </div>
</div>



<img src="images/fig102.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Long-term memory: Semantic memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Semantic memory stores facts and concepts and is used to personalize applications. Example: when a user mentions it's Andy's birthday, the agent updates Andy's profile in semantic memory — adding his date of birth and incrementing his age. This enables personalized, context-aware interactions over time. 

   </div>
</div>



<img src="images/fig103.png"  align="left" height="500px" width="600px"/>



<div class="definition-container">
  <div class="definition-title">Long-term memory: Procedural memory</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Procedural memory stores rules for performing tasks.

- Example: a classification agent stores rules like "Classify into 'Yes', 'No', or 'Maybe' based on the following criteria..." in procedural memory. This allows the agent to apply consistent logic across interactions without re-specifying rules each time.

   </div>
</div>



<img src="images/fig104.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Updating long-term memories</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Long-term memories can be updated in real time (immediately available but increases latency) or in the background (eliminates latency in the primary application but requires careful management of update frequency). The choice depends on the application's latency requirements and the criticality of having up-to-date memory.

   </div>
</div>



<img src="images/fig105.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Some long-term memory systems</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Several long-term memory systems are available: A-Mem (improves long-term interaction and reasoning for multi-step tasks), Mem0 (enables personalized, context-aware responses and reduces prompt size), AgentX (uses RAG and CoT to build a knowledge base), and MemGPT (adds memory to GPT-based systems).

   </div>
</div>

<img src="images/fig106.png"  align="left" height="200px" width="300px"/>



<div class="definition-container">
  <div class="definition-title">Overview of A-MEM</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- A-MEM creates interconnected knowledge networks using the Zettelkasten method. It structures memory dynamically for continuous evolution and supports context-aware memory retrieval — retrieving memory notes to create context-rich prompts. This approach enables agents to build and leverage a growing, interconnected knowledge base.

   </div>
</div>



<img src="images/fig107.png"  align="left" height="250px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">A-MEM: How it works</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- To add a new memory:
	- Generate comprehensive notes with structured attributes 
	- Create contextual descriptions and tags
		- Timestamp, content, context, keywords, etc
	- Analyze historical memories for relevant connections
	- Establish meaningful links based on similarities
   </div>
</div>



<img src="images/fig108.png"  align="left" height="550px" width="500px"/>



> Building and Customizing Agents - Controlling and validating flows



<div class="definition-container">
  <div class="definition-title">Review: Agent loop</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Receives user input and contextual information
- Processes the input using a language model (LLM)
- Decides whether to use tools to gather information or perform actions
- Executes tools and receives results
- Continues reasoning with the new information
- Produces a final response or iterates again through the loop
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Customizing agent flow</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Agent flows can be customized based on the framework and task requirements. 

- Example Flow 1: a single tool-calling agent that takes user input and produces a final answer. Example Flow 2: a router that directs queries to specialized agents (e.g., a News Agent or Weather Agent) based on the nature of the request.

   </div>
</div>



<img src="images/fig109.png"  align="left" height="550px" width="600px"/>



<div class="definition-container">
  <div class="definition-title">Agent flow: Execution and moderation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Agent execution can be linear or cyclic, with configurable limits on the number of loops. The prompting strategy (ReAct, plan-and-execute, etc.) is also part of the flow design. Moderation includes error handling, automated validation, and human validation — ensuring that the agent behaves reliably and safely.

   </div>
</div>



<img src="images/fig110.png"  align="left" height="200px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Agent flow: Tools</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Access to tools
	- Direct tool access or requires procedural knowledge
	- Access to multiple tools at once
	- Login information for certain tools
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Agent flow: Session and state</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Agents can be designed to view or modify conversation history, observe their own state, and observe other agents' states. This level of introspection enables more sophisticated coordination in multi-agent systems and allows agents to adapt their behavior based on the current context.

   </div>
</div>



<img src="images/fig111.png"  align="left" height="200px" width="500px"/>



<div class="definition-container">
  <div class="definition-title">Human-in-the-loop validation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Enforce human validation during agent’s execution

- Useful for critical steps:
	- Performing certain actions
		- Example: Update or delete data
	- Requesting personal or sensitive information
	- Access to certain tools or knowledge bases
	- Hand-off decision making to human expert


   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Building and Customizing Agents - MCP</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

This section introduces the Model Context Protocol (MCP), an open standard for integrating LLMs with external tools and data sources. MCP is becoming an important part of the agentic AI ecosystem, enabling standardized, secure, and scalable tool integrations.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Model Context Protocol (MCP)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Open protocol for seamless integration between LLM and tools
	- Standardized interface: Common protocols for different types of integrations
	- Security: Authentication and permissions control
	- Bi-directional communication
	- Flexible and scalable
   </div>
</div>



<img src="images/fig112.png"  align="left" height="300px" width="400px"/>



<div class="definition-container">
  <div class="definition-title">Review: MCP components</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Main components of MCP are:
	- Host: AI agents and programs wanting access to data through MCP
	- MCP client: Protocol clients that maintain 1:1 connections with servers
	- MCP server: Lightweight software exposing capabilities
	- Server tools: Local(database, files) and remote services(APIs) accessible by MCP servers
   </div>
</div>



<img src="images/fig113.png"  align="left" height="250px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Message types</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

MCP supports four message types: Requests (to get a response from the other side), Results (successful responses to requests), Errors (indicating a request failed), and Notifications (one-way messages that don't expect a response). Understanding these message types is essential for implementing and debugging MCP-based integrations.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Connection lifecycle</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Initialization:
	- Client send initialize request to which server responds
	- Normal message exchange begins

- Message exchange: 
	- Request/Response: Client or server send requests and the other responds
	- Notification: Client or server can send one-way messages

- Termination: 
	- Client or server can terminate the connection

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">MCP overview</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- MCP standardizes access and use of external tools
- Easily scale AI applications with new tools and data sources
- Incorporate several security features 
	- Still susceptible to prompt injection, tool poisoning, malicious servers, etc.
- MCP’s ecosystem is still developing
	- Lack of intelligent search options 
- Multiple active MCP connections can consume a lot of tokens
	- Affect reasoning performance

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Building and Customizing Agents - Agentic frameworks</div>
  <div class="definition-shadebox">
  <div style="width: 1000px;"></div>

This section provides an overview of the major agentic frameworks available today. The choice of framework has significant implications for development speed, customizability, memory management, and integration capabilities. Four frameworks are covered: Amazon Bedrock Agents, Amazon Bedrock AgentCore, Strands, Crew AI, and LangGraph.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">LangGraph</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- LangGraph is the most customizable framework, allowing for the design of complex agent graphs and custom cyclic workflows. It has a steeper learning curve but offers full control over agent flow. It supports a long list of third-party tool integrations and model providers, for example, Amazon, including AWS Bedrock, and provides robust short-term and long-term memory management.

from smolagents import tool

_ALLOWED_BINARY = {
    ast.Add: operator.add,
    ast.Sub: operator.sub,
    ast.Mult: operator.mul,
    ast.Div: operator.truediv,
    ast.FloorDiv: operator.floordiv,
    ast.Mod: operator.mod,
    ast.Pow: operator.pow,
}
_ALLOWED_UNARY = {ast.UAdd: operator.pos, ast.USub: operator.neg}
_ALLOWED_FUNCTIONS = {
    "sqrt": math.sqrt,
    "abs": abs,
    "round": round,
}

def _evaluate_node(node):
    if isinstance(node, ast.Expression):
        return _evaluate_node(node.body)
    if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):
        return node.value
    if isinstance(node, ast.BinOp) and type(node.op) in _ALLOWED_BINARY:
        return _ALLOWED_BINARY[type(node.op)](
            _evaluate_node(node.left), _evaluate_node(node.right)
        )
    if isinstance(node, ast.UnaryOp) and type(node.op) in _ALLOWED_UNARY:
        return _ALLOWED_UNARY[type(node.op)](_evaluate_node(node.operand))
    if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
        function = _ALLOWED_FUNCTIONS.get(node.func.id)
        if function is None or node.keywords:
            raise ValueError("That function is not allowed.")
        arguments = [_evaluate_node(argument) for argument in node.args]
        return function(*arguments)
    raise ValueError(
        "Only numbers, parentheses, +, -, *, /, //, %, **, sqrt(), abs(), and round() are allowed."
    )

@tool
def safe_calculator(expression: str) -> str:
    """Evaluate a numeric arithmetic expression safely.

    Args:
        expression: Arithmetic expression using numbers, parentheses, basic operators,
            or the functions sqrt(), abs(), and round(). For example: sqrt(1764).

    Returns:
        The numeric result, or a calculator error message that explains valid syntax.
    """
    try:
        tree = ast.parse(expression, mode="eval")
        return str(_evaluate_node(tree))
    except Exception as exc:
        return f"Calculator error: {exc}"

print("Calculator power test:", safe_calculator.forward(expression="1764 ** 0.5"))
print("Calculator sqrt test:", safe_calculator.forward(expression="sqrt(1764)"))

```
def _message_text(response):
    if hasattr(response, "content"):
        return response.content
    return str(response)

def _model_messages(messages):
    # Structured content format supported by the smolagents model interface.
    return [
        {
            "role": item["role"],
            "content": [{"type": "text", "text": item["content"]}],
        }
        for item in messages
    ]

class LocalChatSession:
    def __init__(self, model, system_prompt="You are a helpful assistant.", window_pairs=None):
        self.model = model
        self.system_prompt = system_prompt
        self.window_pairs = window_pairs
        self.messages = []

    def _context(self):
        history = self.messages
        if self.window_pairs is not None:
            history = history[-2 * self.window_pairs:]
        return [{"role": "system", "content": self.system_prompt}] + history

    def ask(self, text):
        self.messages.append({"role": "user", "content": text})
        response = self.model(_model_messages(self._context()))
        answer = _message_text(response)
        self.messages.append({"role": "assistant", "content": answer})
        return answer

    def save(self, path):
        payload = {
            "system_prompt": self.system_prompt,
            "window_pairs": self.window_pairs,
            "messages": self.messages,
        }
        Path(path).write_text(json.dumps(payload, indent=2), encoding="utf-8")

    @classmethod
    def load(cls, model, path):
        payload = json.loads(Path(path).read_text(encoding="utf-8"))
        session = cls(
            model=model,
            system_prompt=payload["system_prompt"],
            window_pairs=payload["window_pairs"],
        )
        session.messages = payload["messages"]
        return session

print("LocalChatSession is ready.")

_captioner = None


@tool
def describe_image(image_path: str) -> str:
    """Generate a short local caption for an image file.

    Args:
        image_path: Path to a PNG, JPEG, or WebP image.

    Returns:
        A caption produced by a local BLIP image model.
    """
    global _captioner

    from pathlib import Path
    from PIL import Image
    import torch
    from transformers import BlipProcessor, BlipForConditionalGeneration

    path = Path(image_path)

    if not path.exists():
        return f"Image not found: {image_path}"

    try:
        image = Image.open(path).convert("RGB")
    except Exception as exc:
        return f"Could not open image: {exc}"

    if _captioner is None:
        processor = BlipProcessor.from_pretrained(
            "Salesforce/blip-image-captioning-base"
        )

        model = BlipForConditionalGeneration.from_pretrained(
            "Salesforce/blip-image-captioning-base"
        )

        # Keep BLIP on CPU to preserve GPU memory for LOCAL_MODEL.
        model = model.to("cpu")
        model.eval()

        _captioner = {
            "processor": processor,
            "model": model,
        }

    processor = _captioner["processor"]
    model = _captioner["model"]

    inputs = processor(
        images=image,
        return_tensors="pt",
    )

    with torch.no_grad():
        generated_ids = model.generate(
            **inputs,
            max_new_tokens=50,
            do_sample=False,
        )

    caption = processor.decode(
        generated_ids[0],
        skip_special_tokens=True,
    )

    return caption.strip()


print(
    describe_image.forward(
        image_path=str(status_image_path)
    )
)

def _workspace_path(relative_path: str) -> Path:
    candidate = (WORKSPACE / relative_path).resolve()
    root = WORKSPACE.resolve()
    if candidate != root and root not in candidate.parents:
        raise ValueError("Path must stay inside the lab workspace.")
    return candidate

@tool
def write_text_file(relative_path: str, content: str) -> str:
    """Write UTF-8 text inside the lab workspace.

    Args:
        relative_path: Destination path relative to the lab workspace.
        content: Text content to write.

    Returns:
        Confirmation containing the saved path.
    """
    path = _workspace_path(relative_path)
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(content, encoding="utf-8")
    return f"Saved {len(content)} characters to {path}"

@tool
def read_text_file(relative_path: str) -> str:
    """Read UTF-8 text from the lab workspace.

    Args:
        relative_path: File path relative to the lab workspace.

    Returns:
        File content or a useful error message.
    """
    path = _workspace_path(relative_path)
    if not path.exists():
        return f"File not found: {path}"
    return path.read_text(encoding="utf-8")

@tool
def dataframe_summary(tsv_path: str) -> str:
    """Summarize a local TSV dataset with pandas.

    Args:
        tsv_path: Absolute path to a tab-separated data file.

    Returns:
        JSON containing row count, columns, missing counts,
        and numeric summaries.
    """
    path = Path(tsv_path)

    if not path.exists():
        return json.dumps(
            {"error": f"File not found: {path}"},
            indent=2,
        )

    try:
        frame = pd.read_csv(path, sep="\t")
    except Exception as exc:
        return json.dumps(
            {"error": f"Could not read TSV file: {exc}"},
            indent=2,
        )

    numeric_frame = frame.select_dtypes(include=[np.number])

    if numeric_frame.empty:
        numeric_summary = {}
    else:
        numeric_summary = (
            numeric_frame
            .describe()
            .round(3)
            .to_dict()
        )

    result = {
        "rows": int(len(frame)),
        "columns": [str(column) for column in frame.columns],
        "missing_values": {
            str(column): int(count)
            for column, count in frame.isna().sum().items()
        },
        "numeric_fields": [
            str(column)
            for column in numeric_frame.columns
        ],
        "numeric_summary": numeric_summary,
    }

    return json.dumps(result, indent=2)


data_agent = CodeAgent(
    tools=[dataframe_summary],
    model=LOCAL_MODEL,

@tool
def generate_image_local(prompt: str, output_name: str) -> str:
    """Generate an image locally with a Diffusers text-to-image model.

    Args:
        prompt: Description of the desired image.
        output_name: PNG filename to save inside the outputs directory.

    Returns:
        Path to the generated image or a message explaining why generation was skipped.
    """
    global _image_pipe
    if not torch.cuda.is_available():
        return "A CUDA GPU is required. In Colab select Runtime → Change runtime type → T4 GPU."

    from diffusers import StableDiffusionPipeline

    safe_name = Path(output_name).name
    if not safe_name.lower().endswith(".png"):
        safe_name += ".png"
    output_path = OUTPUT_DIR / safe_name

    if _image_pipe is None:
        _image_pipe = StableDiffusionPipeline.from_pretrained(
            "segmind/tiny-sd",
            torch_dtype=torch.float16,
        ).to("cuda")
        _image_pipe.enable_attention_slicing()

    image = _image_pipe(
        prompt,
        num_inference_steps=20,
        guidance_scale=7.0,
        height=512,
        width=512,
    ).images[0]
    image.save(output_path)
    return str(output_path)

@tool
def review_statistics(tsv_path: str) -> dict:
    """Compute review counts and rating statistics from a TSV file.

    Args:
        tsv_path: Absolute path to the smart-speaker review TSV.

    Returns:
        A dictionary containing review counts, rating statistics,
        and issue-term counts.
    """
    path = Path(tsv_path)

    if not path.exists():
        return {"error": f"File not found: {path}"}

    try:
        frame = pd.read_csv(path, sep="\t")
    except Exception as exc:
        return {"error": f"Could not read the TSV file: {exc}"}

    required_columns = {"date", "rating", "review"}
    missing_columns = required_columns - set(frame.columns)

    if missing_columns:
        return {
            "error": (
                "Missing required columns: "
                + ", ".join(sorted(missing_columns))
            )
        }

    frame["rating"] = pd.to_numeric(
        frame["rating"],
        errors="coerce",
    )

    frame["date"] = (
        pd.to_datetime(frame["date"], errors="coerce")
        .dt.strftime("%Y-%m-%d")
    )

    valid_dates = frame["date"].dropna()

    if valid_dates.empty:
        busiest_date = None
        reviews_on_busiest_date = 0
    else:
        date_counts = valid_dates.value_counts()
        busiest_date = str(date_counts.idxmax())
        reviews_on_busiest_date = int(date_counts.max())

    lower_reviews = " ".join(
        frame.loc[
            frame["rating"] <= 3,
            "review",
        ]
        .fillna("")
        .astype(str)
    ).lower()

    issue_terms = [
        "wi-fi",
        "setup",
        "microphone",
        "audio",
        "app",
        "connection",
        "sound",
        "stutters",
        "volume",
    ]

    issue_counts = {
        term: lower_reviews.count(term)
        for term in issue_terms
    }

    issue_counts = dict(
        sorted(
            issue_counts.items(),
            key=lambda item: item[1],
            reverse=True,
        )
    )

    rating_counts = (
        frame["rating"]
        .dropna()
        .value_counts()
        .sort_index()
    )

    result = {
        "row_count": int(len(frame)),
        "three_star_count": int(
            (frame["rating"] == 3).sum()
        ),
        "date_with_most_reviews": busiest_date,
        "reviews_on_busiest_date": reviews_on_busiest_date,
        "rating_distribution": {
            str(int(rating)): int(count)
            for rating, count in rating_counts.items()
        },
        "issue_term_counts_in_low_ratings": issue_counts,
    }

    return result


review_agent = CodeAgent(
    tools=[review_statistics],
    model=LOCAL_MODEL,

from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.metrics.pairwise import cosine_similarity


@tool
def search_troubleshooting_docs(query: str) -> str:
    """Search local troubleshooting Markdown files using TF-IDF similarity.

    Args:
        query: Description of the device problem.

    Returns:
        The most relevant document excerpts with similarity scores.
    """
    files = sorted(DOCS_DIR.glob("*.md"))

    if not files:
        return "No troubleshooting documents were found."

    texts = [
        path.read_text(encoding="utf-8").strip()
        for path in files
    ]

    try:
        matrix = TfidfVectorizer(
            stop_words="english"
        ).fit_transform(texts + [query])

        scores = cosine_similarity(
            matrix[-1],
            matrix[:-1],
        ).flatten()

    except Exception as exc:
        return f"Document search failed: {exc}"

    ranked = np.argsort(scores)[::-1][:2]

    results = []

    for index in ranked:
        # Limit excerpt length to reduce token and GPU-memory usage.
        excerpt = texts[index][:1500]

        results.append(
            f"Source: {files[index].name}\n"
            f"Similarity score: {scores[index]:.3f}\n"
            f"{excerpt}"
        )

    return "\n\n".join(results)

import codecs

@tool
def count_character(text: str, character: str) -> str:
    """Count exact occurrences of one character.

    Args:
        text: Input text.
        character: Character to count.

    Returns:
        Integer count as text.
    """
    if len(character) != 1:
        return "character must contain exactly one character"
    return str(text.count(character))

@tool
def decode_rot13(text: str) -> str:
    """Decode ROT13 text.

    Args:
        text: ROT13-encoded text.

    Returns:
        Decoded text.
    """
    return codecs.decode(text, "rot_13")

@tool
def swap_articles_with_previous_word(text: str) -> str:
    """Swap each article with the word immediately before it.

    Args:
        text: Space-delimited English text.

    Returns:
        Transformed text.
    """
    words = text.split()
    articles = {"a", "an", "the"}
    i = 1
    while i < len(words):
        normalized = words[i].lower().strip(".,!?;:")
        if normalized in articles:
            words[i - 1], words[i] = words[i], words[i - 1]
            i += 2
        else:
            i += 1
    return " ".join(words)

def show_quiz(question, choices, correct_index, explanation):
    """Display a reliable text-based quiz in Google Colab."""

    print("\n" + "=" * 70)
    print(question)
    print("=" * 70)

    letters = ["A", "B", "C", "D", "E", "F"]

    for index, choice in enumerate(choices):
        print(f"{letters[index]}. {choice}")

    valid_letters = letters[:len(choices)]

    while True:
        answer = input(
            f"\nEnter your answer ({'/'.join(valid_letters)}): "
        ).strip().upper()

        if answer in valid_letters:
            break

        print(
            "Invalid choice. Please enter one of: "
            + ", ".join(valid_letters)
        )

    selected_index = valid_letters.index(answer)

    if selected_index == correct_index:
        print("\n Correct.")
    else:
        correct_letter = valid_letters[correct_index]
        correct_answer = choices[correct_index]

        print("\n Not quite.")
        print(
            f"The correct answer is {correct_letter}: "
            f"{correct_answer}"
        )

    print("\nExplanation:")
    print(explanation)

- Let's start with a fundamental insight. Code is the language that we use to communicate with computers. But prompts are the natural language instructions to interact with agentic coding assistants and get them to generate exactly the code that we need. The quality of the generated code is directly related to the quality of your prompts.

<div class="definition-container">
  <div class="definition-title">Prompting best practices: clarity</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The starting point to achieve effective prompts is clarity and specificity. Let's look at what NOT to do versus what works well. A prompt like "Write a function to process data" is problematic because the AI has to guess everything: What kind of data? What does 'process' mean? What should the function return? What programming language? What about edge cases?

- Compare that to this improved prompt: "Write a Python function that takes a list of daily sales figures and returns the total sales by week. If the input list is empty, throw a custom exception." Notice how this specifies the language, function name, input type, output format, and even edge case handling.

   </div>
</div>



<img src="images/fig136.png"  align="left" height="300px" width="800px"/>




<div class="definition-container">
  <div class="definition-title">Prompting best practices: positive voice</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- A second best practice is using positive instructions. Tell the AI what TO do, not what NOT to do. Negative instructions create ambiguity and can confuse your assistant. Instead of saying "Don't use long variable names," say "Use short variable names" or even better, "Use concise but descriptive variable names following Python conventions."

- Positive instructions give clear direction and lead to more consistent, predictable results.


   </div>
</div>

  <div class="definition-title">Prompting best practices: break it down</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The third principle is breaking down complex tasks using patterns like chain-of-thought. Vague requests like "Improve this code" often produce suboptimal results because of their ambiguity.

- Instead, try: "Refactor this package by reducing code redundancies and leveraging library so-and-so. Provide a detailed step-by-step plan with the proposed changes." This approach defines specific goals, requests a plan, and enables iteration.

   </div>
</div>

<div class="definition-container">
  <div class="definition-title">The increasing autonomy of AI agents</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- As AI agents become more autonomous, the stakes of getting things wrong increase significantly. This section examines real-world failures, the unique risks posed by agentic systems, and the strategies and frameworks available for building agents responsibly.

<div class="definition-container">

  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Here is an example from Anthropic, who tested out a Claude-powered AI agent nicknamed Claudius, to operate an experimental vending machine in the Anthropic offices. However, Claudius made some crucial errors.

<div class="definition-container">

	- It also hallucinated fake Venmo accounts to send funds to, and was coerced into giving discounts and free stuff.

Suffice it to say, Claudius was not very successful in running the vending machine.

> Agents can complete ~30% of autonomous tasks



<div class="definition-container">
  <div class="definition-title">A Note</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- In a similar experiment, researchers designed what they called TheAgentCompany, a simulation to benchmark AI agents performing every day professional tasks. The findings revealed that even the most competitive AI agent could only complete about 30% of the tasks autonomously. While the agents could perform simple tasks more easily, they struggled with more long-range tasks that required a series of steps with multiple checkpoints, such as project management or coordination.
- However, these technologies are improving rapidly, and we may be able to entrust agents to do more complex tasks in the near future.
- Further reading: <a href="./files/paper_10.pdf">TheAgentCompany</a>
   </div>
</div>




<div class="definition-container">
  <div class="definition-title">As autonomy increases, so does risk...</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>
  
- As autonomy increases, so can risk. As agents call upon multiple tools and pass information between those tools, errors may compound like a game of telephone. 
- False information or bias can propagate and amplify, especially in the cases of multi-agent collaboration. 
- Observability may become difficult, as there are hidden reasoning and planning steps. 
   </div>
</div>




<div class="definition-container">
  <div class="definition-title">As autonomy increases, so does risk... (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Data exposure risks increase, and attack surfaces expand, especially as agents can automatically invoke or even discover new executable tools. 
- And finally, attribution and liability become more complex, as it becomes harder to pinpoint the source of errors or issues. 
- Explainability of the agent's outputs can become more complex as the agent determines its own plans of action. 
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">What is different about agentic risks specifically?</div>
  <div class="definition-shadebox">
  <div style="width: 900px;"></div>

- What is different about agentic risks specifically? 
- You may be familiar with risk assessment, such as risk assessment best practices from A.W.S. Responsible AI. Typically, we take into account the variables of "likelihood" and "severity". The likelihood is the measure of an event's probability of occurring. 
- For instance, LLMs are prone to hallucination. For a given system, you may say that this risk is "likely". 
	- The next variable is that of "severity", the impact or consequences of that risk occurring. If a model were to hallucinate a movie recommendation or product recommendation, that might be less severe than a hallucination of medical transcripts or dosage amounts. So the severity is also on a continuum, which scales the likelihood value. 
   </div>
</div>



<img src="images/fig141.png"  align="left" height="200px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Further Reading</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Link <a href="./files/paper_11.pdf">Securing Agentic AI</a>

- This paper from AWS Proactive Security also adds in this dimension of "detection difficulty", an added variable specific to AI agents or larger more complex systems with hidden steps not exposed to the user (such as planning, reasoning, and making decisions). Subtle shifts in AI agent behavior or memory will be more difficult to detect than outright attacks that affect the functionality of a service. More on that later.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">AI agents have obfuscated steps</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- AI agents do a lot of work "under the hood" or "behind the scenes". As discussed, these may be the reasoning or planning steps, sometimes referred to as "thoughts".
- "Obfuscated" in this case is referring to these hidden or uninterpretable steps an agent takes to solve a problem. 
- Using our flights example from earlier, the various thoughts, actions, and decisions may or may not be visible to the user. In addition, the way that the agent selects one tool over another may also be unclear, and subtle shifts in input might result in different behavior. 
   </div>
</div>

  <div style="width: 800px;"></div>

- For LLMs, while there are still obfuscated weights or attention scores, the user gets a more direct insight into the result of their input. This is an example of a prompt attack that takes advantage of the helpfulness alignment of LLMs. By instructing the LLM to start its response with "Absolutely!" It tricks the model into giving away unsafe information.

</div>

> Building AI Agents Responsibly - Risk and attack surfaces for AI agents



<div class="definition-container">
  <div class="definition-title">Risk and attack surfaces for AI agents</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- This section provides a detailed examination of the specific attack vectors that target AI agents. Understanding these attack surfaces is the first step toward building effective defenses.

   </div>
</div>




<div class="definition-container">
  <div class="definition-title">Attacks to AI agents may affect more obfuscated steps</div>
  <div class="definition-shadebox">
  <div style="width: 950px;"></div>

- Unlike the LLM prompt attack example, this example demonstrates something called reasoning path highjacking, where the end user may never see how the reasoning path was manipulated. The user asks for shopping recommendations, and the agent provides some options. Hidden along the way is an attacker who has manipulated the reasoning path to favor their company's products more heavily. 

- Reasoning path highjacking. Mitigation: Enforce minimum brand diversity requirements, Regular retraining with verified data, Brand representation balance, New brand introduction rate

   </div>
</div>



<img src="images/fig144.png"  align="left" height="600px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Attack vectors for AI agents</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- As a broad overview, these are some categories of attack vectors for AI agents. Like the previous example demonstrated, there are planning and agency vulnerabilities. Subtle changes in input to an agent can shift how it reasons, decomposes goals, or chooses between multiple actions.
- Agents also have unique memory structures which pose risks. Gradual poisoning of the agent memory and context can influence future decisions.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Attack vectors for AI agents (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Because agents have the ability to execute tools, there can also be risks due to unsafe chaining of the actions. Chaining together actions that individually seem safe may be used to escalate privilege or bypass safeguards.
- There are also identity and authentication challenges that must be carefully managed. Especially in the case of multi-agent collaboration, an agent may act as a "confused deputy", where the agent is tricked into using its privileges in a harmful way.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Attack vectors for AI agents (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Let's look at some specific examples of attacks.

	- prompt injection changes what LLMs output, but for agents the prompt injection can actually shift how it reasons, decomposes goals, or chooses between multiple actions or tools.

	- Memory persistence risks involve gradual poisoning of the the agent memory, such as an attacker introducing misleading information over time to linger in the agent’s memory and influence future decisions
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">DoS via computational resource manipulation</div>
  <div class="definition-shadebox">
  <div style="width: 950px;"></div>

- Here is an example of a computational resource manipulation attack. The attacker forces the agent to get caught in an infinite loop, resulting in denial of service or resource exhaustion. In this case, the agent is infinitely comparing unique IDs looking for a match that doesn't exist. This resource exhaustion can also happen accidentally, not always maliciously. Best practice is to impose limits on tool calls or recursion depth, which may be configurable in your framework of choice. 
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">DoS via computational resource manipulation (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 950px;"></div>

- Impose limits for tool calls or recursion depth – you may be able to do this through various configuation methods. For example, Strands has some parameters for event loop cycle that are customizable: https://strandsagents.com/latest/documentation/docs/user-guide/concepts/agents/agent-loop/
   </div>
</div>



<img src="images/fig145.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Further Reading</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Link <a href="https://strandsagents.com/latest/documentation/docs/user-guide/concepts/agents/agent-loop/">Agent Loop</a>

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Tool poisoning and shadow functions</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Another type of attack is called tool poisoning, where attackers tamper with individual tools within an MCP environment. Tool poisoning involves modifying a tool's internal logic to embed hidden behavior. In this example, the calendar tool has some access to the file system for copying appointment details. Hidden in the function is a malicious extraction of the user's encryption keys.

- NOTE: Currently, there is a mechanism in MCP to notify the client if any tools change. It is disabled by default, but can be turned on with `listchanged`. Please turn this on!
   </div>
</div>



<img src="images/fig146.png"  align="left" height="400px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Further Reading</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Link <a href="https://www.lasso.security/blog/top-mcp-security-risks">Top MCP Security Risks: Critical Vulnerabilities in GenAI-Powered Apps</a>

   </div>
</div>




<div class="definition-container">
  <div class="definition-title">Stored prompt injection via SQL query</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Our next attack is an example of stored prompt injection. 
- In this example, the customer service representative is using an agent to perform SQL queries via natural language. 
- When looking up a certain customer's data, the agent retrieves a poisoned data row with a hidden, malicious, prompt as the result. 
- The prompt sends out a phishing email to employees at the company, with a malicious link disguised as mandatory security updates.
   </div>
</div>



<img src="images/fig147.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Reward hacking due to unclear instructions</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Another risk to be aware of is "reward hacking". AI models in general are aligned to be helpful, which you may have noticed in your own interaction with AI assistants. In reinforcement learning, "reward hacking" refers to when an AI optimizes a reward function to achieve a literal goal that does not actually align with the intended outcome. For example, an AI agent might resolve SIM tickets quickly by closing all of the tickets without responding to them. The agent would technically be satisfying the request, but only because the instructions were worded poorly.

   </div>
</div>



<img src="images/fig148.png"  align="left" height="600px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Catastrophic errors due to overly lenient permissions</div>
  <div class="definition-shadebox">
  <div style="width: 950px;"></div>

- July 2025: Replit's AI coding assistant agent wiped an entire production database “containing records for 1,206 executives and 1,196 companies”, “despite explicit instructions to freeze all code changes”.
- The AI itself rated it as a catastrophic error with a score of 95/100
- New safeguards implemented: database separation between dev and prod, improved backup systems, rollback capabilities, and “chat-only” mode
   </div>
</div>



> Building AI Agents Responsibly - Risk mitigation strategies



<div class="definition-container">
  <div class="definition-title">Risk mitigation strategies</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- This section presents a structured framework for mitigating the risks identified in the previous section. The S.H.I.E.L.D. framework provides a comprehensive set of best practices for securing agentic AI systems.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Risk mitigation framework: S.H.I.E.L.D.</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The following is the risk mitigation framework called SHIELD, from A.W.S Proactive Security. SHIELD stands for Segmentation, Heuristic Monitoring, Integrity Verification, Escalation Control, Logging Immutability, and Decentralized Oversight.
	- Segmentation refers to implementing strict boundaries between agent capabilities, data sources, and execution environments in order to limit the potential impact of compromised components. Later on you will see an example of how to do this appropriately with various MCP servers, data sources, and specific roles and privileges.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Risk mitigation framework: S.H.I.E.L.D. (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The following is the risk mitigation framework called SHIELD, from A.W.S Proactive Security. SHIELD stands for Segmentation, Heuristic Monitoring, Integrity Verification, Escalation Control, Logging Immutability, and Decentralized Oversight.
	- Heuristic Monitoring refers to establishing baseline behavior and setting up monitoring systems to detect anomolies and deviations in agent reasoning patterns, decision processes, behavioral outputs, and resource consumption.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Risk mitigation framework: S.H.I.E.L.D. (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The following is the risk mitigation framework called SHIELD, from A.W.S Proactive Security. SHIELD stands for Segmentation, Heuristic Monitoring, Integrity Verification, Escalation Control, Logging Immutability, and Decentralized Oversight.
	- Integrity Verification refers to implementing cryptographic validation and runtime checks for critical agent components in order to detect unauthorized modifications of tampering.
	- Escalation Control is about establishing permission frameworks with mandatory verification, least privilege, and strict checks on privilege transitions or capability expansions. Identity should be validated for each sensitive operation or tool call, and privileges should be revoked after the session.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Risk mitigation framework: S.H.I.E.L.D. (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The following is the risk mitigation framework called SHIELD, from A.W.S Proactive Security. SHIELD stands for Segmentation, Heuristic Monitoring, Integrity Verification, Escalation Control, Logging Immutability, and Decentralized Oversight.
	- When logging, create tamper-resistant, comprehensive, and verifiable audit trails for all significant agent decisions, actions, data accesses, tool invocations, and inter-agent communications. Utilize write-once, readmany storage, Cryptographic Signing & Timestamping, sanitize log traces of PII, and treat logs at the highest level of security. For example, if logs contain HIPPA data, the logs should be treated as HIPPA data.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Risk mitigation framework: S.H.I.E.L.D. (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- The following is the risk mitigation framework called SHIELD, from A.W.S Proactive Security. SHIELD stands for Segmentation, Heuristic Monitoring, Integrity Verification, Escalation Control, Logging Immutability, and Decentralized Oversight.
	- Finally, aim for Decentralized Oversight. Distribute monitoring, validation, and approval responsibilities across multiple independent systems, specialized agents, or human reviewers to prevent single-point governance failures, bypass, or collusion.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Unsegmented resources = single point of failure</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Here is an example of unsegmented resources that represent a single point of failure and high leakage vulnerability. In this case, the agent accesses both local data and a remote service through one MCP server, which may expose the local data to exfiltration attacks.

   </div>
</div>



<img src="images/fig149.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Segmentation of tools, data sources, actions and permissions</div>
  <div class="definition-shadebox">
  <div style="width: 1150px;"></div>

-  Best practice is to segment different types of resources into different MCP servers. For example, data sources and action groups for service A may be called through the first MCP server, but the remote service and remote tools might be called through another. 
- Always practice least privilege and zero trust security principles.
   </div>
</div>



<img src="images/fig150.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Segmenting roles and access</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- At another level of segmentation, you can also ensure different roles with varying privileges to the same data source. In this example, there is an ADMIN role that can read and write to the data source. There is also a READONLY role that cannot write to the data source.
   </div>
</div>



<img src="images/fig151.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Establish baseline behavior</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Expanding upon the concept of heuristic monitoring, best practice is to establish a baseline of typical reasoning steps, tool usage sequences, API utilization, and resource consumption. 

- Monitor and alert for deviation or anomalies.
   </div>
</div>



<img src="images/fig152.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Provide unambiguous instructions</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Instead of:
	- Check if the user has time off available and book it if possible.
- Best practice: use a clearer prompt
	- Verify the user's available time-off balance using the `checkTimeOffBalance` function. 
	- If the requested time off is available, use the `bookTimeOff` function to reserve it. 
	- If the time off is not available, inform the user and suggest alternative dates. 
	- Always confirm with the user before finalizing any time-off bookings.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Strands responsible tool design </div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- When designing tools with Strands, follow these principles:
	- Least Privilege: Tools should have the minimum permissions needed
	- Input Validation: Thoroughly validate all inputs to tools
	- Clear Documentation: Document tool purpose, limitations, and expected inputs
	- Error Handling: Gracefully handle edge cases and invalid inputs
	- Audit Logging: Log sensitive operations for review
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Fairness and bias mitigation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- AI agents can be susceptible to the same kinds of bias issues as LLMs, but with more hidden steps. The AI agent can reflect stereotypes from the underlying foundation model, but it may be less evident to the user. For example, an AI shopping assistant helping a customer find a gift for their child might automatically select beauty products for teen girls and science kits for teen boys.

- Best practice is to conduct disparate impact assessment, and include opportunities for customer agency and feedback.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Input validation and sanitization use case</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Automated sensitive information redaction during customer conversations

- Best practice: Remove sensitive data from all interactions including agent trace logs
   </div>
</div>

<div class="definition-container">
  <div class="definition-title">Motivation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Evaluation is essential for building reliable agents.

- Lack of thorough evaluation may result in serious consequences, such as:
	- additional operational expenditures,
	- company reputational damage,
	- loss of customer trust, and more.

- Example: chatbot assistant agent that can answer AWS account related billing queries.

Link <a href="./files/paper_13.pdf">Evaluation and Benchmarking of LLM Agents: A Survey</a>

<div class="definition-container">
  <div class="definition-title">AWS chatbot billing and cost assistant</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- A possible prompt the user can send to the AWS billing chatbot assistant is: “Can I get the AWS bill to date for the current month for account ID xyz?
If the forecasted bill at the end of this month is greater than last month’s bill by at least 20%, please send an email notification to my team.”

</div>



<div class="definition-container">
  <div class="definition-title">What can go wrong?</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Assuming security is handled, the user is authenticated and authorized to use the chatbot and the chatbot has access to all the needed tools, there are still many issues that can occur. For example:
	- The billing amount retrieved for the current month is incorrect.
	- The email gets sent even if the delta cost is less than 20%.
	- The delta cost is computed incorrectly.
	- The agent executes the operations in an incorrect sequence.
	-  ...

</div>



<div class="definition-container">
  <div class="definition-title">What can go wrong? (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- These errors can lead to customer’s frustration.

- Thorough evaluation aims at reducing as much as possible the likelihood of errors occurring.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">From software applications to AI agents</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- It shows a parallel between software applications, machine learning models, large language models and AI agents.
- In each case there are atomic skills and capabilities tested, followed by integration testing at task level and then by performance testing with production-level load.
- If these yield satisfactory results, the application can be deployed. Continuous monitoring and alarming will run for deployed application, to detect issues, data drift, measure model performance, etc.

> Evaluating AI Agents - Evaluation and observability




<div class="definition-container">
  <div class="definition-title">Evaluation and observability</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- This section dives deeper into evaluation methodology and observability practices for AI agents. Evaluation and observability are complementary: evaluation tells you *whether* the agent is performing correctly; observability tells you *why* it is or isn't.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Evaluation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Evaluating LLM agents is more complex than evaluating standard LLMs because:
	- they operate in dynamic, interactive environments
	- they can use tools and memory

- Traditional software testing methods aren't sufficient since LLM agents are probabilistic rather than deterministic.

<div class="definition-container">

  <div class="definition-shadebox">

- To evaluate with respect to a given metric, we need to prepare a labelled data set with inputs and expected output and exercise the agent with its data.
- An evaluator is used to compare the responses of the agent with the labels in order to determine how close they are.
- Aggregating all the evaluator’s results across all the instances in the data set provides an overall metric.

<div class="definition-container">
  <div class="definition-title">Evaluators types</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- There are different types of evaluators because there are different evaluation metrics. 

- Structured test cases are suitable for binary outcomes which are either correct or incorrect. For example checking the delta between the forecasted bill at the end of the current month and the previous month’s bill can be evaluated with a structured test case.

- The tool selection evaluator takes a query and checks that the selected tool is the appropriate one to answer the query.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Evaluators types (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- LLM as a judge is helpful to evaluate more abstract properties, such as the relevance of the response with respect to the query.
- Manual evaluation by humans is the most expensive and can be reserved to a subset of cases where LLM as a judge evaluation has a low confidence score as well as for labelling online production data, which are naturally reference-free.
- Other evaluators can be used for measuring relevance in knowledge retrieval, hallucination rate, system-level performance and more.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Observability</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Observability is the ability to understand the internal state of a system by examining
	- its outputs
	- its telemetry data, which includes traces, metrics, and logs.

- To make a system observable, it must be instrumented. That is, the code must emit traces, metrics, or logs. 

- The instrumented data must then be sent to an observability backend.

   </div>
</div>



<img src="images/fig163.png"  align="left" height="500px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">Open Telemetry (OTel)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- OpenTelemetry is a collection of APIs, SDKs, and tools. 
- It’s used to instrument, generate, collect, and export telemetry data (metrics, logs, and traces) to help you analyze your software’s performance and behaviour.
- OpenTelemetry is 100% free and open source, generally available across several languages and is suitable for production use.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Open Telemetry (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- It’s a standard is adopted and supported by industry leaders in the observability space.
- A major goal of OpenTelemetry is to enable easy instrumentation of your applications and systems, regardless of the programming language, infrastructure, and runtime environments used.
- The backend (storage) and the frontend (visualization) of telemetry data are intentionally left to other tools.
   </div>
</div>

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Online evaluation</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

- Once the system is deployed, it’s important to continuously collect telemetry data and running evaluation for monitoring purposes.
- The main challenge for online evaluation consists in having unlabeled data, which can only be evaluated using a reference-free evaluator, such as a human evaluator or LLM as judge. 
- Online data and associated eval labels may be persisted for future use (for example regression testing when new tools are added to the agent).
- Security and privacy constraints shall be taken into account when accessing or persisting online production data.

class PatientProfileManager:
    """In-memory manager for synthetic profiles."""

    def __init__(self, profiles: Optional[Dict[str, PatientProfile]] = None):
        self.profiles = deepcopy(profiles or BASE_PROFILES)

    def get_profile(self, patient_id: str) -> PatientProfile:
        patient_id = patient_id.upper()
        if patient_id not in self.profiles:
            raise KeyError(f"Unknown patient ID: {patient_id}")
        return self.profiles[patient_id]

    def update_profile(self, patient_id: str, field_name: str, new_value: str) -> PatientProfile:
        if field_name not in ALLOWED_UPDATE_FIELDS:
            raise PermissionError(
                f"Field '{field_name}' cannot be changed by this agent. "
                f"Allowed fields: {sorted(ALLOWED_UPDATE_FIELDS)}"
            )
        profile = self.get_profile(patient_id)
        setattr(profile, field_name, new_value.strip())
        return profile


profile_manager = PatientProfileManager()
print(f"Loaded {len(profile_manager.profiles)} synthetic profiles.")
print(json.dumps(asdict(profile_manager.get_profile("PAT1")), indent=2))

TOOL_REGISTRY: Dict[str, Callable[..., Dict[str, Any]]] = {}


def tool(name: str, description: str):
    def decorator(func: Callable[..., Dict[str, Any]]):
        func.tool_name = name
        func.tool_description = description
        TOOL_REGISTRY[name] = func
        return func
    return decorator


def validate_lab_results(results: Dict[str, float]) -> List[str]:
    warnings_found = []
    for test_name, value in results.items():
        if test_name in DEMO_SANITY_BOUNDS:
            low, high = DEMO_SANITY_BOUNDS[test_name]
            if not (low <= float(value) <= high):
                warnings_found.append(
                    f"{test_name}={value} is outside the lab's broad data-entry bound "
                    f"({low} to {high}). Verify the source record and units."
                )
    return warnings_found


@tool("get_patient_profile", "Retrieve a synthetic patient's contact/profile fields.")
def get_patient_profile(patient_id: str) -> Dict[str, Any]:
    profile = profile_manager.get_profile(patient_id)
    data = asdict(profile)
    data.pop("auth_key", None)
    data.pop("lab_results", None)
    return {"ok": True, "patient_id": patient_id.upper(), "profile": data}


@tool("get_patient_lab_results", "Retrieve synthetic lab values and data-entry warnings.")
def get_patient_lab_results(patient_id: str) -> Dict[str, Any]:
    profile = profile_manager.get_profile(patient_id)
    return {
        "ok": True,
        "patient_id": patient_id.upper(),
        "lab_results": deepcopy(profile.lab_results),
        "data_entry_warnings": validate_lab_results(profile.lab_results),
        "notice": "Synthetic educational data; no diagnosis or treatment interpretation.",
    }


@tool("update_patient_profile", "Update an allowed contact/profile field.")
def update_patient_profile(patient_id: str, field_name: str, new_value: str) -> Dict[str, Any]:
    updated = profile_manager.update_profile(patient_id, field_name, new_value)
    return {
        "ok": True,
        "patient_id": patient_id.upper(),
        "updated_field": field_name,
        "new_value": getattr(updated, field_name),
    }


print("Registered tools:")
for name, func in TOOL_REGISTRY.items():
    print(f"- {name}: {func.tool_description}")

- The local guardrail has five layers:
	- PII redaction — masks emails, phone numbers, SSNs, payment-card-like strings, API-key-like strings, and known mock names.

@dataclass
class GuardrailDecision:
    action: Literal["ALLOW", "ANONYMIZE", "BLOCK"]
    blocked: bool
    original_text: str
    sanitized_text: str
    reasons: List[str] = field(default_factory=list)
    detections: Dict[str, List[str]] = field(default_factory=dict)


class LocalGuardrail:
    BLOCK_MESSAGE = (
        "I cannot provide personalized medical advice, diagnosis, dosage, or treatment recommendations. "
        "Please discuss health decisions with a qualified healthcare professional."
    )
    SECURITY_MESSAGE = "I cannot follow instructions that attempt to bypass safety or access controls."

    def __init__(self, known_names: Optional[List[str]] = None):
        self.known_names = sorted(set(known_names or []), key=len, reverse=True)

        self.pii_patterns = {
            "EMAIL": re.compile(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b"),
            "PHONE": re.compile(r"(?<!\w)(?:\+?1[-.\s]?)?(?:\(?\d{3}\)?[-.\s]?)\d{3}[-.\s]?\d{4}(?!\w)"),
            "US_SSN": re.compile(r"\b\d{3}-\d{2}-\d{4}\b"),
            "PAYMENT_CARD": re.compile(r"\b(?:\d[ -]*?){13,19}\b"),
            "API_KEY": re.compile(r"\b(?:AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{16,})\b"),
        }

        self.prompt_attack_patterns = [
            re.compile(p, re.I) for p in [
                r"ignore (?:all |the )?(?:previous|prior|above) instructions",
                r"reveal (?:the )?(?:system|developer) prompt",
                r"disable (?:the )?(?:guardrail|safety|security)",
                r"bypass (?:the )?(?:guardrail|authorization|access control|security)",
                r"you no longer need (?:the )?(?:authentication|authorization|auth key)",
                r"pretend (?:the )?(?:policy|rules|guardrail) (?:does not|doesn't) exist",
            ]
        ]

        # Personalized action requests are blocked; general educational questions remain allowed.
        self.personal_markers = re.compile(r"\b(i|me|my|mine|should i|for me)\b", re.I)
        self.medical_action_patterns = [
            re.compile(p, re.I) for p in [
                r"\bwhat (?:medicine|medication|drug|treatment) should\b",
                r"\bshould i (?:take|stop|start|increase|decrease|change|use|have surgery)\b",
                r"\b(?:adjust|change|increase|decrease) (?:my )?(?:dose|dosage|insulin|medication)\b",
                r"\bdiagnos(?:e|is) me\b",
                r"\bdo i have\b.*\b(?:cancer|disease|disorder|infection|condition)\b",
                r"\bprescribe\b",
                r"\bpersonalized medical advice\b",
            ]
        ]

        self.content_patterns = {
            "HATE": [re.compile(r"\b(?:racial supremacy|exterminate an ethnic group)\b", re.I)],
            "VIOLENCE": [re.compile(r"\b(?:instructions to murder|how to kill someone)\b", re.I)],
            "SEXUAL_EXPLOITATION": [re.compile(r"\bsexual content involving minors\b", re.I)],
        }

    def _detect_pii(self, text: str) -> Dict[str, List[str]]:
        findings: Dict[str, List[str]] = {}
        for entity, pattern in self.pii_patterns.items():
            matches = [m.group(0) for m in pattern.finditer(text)]
            if matches:
                findings[entity] = matches
        for name in self.known_names:
            if re.search(rf"\b{re.escape(name)}\b", text, re.I):
                findings.setdefault("PERSON", []).append(name)
        return findings

    def redact_pii(self, text: str) -> Tuple[str, Dict[str, List[str]]]:
        findings = self._detect_pii(text)
        redacted = text
        for entity, pattern in self.pii_patterns.items():
            redacted = pattern.sub(f"<{entity}>", redacted)
        for name in self.known_names:
            redacted = re.sub(rf"\b{re.escape(name)}\b", "<PERSON>", redacted, flags=re.I)
        return redacted, findings

    def _detect_prompt_attack(self, text: str) -> List[str]:
        return [p.pattern for p in self.prompt_attack_patterns if p.search(text)]

    def _detect_medical_advice(
        self,
        text: str,
        source: Literal["INPUT", "OUTPUT"] = "INPUT",
    ) -> List[str]:
        hits: List[str] = []
        segments = [s.strip() for s in re.split(r"(?<=[.!?])\s+|\n+", text) if s.strip()]

        refusal_pattern = re.compile(
            r"\b(cannot|can't|will not|won't|do not|don't|not able to|must not)\b",
            re.I,
        )
        output_advice_patterns = [
            re.compile(
                r"\byou should\b.{0,80}\b(medication|medicine|dose|dosage|treatment|surgery|prescription)\b",
                re.I,
            ),
            re.compile(
                r"\b(take|stop|start|double|increase|decrease|change|use)\b.{0,35}"
                r"\b(medication|medicine|dose|dosage|pill|tablet|insulin|prescription)\b",
                re.I,
            ),
        ]

        for segment in segments:
            # A refusal sentence such as "I cannot recommend medication" is safe.
            if source == "OUTPUT" and refusal_pattern.search(segment):
                continue

            hits.extend(p.pattern for p in self.medical_action_patterns if p.search(segment))

            if source == "OUTPUT":
                hits.extend(p.pattern for p in output_advice_patterns if p.search(segment))

            # Combination rule for personalized treatment/dosage decisions.
            if self.personal_markers.search(segment) and re.search(
                r"\b(medication|medicine|dose|dosage|treatment|surgery|prescription)\b",
                segment,
                re.I,
            ) and re.search(
                r"\b(what|which|should|recommend|best|lower|raise|change)\b",
                segment,
                re.I,
            ):
                hits.append("personalized medical decision combination")

        return sorted(set(hits))

    def _detect_content(self, text: str) -> Dict[str, List[str]]:
        found = {}
        for category, patterns in self.content_patterns.items():
            hits = [p.pattern for p in patterns if p.search(text)]
            if hits:
                found[category] = hits
        return found

    def evaluate(self, text: str, source: Literal["INPUT", "OUTPUT"] = "INPUT") -> GuardrailDecision:
        detections: Dict[str, List[str]] = {}
        reasons: List[str] = []

        prompt_attacks = self._detect_prompt_attack(text)
        if prompt_attacks:
            detections["PROMPT_ATTACK"] = prompt_attacks
            reasons.append("Attempt to override safety or authorization controls")

        medical_hits = self._detect_medical_advice(text, source=source)
        if medical_hits:
            detections["MEDICAL_ADVICE"] = medical_hits
            reasons.append("Personalized diagnosis/treatment/dosage request")

        content_hits = self._detect_content(text)
        detections.update(content_hits)
        if content_hits:
            reasons.append("Restricted content category")

        redacted, pii_hits = self.redact_pii(text)
        if pii_hits:
            detections["PII"] = [f"{k}: {len(v)}" for k, v in pii_hits.items()]

        if prompt_attacks or medical_hits or content_hits:
            message = self.SECURITY_MESSAGE if prompt_attacks else self.BLOCK_MESSAGE
            return GuardrailDecision(
                action="BLOCK",
                blocked=True,
                original_text=text,
                sanitized_text=message,
                reasons=reasons,
                detections=detections,
            )

        action: Literal["ALLOW", "ANONYMIZE", "BLOCK"] = "ANONYMIZE" if pii_hits else "ALLOW"
        return GuardrailDecision(
            action=action,
            blocked=False,
            original_text=text,
            sanitized_text=redacted,
            reasons=["PII redacted before model access"] if pii_hits else [],
            detections=detections,
        )
