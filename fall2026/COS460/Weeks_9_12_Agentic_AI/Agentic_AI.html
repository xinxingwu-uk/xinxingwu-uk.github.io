class LocalQwenLLM:
    def __init__(self, model_id: str):
        self.model_id = model_id
        self.tokenizer = AutoTokenizer.from_pretrained(model_id)

        dtype = torch.float16 if torch.cuda.is_available() else torch.float32
        load_kwargs = {
            "torch_dtype": dtype,
            "low_cpu_mem_usage": True,
        }
        if torch.cuda.is_available():
            load_kwargs["device_map"] = "auto"

        self.model = AutoModelForCausalLM.from_pretrained(model_id, **load_kwargs)
        if not torch.cuda.is_available():
            self.model.to("cpu")
        self.model.eval()
        self.device = next(self.model.parameters()).device

    @torch.inference_mode()
    def chat(self, system_prompt: str, user_prompt: str, max_new_tokens: int = 180) -> str:
        messages = [
            {"role": "system", "content": system_prompt},
            {"role": "user", "content": user_prompt},
        ]
        rendered = self.tokenizer.apply_chat_template(
            messages,
            tokenize=False,
            add_generation_prompt=True,
        )
        model_inputs = self.tokenizer([rendered], return_tensors="pt").to(self.device)
        generated = self.model.generate(
            **model_inputs,
            max_new_tokens=max_new_tokens,
            do_sample=False,
            repetition_penalty=1.05,
            pad_token_id=self.tokenizer.eos_token_id,
        )
        new_tokens = generated[0][model_inputs.input_ids.shape[1]:]
        return self.tokenizer.decode(new_tokens, skip_special_tokens=True).strip()


class TemplateFallbackLLM:

            "Review any structured tool result shown above, and consult a qualified professional for health decisions."

def extract_patient_id(text: str) -> Optional[str]:
    match = re.search(r"\bPAT\d+\b", text, re.I)
    return match.group(0).upper() if match else None


def route_intent(text: str) -> str:
    lowered = text.lower()
    patient_id = extract_patient_id(text)
    personal_request = bool(re.search(r"\b(my|mine|me)\b", lowered))

    if re.search(r"\b(update|change|edit|replace|set)\b", lowered):
        return "update_profile"

    profile_terms = re.search(r"\b(profile|contact|email|phone|address|name|state|country)\b", lowered)
    lab_terms = re.search(r"\b(lab|levels?|results?|cholesterol|iron|b12|white blood)\b", lowered)

    # General educational questions do not need a patient tool.
    if profile_terms and (patient_id or personal_request):
        return "get_profile"
    if lab_terms and (patient_id or personal_request):
        return "get_labs"
    if patient_id:
        return "get_labs"
    return "general"


def parse_update_request(text: str) -> Optional[Tuple[str, str]]:
    # Explicit patterns keep the trusted update surface narrow.
    patterns = {
        "email": r"\bemail\b\s*(?:to|as|=)\s*([^\s,;]+@[^\s,;]+)",
        "phone": r"\bphone\b\s*(?:to|as|=)\s*([+()\d.\-\s]{7,24})",
        "name": r"\bname\b\s*(?:to|as|=)\s*([A-Za-z][A-Za-z .'-]{1,60})",
        "state": r"\bstate\b\s*(?:to|as|=)\s*([A-Za-z][A-Za-z .'-]{1,40})",
        "country": r"\bcountry\b\s*(?:to|as|=)\s*([A-Za-z][A-Za-z .'-]{1,60})",
        "address": r"\baddress\b\s*(?:to|as|=)\s*(.{4,120})",
    }
    for field_name, pattern in patterns.items():
        match = re.search(pattern, text, re.I)
        if match:
            return field_name, match.group(1).strip().rstrip(".")
    return None

class OpenSourcePatientAgent:
    def __init__(
        self,
        llm: Any,
        guardrail: LocalGuardrail,
        system_prompt: str,
        allowed_patient_id: Optional[str] = None,
        redact_output_pii: bool = True,
        authorizer: Optional[Callable[[str], bool]] = None,
        lab_tool: Optional[Callable[[str], Dict[str, Any]]] = None,
    ):
        self.llm = llm
        self.guardrail = guardrail
        self.system_prompt = system_prompt
        self.allowed_patient_id = allowed_patient_id.upper() if allowed_patient_id else None
        self.redact_output_pii = redact_output_pii
        self.authorizer = authorizer
        self.lab_tool = lab_tool

    def _authorize(self, patient_id: str) -> bool:
        if self.authorizer is not None:
            return bool(self.authorizer(patient_id))
        return self.allowed_patient_id is None or patient_id == self.allowed_patient_id

    def _call_tool(self, intent: str, patient_id: str, original_prompt: str) -> Tuple[str, Dict[str, Any]]:
        if intent == "get_profile":
            return "get_patient_profile", get_patient_profile(patient_id)
        if intent == "get_labs":
            selected_lab_tool = self.lab_tool or get_patient_lab_results
            return "get_patient_lab_results", selected_lab_tool(patient_id)
        if intent == "update_profile":
            parsed = parse_update_request(original_prompt)
            if not parsed:
                return "update_patient_profile", {
                    "ok": False,
                    "error": "Specify one allowed field and value, such as: update PAT1 email to new@example.com"
                }
            field_name, new_value = parsed
            return "update_patient_profile", update_patient_profile(patient_id, field_name, new_value)
        return "", {"ok": True, "message": "No tool was required."}

    def __call__(self, prompt: str, verbose: bool = True) -> AgentResponse:
        audit("user_request", prompt_length=len(prompt))

        input_decision = self.guardrail.evaluate(prompt, source="INPUT")
        audit(
            "input_guardrail",
            action=input_decision.action,
            reasons=input_decision.reasons,
            detections=list(input_decision.detections.keys()),
        )
        if verbose:
            print(f"Input guardrail: {input_decision.action}")

        if input_decision.blocked:
            return AgentResponse(
                text=input_decision.sanitized_text,
                stop_reason="guardrail_intervened",
                input_guardrail=input_decision,
            )

        intent = route_intent(prompt)
        patient_id = extract_patient_id(prompt)
        tool_name = None
        tool_result = None

        if intent in {"get_profile", "get_labs", "update_profile"}:
            if not patient_id:
                return AgentResponse(
                    text="Please provide a synthetic patient ID such as PAT1.",
                    stop_reason="tool_error",
                    input_guardrail=input_decision,
                )

            if not self._authorize(patient_id):
                audit("authorization_denied", requested_patient_id=patient_id)
                return AgentResponse(
                    text="Access denied. Please recheck the patient ID for this session.",
                    stop_reason="authorization_denied",
                    input_guardrail=input_decision,
                )

            try:
                tool_name, tool_result = self._call_tool(intent, patient_id, prompt)
                audit("tool_call", tool_name=tool_name, patient_id=patient_id, ok=tool_result.get("ok"))
            except Exception as exc:
                audit("tool_error", tool_name=tool_name, error=type(exc).__name__)
                return AgentResponse(
                    text=f"The trusted tool could not complete the request: {exc}",
                    stop_reason="tool_error",
                    tool_name=tool_name,
                    input_guardrail=input_decision,
                )

        model_context = {
            "sanitized_user_request": input_decision.sanitized_text,
            "intent": intent,
            "tool_name": tool_name,
            "tool_result": tool_result,
        }
        model_prompt = (
            "Write a concise response using only the JSON context below. "
            "Do not infer a diagnosis or recommend treatment.\n\n"
            + json.dumps(model_context, indent=2)
        )
        raw_text = self.llm.chat(self.system_prompt, model_prompt)

        output_decision = self.guardrail.evaluate(raw_text, source="OUTPUT")
        audit(
            "output_guardrail",
            action=output_decision.action,
            reasons=output_decision.reasons,
            detections=list(output_decision.detections.keys()),
        )

        if output_decision.blocked:
            final_text = self.guardrail.BLOCK_MESSAGE
            stop_reason = "guardrail_intervened"
        else:
            final_text = output_decision.sanitized_text if self.redact_output_pii else raw_text
            stop_reason = "completed"

        if verbose:
            if tool_name:
                print("Tool:", tool_name)
                print("Tool result:", json.dumps(tool_result, indent=2))
            print("Output guardrail:", output_decision.action)

        return AgentResponse(
            text=final_text,
            stop_reason=stop_reason,
            tool_name=tool_name,
            tool_result=tool_result,
            input_guardrail=input_decision,
            output_guardrail=output_decision,
        )

def authorize_session(session: SessionContext, requested_patient_id: str) -> bool:
    requested_patient_id = requested_patient_id.upper()
    if requested_patient_id != session.patient_id:
        return False
    expected = secure_profile_manager.get_profile(requested_patient_id).auth_key
    return secrets.compare_digest(session.auth_key, expected)


def get_patient_lab_results_restricted(
    patient_id: str,
    session: SessionContext = PAT1_SESSION,
) -> Dict[str, Any]:
    patient_id = patient_id.upper()
    if not authorize_session(session, patient_id):
        return {
            "ok": False,
            "error": "Access denied. Recheck the patient ID for this authenticated session.",
        }
    profile = secure_profile_manager.get_profile(patient_id)
    return {
        "ok": True,
        "patient_id": patient_id,
        "lab_results": deepcopy(profile.lab_results),
        "data_entry_warnings": validate_lab_results(profile.lab_results),
    }

<script>
(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
