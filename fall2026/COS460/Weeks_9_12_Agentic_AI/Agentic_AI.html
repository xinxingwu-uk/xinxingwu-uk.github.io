		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

<section data-markdown data-separator="^\n\n\n"><textarea data-template>

> Motivation: Agentic AI Fundamentals



<div class="definition-com-container">
  <div class="definition-com-title">Introduction</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Understanding large language models to building fully autonomous AI agents. 

- The foundational knowledge to understand, evaluate, and build agentic systems

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Areas</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Fundamental concepts behind agentic AI

- How to assess whether your use case is a good fit for agents

- Responsible AI considerations specific to agentic systems

- A survey of the current tools and frameworks landscape

<hr>

- Agentic design thinking: a clear mental model for when and how to build agents

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Questions</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Can an LLM do more than producing text?

- How do you use an LLM for real time information and database queries?

- How can you combine an LLM with other systems and enhance the model’s capabilities?


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">LLMs vs. AI agents</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

- LLMs

	- Very large deep learning models that are pre-trained on vast amounts of data

	- May use retrieval augmented generation (RAG), access tools or APIs
</div>

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">LLMs vs. AI agents</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

- AI agents

	- Can interact with an environment, collect data, and use the data to perform self-determined tasks to meet goals

	- Humans set goals, but an AI agent independently chooses the best actions to achieve those goals

	- Access tools to execute workflows

</div>
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

LLMs are powerful text generators trained on large corpora — they predict the next token based on context. AI agents, on the other hand, go beyond text generation. They perceive their environment, reason about goals, take actions using tools, and adapt based on feedback. The key distinction: LLMs respond; agents act.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Examples: LLMs vs. AI agents</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

<div id="shadebox">

- LLMs: AI chatbot that answers questions, either from a knowledge base or the data it was trained on

</div>


<div id="shadebox">

- AI agents: A customer service AI agent for processing insurance claims or scheduling appointments
</div>


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

A simple chatbot powered by an LLM can answer questions about your insurance claims based on its training data. An AI agent, however, can actually look up your claims, retrieve your current status, identify anomalies, and send you a summary — all autonomously. Same underlying model, very different capability.

   </div>
</div>



> Definition: Agentic AI Fundamentals



<div class="definition-com-container">
  <div class="definition-com-title">Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Imagine asking a standard LLM chatbot: "Why is my AWS bill so high this month?" Without agent capabilities, the LLM can only provide generic guidance — it has no access to your actual account data, no ability to run queries, and no way to take action. It's limited to what it learned during training.

   </div>
</div>



<img src="images/fig1.png"  align="left" height="500px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Example</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Now with an AI agent, the same question triggers a series of actions: the agent authenticates to your AWS account, queries Cost Explorer, identifies the top cost drivers, cross-references usage patterns, and returns a specific, actionable answer — all in one interaction. This is the power of agentic AI.


   </div>
</div>



<img src="images/fig2.png"  align="left" height="500px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Classic AI agent definition</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Agent, noun

- “An intelligent agent is an agent that acts appropriately for its circumstances and its goals, is flexible to changing environments and goals, learns from experience, and makes appropriate choices given its perceptual and computational limitations.”

From Russel & Norvig (1995) - Artificial Intelligence: A Modern Approach, 4th ed., p. 34. 

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Classic AI agent definition</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

The classic definition from Russell and Norvig describes an agent as anything that perceives its environment through sensors and acts upon it through actuators. This foundational definition emphasizes the perception-action loop that is central to all agent architectures, from simple reflex agents to complex learning systems.


   </div>
</div>



> What is an AI agent?



<div class="definition-com-container">
  <div class="definition-com-title">One Current AI Agent definition</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

AI $\cdot$ agent, noun

- “An artificial intelligence (AI) agent is a software program that can interact with its environment, collect data, and use that data to perform self-directed tasks that meet predetermined goals. Humans set goals, but an AI agent independently chooses the best actions it needs to perform to achieve those goals”


From https://aws.amazon.com/what-is/ai-agents/


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">One Current AI Agent definition</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

AWS defines an AI agent as a system that uses an LLM as its reasoning engine to autonomously plan and execute multi-step tasks to achieve a goal, using tools and APIs to interact with external systems. This modern definition adds the critical elements of LLM-based reasoning, tool use, and goal-directed autonomy.

   </div>
</div>



> Features of AI agents



<div class="definition-com-container">
  <div class="definition-com-title">Characters</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

AI agents are $\ldots$

- Advanced AI systems that automatically figure out how to best solve tasks
- Powered by LLMs as their reasoning engines
- Capable of using tools to execute workflows
- Capable of following guidelines/instructions that define overall agent behavior

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Characters</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

AI agents are characterized by four key traits: they are **autonomous** (operate without constant human direction), **goal-oriented** (work toward defined objectives), **tool-using** (interact with APIs, databases, and services), and **adaptive** (adjust behavior based on feedback and results). Together, these traits distinguish agents from simple chatbots.


   </div>
</div>



> What are the key principles that define AI agents?



<img src="images/fig3.png"  align="left" height="500px" width="600px"/>

- From https://aws.amazon.com/what-is/ai-agents/



<div class="definition-com-container">
  <div class="definition-com-title">Key principles</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Autonomy: AI agents act with varying degrees of autonomy, without constant human intervention. While traditional software follows hard coded instructions, AI agents identify the next appropriate action based on past data and execute it without continuous human oversight. 

- Goal Oriented Behavior: AI agents demonstrate goal-oriented behavior, driven by objectives. Their actions aim to maximize success as defined by a utility function or performance metric. The first step to improve this kind of performance is often the system prompt.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key principles (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>


- Perception: AI agents can interact with an environment, which is similar to perception. The agent may have physical sensors, but most often this refers to collecting data from tools or APIs. 

- Rationality: AI agents display some level of rationality, and may be powered by reasoning models that have been specifically trained for reasoning tasks. Taking in various sources of information, an AI agent may be able to make informed decisions. 

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key principles (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Proactivity: AI agents are also proactive, rather than only reacting to inputs. An AI agent may suggest the next course of action based on the current state of the inputs, such as automatically suggesting a tool to solve the user's problem before they ask directly. 

- Continuous Learning: AI agents improve over time by learning from past interactions. They identify patterns, feedback, and outcomes to refine their behavior and decision making. This differentiates them from static programs that always behave the same way regardless of new inputs. 

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key principles (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Adaptability: AI agents may also adjust their strategies in response to new circumstances. This flexibility may allow them to handle uncertainty, novel situations, and incomplete information. 

- Collaboration: Finally, AI agents can collaborate with both humans and other agents. Agents are capable of communicating, coordinating, and cooperating to perform tasks together. Their collaborative behavior often involves negotiation, sharing information, allocating tasks, and adapting to the actions of others. 

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Agentic tasks</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Knowledge-intensive tasks

	- Simple LLM prompting suffers from fact hallucination.

	- AI Agents may mitigate this risk by identifying the data sources, writing queries and retrieving relevant data


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Agentic tasks</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Decision-making tasks

	- LLM planning capabilities are enhanced by custom tools.
	- Selecting appropriate tools to execute tasks

- However, it’s still far from the performance of expert humans.


   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

AI agents excel at two broad categories of tasks: knowledge-intensive tasks (requiring retrieval, synthesis, and reasoning across large information spaces) and decision-making tasks (requiring evaluation of options, trade-offs, and sequential actions). 

> Understanding which category your use case falls into helps you design the right agent architecture.


   </div>
</div>



> What can AI agents do?



<div class="definition-com-container">
  <div class="definition-com-title">Five-Step Process</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Understand the request in natural language text using large language models.
- Generate a plan using Chain-of-Thought and ReAct (Reasoning + Acting) prompting.
- Identify required resources like APIs, data sources, and tools. 
- Execute the plan using API invocation/Knowledge Bases.
- Overcome obstacles by retrying the process.


   </div>
</div>

<div class="definition-com-container">

  <div style="width: 800px;"></div>

- ReAct is a core technique used by most agentic AI frameworks. It allows a language model to interact with external tools or environments to retrieve information or take actions.

- It is implemented as a cyclic process, where the model thinks one step at a time, dynamically creating and adjusting plans based on observations from the external environment.


From ReAct: Synergizing Reasoning and Acting in Language Models
   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">ReAct (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The cycle involves a Prompt, which leads to a Thought, followed by an Action based on that thought. This Action leads to an Observation from the environment, which determines if the goal is achieved or not.

- If the goal is not achieved, the cycle repeats with a new Prompt until the goal is achieved, resulting in a Final Response.

- This cyclic approach of interleaving reasoning and actions allows an LLM to access and operate within an external environment dynamically.

From ReAct: Synergizing Reasoning and Acting in Language Models

</div>

Not every problem needs an agent. Use this decision framework: if the task requires dynamic decision-making, multi-step execution, real-time data, or complex tool orchestration — agents are a strong fit. If the task is simple, deterministic, or can be solved with a prompt or RAG — don't over-engineer it.

<div class="definition-com-container">
  <div class="definition-com-title">Simple, rule-based tasks</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

If a task can be fully defined by a set of deterministic rules — like routing a form based on a field value or calculating a fixed discount — an agent adds unnecessary complexity, latency, and cost. Use a simple function, workflow engine, or rule-based system instead.

  <div class="definition-com-shadebox">

If your use case is primarily about retrieving and presenting information from a knowledge base, Retrieval-Augmented Generation (RAG) combined with good prompt engineering is often sufficient. Agents are overkill when the task doesn't require multi-step reasoning or external actions.

For example: lookup in a knowledge base for answering Frequently Asked Questions, or a categorizing task that only needs a few examples to learn the pattern.

</div>

Agents are inherently nondeterministic — the same input may produce different outputs across runs. If your use case requires exact reproducibility (financial calculations, legal document generation, regulatory reporting), agents may not be appropriate without significant guardrails and human review.

<div class="definition-com-container">
  <div class="definition-com-title">A spectrum of autonomy</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Not all systems are equally autonomous. The spectrum ranges from low-agency systems (human approves every action) to high-agency systems (agent acts fully autonomously). Where you place your agent on this spectrum should be driven by the risk profile of the actions it takes — higher stakes demand lower autonomy and more human oversight.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Risks specific to agentic AI</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Agentic AI may pose unique risks with the ability to call tools, take actions, and execute code

- Multiplier effects - a single bad decision can cascade across many automated actions, 
- False information - hallucinations acted upon can cause real-world harm, and 
- Security vulnerabilities - agents with broad tool access are attractive targets for prompt injection and other attacks. 
- Each risk requires specific mitigation strategies.

A paper: Fully Autonomous AI Agents Should Not be Developed
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Risk assessment guide</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Risk is a combination of Likelihood x Severity of possible harmful event

Use a standard risk matrix — likelihood on one axis, severity on the other — to prioritize which risks to address first. High-likelihood, high-severity risks (like an agent with write access to production databases) demand immediate guardrails. Low-likelihood, low-severity risks can be monitored and addressed iteratively.

   </div>
</div>

<div class="definition-com-container">
  <div class="definition-com-title">Responsible agent AI use</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Follow Responsible AI best practices throughout AI lifecycle. 

- Agentic Design 

	- Fairness · Explainability · Privacy and security · Safety · Controllability · Veracity and robustness · Governance · Transparency

- Agentic Implementation

	- Filtering mechanisms such as guardrails, principle of least privilege, monitoring for behavior drift, tool scanning

   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Agentic Design</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Fairness – Ensure equitable treatment and unbiased outcomes across all users and use cases.
- Explainability – Make agent reasoning and decision-making transparent and understandable to stakeholders.
- Privacy and Security – Protect sensitive data and safeguard system integrity at every layer.
- Safety – Define and enforce boundaries so agents operate within acceptable parameters.

   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Agentic Design (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Controllability – Preserve the human ability to direct, override, or halt agent actions at any time.
- Veracity and Robustness – Ensure agents produce accurate, reliable outputs even under edge cases or adversarial conditions.
- Governance – Establish clear oversight structures, accountability, and policy compliance.
- Transparency – Communicate openly about what agents can and cannot do, and how they make decisions.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Agentic Implementation </div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Translating design principles into practice requires concrete technical safeguards:
- Filtering mechanisms and guardrails – Constrain agent behavior to prevent harmful or out-of-scope actions.
- Principle of least privilege – Grant agents only the minimum permissions needed to complete their tasks.
- Monitoring for behavior drift – Continuously observe agent behavior to detect unintended changes over time.
- Tool scanning – Audit and validate integrated tools to prevent misuse or exploitation
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Fully autonomous agents pose increased risks, particularly to safety. As agent autonomy increases, so does the need for robust safeguards, human oversight, and rigorous testing. Responsible AI is not a one-time checklist — it is an ongoing commitment across the full agent lifecycle.
exploitation.

   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Amazon Bedrock Guardrails</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Amazon Bedrock Guardrails provides a managed layer of safety controls for agentic systems. It can filter harmful content, detect and block prompt injection attacks, enforce topic restrictions, and apply PII redaction. Integrating Bedrock Guardrails is a best practice for any production agentic deployment on AWS.

</div>

<div class="definition-com-container">
  <div class="definition-com-title">Human in the loop (HITL)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Human-in-the-loop is not a binary choice — it's a design decision. Include humans when: the action is irreversible (deleting data, sending communications), the stakes are high (financial transactions, medical decisions), the agent's confidence is low, or regulatory requirements mandate human review. Design HITL checkpoints explicitly into your agent workflows.

   </div>
</div>

<div class="definition-com-container">
  <div class="definition-com-title">Key Security Principles - General Best Practices</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Authenticate every client
	- Use robust authentication mechanisms. Never trust unauthenticated tool calls
- Sandbox tool execution
	- Run tools in isolated containers, validate and sanitize all inputs/outputs
- Least-privilege IAM policies
	- Using AWS accounts, scope roles tightly to what each tool actually needs

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Key Security Principles - General Best Practices (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- Tool orchestration authorization
	- Enforce deterministic call sequences; don't allow arbitrary tool chaining
- Monitor for definition drift
	- Tools can appear safe in metadata but hide malicious code in implementation

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Four security pillars for agentic systems</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Authentication - verify the agent's identity and the identity of systems it calls, 
- Sandboxing - isolate agent execution environments to limit blast radius,
- Identity and Access Management - apply least-privilege policies to all tool access, and
- Monitoring - log and alert on anomalous agent behavior. 

These principles apply regardless of the framework or platform you use.

</div>

> How do you know if your agent is working well? 



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Evaluation is one of the most underinvested areas in agentic AI development. This section gives you a structured framework for measuring agent performance at multiple levels.

<div class="definition-com-container">
  <div class="definition-com-title">Metrics for agentic evaluation</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

Agent evaluation operates at three levels: 

- System-level - overall performance and efficiency, 
- Task-level - how well the agent completes its assigned goals, and 
- Tool-level - how accurately the agent selects and uses individual tools. 
- Each level provides different insights and requires different measurement approaches.

   </div>
</div>



<img src="images/fig29.png"  align="left" height="400px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">System-level metrics</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

Some examples are: 

- Latency per tool call: This metric measures the time it takes for each individual tool or function to execute within the AI system. It helps identify which specific tools or API calls might be causing bottlenecks. Lower latency per tool call generally indicates better performance.

- Task completion time: This is the total time taken to complete an entire task or query, from the moment the input is received to when the final output is delivered. It includes all processing steps, API calls, and tool executions. This metric gives an overall picture of the system's efficiency in handling requests.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">System-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

Some examples are: 

- API Call frequency: This metric tracks how often the system makes calls to external APIs or services. It can help in understanding the system's reliance on external resources and identify potential areas for optimization. High API call frequency might indicate opportunities for caching or batching requests.

- Cost and token usage per task: This metric measures the financial cost and the number of tokens used to complete each task. In the context of LLMs, tokens are the basic units of text that the model processes. This metric is crucial for budget management and optimizing resource utilization. It helps in identifying tasks that are particularly expensive or token-heavy.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">System-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

Some examples are: 

- LLM call error rate: This metric represents the percentage of LLM calls that result in errors or failures. It's a key indicator of the system's reliability and can help identify issues with the LLM integration or API. A low error rate is desirable for maintaining high system availability and user satisfaction.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">System-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

These metrics are particularly important, as they help in:

- Identifying performance bottlenecks
- Optimizing resource usage
- Managing costs
- Improving system reliability
- Enhancing user experience
- By monitoring and analyzing these metrics, developers and system administrators can make data-driven decisions to improve the overall performance and efficiency of AI-powered systems.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Task-level metrics</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

Some examples are: 

- Agent Success Rate:

	- The percentage of tasks that an AI agent successfully completes according to predefined success criteria
	- Typically calculated as: (Number of successful tasks / Total number of attempted tasks) × 100%
	- Helps measure the agent's overall effectiveness and reliability
	- May be broken down by task type to identify areas where the agent excels or struggles

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Task-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- Task Completion Rate:

	- The percentage of tasks that reach a final state (whether successful or not)
	- Calculated as: (Number of completed tasks / Total number of initiated tasks) × 100%
	- Different from success rate as it includes both successful and unsuccessful but completed tasks
	- Helps identify if tasks are being abandoned or timing out
	- Important for understanding system reliability and identifying stuck or hanging processes

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Task-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 900px;"></div>

- Human Intervention Rate:

	- The frequency at which human operators need to step in to assist or correct the agent
	- Calculated as: (Number of tasks requiring human intervention / Total number of tasks) × 100%
	- Key metric for evaluating agent autonomy
	- Can be broken down into categories:
	- Critical interventions (system failures)
	- Guidance interventions (clarifications needed)
	- Verification interventions (human approval required)
	- Correction interventions (fixing errors)

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- These metrics are often used together to provide a comprehensive view of agent performance:
	- High success rate + Low intervention rate = Efficient autonomous system
	- High completion rate + High intervention rate = Functional but dependent system
	- Low completion rate = Potential system reliability issues

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- They're particularly valuable for:
	- Tracking improvement over time
	- Identifying training needs
	- Making decisions about system deployment
	- Calculating operational costs and resource requirements

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Tool-level metrics</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Tool Selection Accuracy:

	- Measures how often the agent selects the appropriate tool for a given task
	- Calculated as: (Correct tool selections / Total tool selections) × 100%
	- Important aspects:
		- Whether the chosen tool aligns with task requirements
		- If the tool selection is optimal (not just functional)
		- Unnecessary tool selections (when simpler solutions exist)
		- Pattern recognition in tool selection errors

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Tool-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Tool Parameter Call Accuracy:

	- Measures how accurately the agent provides parameters when calling tools
	- Focuses on the correctness of arguments and input values
	- Key components:
		- Syntax accuracy
		- Parameter type matching
		- Value range appropriateness
		- Required vs optional parameter handling
		- Parameter ordering accuracy

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Tool-level metrics (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Tool Success Rate:

	- Measures how often tool executions complete successfully
	- Calculated as: (Successful tool executions / Total tool calls) × 100%
	- Includes:
		- Successful completion of tool operation
		- Proper error handling
		- Expected output generation
		- Resource utilization within limits
		- Timeout compliance

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- These metrics together help evaluate:
	- Tool integration effectiveness
	- Agent decision-making quality
	- System reliability
	- Training needs
	- Areas for optimization

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Common patterns to watch for:
	- High tool selection accuracy but low parameter accuracy suggests parameter handling issues
	- Low tool success rate with high selection accuracy might indicate tool reliability issues
	- Consistent patterns in parameter errors can highlight specific training needs
	- Tool selection errors might reveal gaps in the agent's understanding of tool capabilities

   </div>
</div>



> As your agentic systems grow in complexity, you'll need to think about how multiple agents work together. This section covers the two primary orchestration patterns: centralized and decentralized.



<div class="definition-com-container">
  <div class="definition-com-title">Orchestration patterns</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Single Agent Systems
	- standalone agents operating independently

- Multi Agent Systems
	- Centralized orchestrator agent 
	- Decentralized router or peer-based agents

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Orchestration patterns</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- You may have a single agent system, where the agent has access to some tools and knowledge bases, and interacts with a user. However, you may also see multiple agents working together in a system. We call this multi-agent collaboration. We will briefly go over two types of orchestration patterns for these kinds of systems. 

- As there are many other patterns you may employ. The first is centralized, where there is a central orchestrator agent. The second is decentralized, where there may be a router agent or peer agents passing off different parts of a task. Let’s take a look.

   </div>
</div>



<img src="images/fig30.png"  align="left" height="500px" width="800px"/>




<div class="definition-com-container">
  <div class="definition-com-title">Orchestrator agents</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- In this example, the input is a request to post social media content in multiple languages. Perhaps each of these language agents have specific knowledge bases for their customers or specific tools to post in the right places. The orchestrator agent takes in the request and sends the request to the other agents. In this case, the orchestrator passes off the request to the French, Italian, German, Spanish, and Hindi agent. The orchestrator chooses which agents are applicable to the task. The response travels back through to the central orchestrator agent, who provides information back to the user. We will contrast this with a decentralized pattern in a moment.

- The tasks or API calls for each agent is expected to be different. Text based instructions /descriptions of agents are key to the supervisor’s ability to orchestrate correctly


   </div>
</div>




<img src="images/fig31.png"  align="left" height="400px" width="800px"/>




<div class="definition-com-container">
  <div class="definition-com-title">De-centralized agents</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- For a decentralized example, here we have a router agent and three specialized agents. One of the agents is for handling order inquiries. Another is for handling sales. And the third agent is for inquiries about repairs. The user inputs a question, asking “where is my shopping order Order 001?”. The request goes through the router agent, who hands off execution to the appropriate agent. In contrast with the centralized pattern, we see that the response comes directly from the Order Inquiry agent, instead of being processed through a central orchestrator. In this case, the order inquiry agent replies directly to the user with information about the order delivery date.

- Decentralized agents handoff execution to other agents and each agent can respond directly to user requests without an orchestrator agent.

   </div>
</div>



> The Model Context Protocol (MCP) is one of the most important recent developments in agentic AI infrastructure. Let's explore what it is, why it matters, and how it simplifies agent development.



<div class="definition-com-container">
  <div class="definition-com-title">Model Context Protocol (MCP)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- MCP is an open protocol that standardizes how applications provide context to LLMs 
- Think of MCP like a USB-C port for AI applications
- It allows builders creating tools independently, free from compatibility issues when integrating with agentic AI systems

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Why MCP? N x M problem</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>
  
Before MCP, integrating M AI models with N tools required M × N custom integrations — a combinatorial explosion of development work. Each new model needed custom connectors for every tool, and each new tool needed custom adapters for every model. This was unsustainable at scale.

   </div>
</div>



- Before MCP: MxN Integration Problem

<img src="images/fig32.png"  align="left" height="400px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Why MCP? N + M solution</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

MCP solves the N × M problem by introducing a standard protocol layer. Now, each model implements MCP once (N implementations) and each tool implements MCP once (M implementations) — resulting in N + M total integrations instead of N × M. This dramatically reduces development overhead and accelerates the ecosystem.

   </div>
</div>



- Why MCP? N + M solution

<img src="images/fig33.png"  align="left" height="500px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">Model Context Protocol (MCP): why use it?</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- MCP solves three key problems: 
	- Standardization - one protocol for all tool integrations, 
	- Discoverability - agents can dynamically discover available tools at runtime, and 
	- Portability - tools built for one agent framework work with any MCP-compatible agent. 
	- For enterprise builders, MCP means your tool investments are future-proof.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">HTTP vs. MCP</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- We can compare HTTP with MCP as both are protocols. Key similarities:

	- Request/Response Pattern
	- HTTP: Client makes request, server responds
	- MCP: Consumer requests content, provider delivers

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">HTTP vs. MCP (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- Resource Identification
	- HTTP: Uses URLs to identify resources
	- MCP: Uses content references to identify content

- Operation Types
	- HTTP: Defined methods for different operations
	- MCP: Specific operations for content handling

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">HTTP vs. MCP (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- State Management
	- HTTP: Stateless protocol with session management
	- MCP: Stateless content delivery with state tracking

- Error Handling
	- HTTP: Standard response codes (200, 404, etc.)
	- MCP: Status codes for operation results

   </div>
</div>



<img src="images/fig34.png"  align="left" height="400px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">MCP visualized</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

This diagram shows the MCP architecture: MCP Hosts (applications like Claude Desktop or Amazon Quick) contain MCP Clients that communicate with MCP Servers. MCP Servers expose tools, resources, and prompts to clients. Data sources — both local and remote — are accessed through MCP Servers. The protocol standardizes all communication between these layers.

   </div>
</div>



<img src="images/fig35.png"  align="left" height="300px" width="800px"/>



<div class="definition-com-container">
  <div class="definition-com-title">MCP: components</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- MCP Hosts: Programs like Claude Desktop, IDEs, or AI tools that want to access data through MCP
- MCP Clients: Protocol clients that maintain 1:1 connections with servers
- MCP Servers: Lightweight programs that each expose specific capabilities through the standardized Model Context Protocol
- Local Data Sources: Your computer’s files, databases, and services that MCP servers can securely access
- Remote Services: External systems available over the internet (e.g., through APIs) that MCP servers can connect to

   </div>
</div>

> Not everyone building with agentic AI is a software engineer. This section explores how code-free platforms are democratizing agent development and enabling a new generation of builders.



<div class="definition-com-container">
  <div class="definition-com-title">A Note</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- The AI landscape is evolving from a world where AI is something users consume to one where AI is something anyone can build. Code-free platforms are the key enabler of this shift — they lower the barrier to entry so that domain experts, business analysts, and educators can create powerful agentic solutions without writing a single line of code.

- Before 2022, when ChatGPT has become public, non-technical users were largely consumers of AI — they could use AI-powered products but couldn't build them. Creating an AI agent required deep expertise in ML, APIs, and software engineering. This created a significant gap between the people who understood business problems and the people who could build AI solutions.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Summary</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- Use agents when tasks require dynamic decision-making, multi-step execution, or real-time data — not for simple, deterministic workflows.
- Responsible AI is non-negotiable — agentic systems amplify both capabilities and risks, requiring deliberate guardrails, HITL design, and least-privilege access.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Summary (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 1000px;"></div>

- Evaluate at all levels — system, task, and tool metrics each reveal different aspects of agent performance.
- MCP standardizes integration — reducing the N×M problem to N+M and future-proofing your tool investments.
- Code-free platforms democratize agent building — enabling domain experts to create powerful agents without engineering expertise.

   </div>
</div>

<div class="definition-container">

<div class="definition-container">
  <div class="definition-title">Chain-of-thought (CoT) prompting</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Chain-of-thought prompting breaks down complex tasks into smaller, logical steps before generating a final answer. Unlike standard prompting (which jumps directly to a response), CoT guides the model through intermediate reasoning steps. This significantly improves performance on multi-step reasoning tasks. 

   </div>
</div>



<img src="images/fig64.png"  align="left" height="450px" width="700px"/>

  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Compares standard prompting against chain-of-thought for large language models.

- Standard prompting simply asks the model the question directly. In the example shown, the model is asked "How many apples are left?" after being given details about apples used and bought by a cafeteria. However, the model's answer of 26 is incorrect.

   </div>
</div>

Compares standard prompting against chain-of-thought for large language models.

-  Chain-of-thought prompting instead instructs the model to "think step-by-step" and break down its reasoning process. For the same question, the model now walks through the cafeteria starting with 23 apples, using 20, buying 6 more, resulting in the correct final answer of 9 apples left.

   </div>
</div>



> Chain-of-thought prompting, by encouraging models to show their step-by-step working, can improve their reasoning abilities and help arrive at the right solution compared to standard prompting alone.



<div class="definition-container">
  <div class="definition-title">Plan-and-execute</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

The "Plan-and-execute" strategy, which involves two phases:

- Planning phase:
	- Analyze task objectives
	- Decompose the task into subtasks
	- Build an execution plan

- Execution phase:
	- Execute the planned subtasks in sequence
	- Process the outputs from each subtask

   </div>
</div>



<img src="images/fig66.png"  align="left" height="250px" width="800px"/>

The diagram illustrates this process, with a planning component generating a plan, followed by an execution component acting on that plan to impact the environment.

However, the slide notes that using this approach, the "Goal Not Achieved" indicates that this traditional plan-and-execute strategy may fall short in certain situations, potentially motivating the need for alternative approaches.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">ReAct</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

ReAct is an approach that interleaves reasoning traces and task-specific actions. The key points are:
- ReAct is a core technique used by most agentic AI frameworks. It allows a language model to interact with external tools or environments to retrieve information or take actions.
- It is implemented as a cyclic process, where the model thinks one step at a time, dynamically creating and adjusting plans based on observations from the external environment.

   </div>
</div>




<div class="definition-container">
  <div class="definition-title">ReAct (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

ReAct is an approach that interleaves reasoning traces and task-specific actions. The key points are:
- The cycle involves a Prompt, which leads to a Thought, followed by an Action based on that thought. This Action leads to an Observation from the environment, which determines if the goal is achieved or not.
- If the goal is not achieved, the cycle repeats with a new Prompt until the goal is achieved, resulting in a Final Response.
- This cyclic approach of interleaving reasoning and actions allows an LLM to access and operate within an external environment dynamically.
   </div>
</div>



<img src="images/fig67.png"  align="left" height="550px" width="600px"/>



<div class="definition-container">
  <div class="definition-title">ReAct: Reason + Act</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

ReAct (Reason + Act) concept combines reasoning and action planning capabilities of large language models (LLMs). The key points are:

- LLMs are capable of reasoning and generating action plans.
- Reasoning involves creating, tracking, and updating action plans as well as handling errors.
- Acting involves interfacing with functions, tools, knowledge bases, or environments to execute the plans.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">ReAct: Reason + Act (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

ReAct (Reason + Act) concept combines reasoning and action planning capabilities of large language models (LLMs). The key points are:

- The diagram illustrates the workflow where the Reasoning component generates action plans, the LLM component takes actions based on those plans and observations from the Environment, and the Environment provides feedback for further reasoning.
- This combination of reasoning and acting enables LLMs to tackle more complex tasks by breaking them down into planned steps and interacting with external resources.
   </div>
</div>



<img src="images/fig68.png"  align="left" height="250px" width="800px"/>



<div class="definition-container">
  <div class="definition-title">ReAct vs Plan-and-execute</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Two approaches for language model execution: ReAct and Plan-and-execute. Key points about ReAct:
- It dynamically alternates between thinking (planning) and acting (generating output)
- It updates plans more frequently based on the outputs generated
- It is typically faster in generating the final answer
- It consumes/generates fewer tokens
- It is suited for medium difficulty tasks
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">ReAct vs Plan-and-execute (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Key points about Plan-and-execute:
- It plans the entire output first before executing (generating)
- It updates plans only after the entire plan is executed
- It is typically slower in generating the final answer
- It consumes/generates more tokens
- It is suited for higher difficulty tasks

   </div>
</div>



> The key differences in how these two approaches interleave planning and execution, as well as their relative strengths in terms of speed, token efficiency, and suitability for different task difficulties.

<div class="definition-container">
  <div class="definition-title">Reflection</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

An approach for enabling large language models (LLMs) to reflect on and critique their own past actions or outputs. The key points are:

- It involves two separate LLMs: a Generator LLM that produces responses or executes tasks, and a Reflector LLM that analyzes and critiques the Generator's actions.
- The Reflector LLM provides reflections on the merits, potential risks, and critiques of the Generator's actions or outputs.

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Reflection (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

An approach for enabling large language models (LLMs) to reflect on and critique their own past actions or outputs. The key points are:

- This reflection and critique from the Reflector LLM is then fed back into the process, potentially influencing the subsequent actions of the Generator LLM.
- The goal is to prompt more thoughtful, self-critical behavior from LLMs by having a separate component dedicated to reflecting on and assessing their actions before proceeding further.

   </div>
</div>



> The overall process aims to imbue LLMs with an ability to self-reflect, identify potential issues or shortcomings, and then adjust or improve their subsequent actions based on that reflective analysis.

<div class="definition-container">

Language agent tree search (<a href="./files/paper_5.pdf">Language Agent Tree Search Unifies Reasoning, Acting, and Planning in Language Models</a>):

<div class="definition-container">
  <div class="definition-title">Other specialized reflection techniques (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Two advanced reflection techniques aimed at enhancing AI systems' capabilities. Reflexion leverages external information to provide constructive critiques and identify gaps. Language agent tree search integrates reflection, evaluation, and search within a reinforcement learning framework to improve performance on complex tasks while avoiding repetitive loops.

</div>

<div class="definition-container">
  <div class="definition-title">What are reasoning models?</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

The concept of reasoning models, which aim to train AI models to think critically and generate thoughtful responses, rather than simply answering immediately. The key points are:
- Traditional language models are forced to answer immediately without any reasoning process.
- Complex problems like arithmetic and reasoning require more "thought" or deliberation before providing a response.
   </div>
</div>



<div class="definition-container">
  <div class="definition-title">What are reasoning models? (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

The concept of reasoning models, which aim to train AI models to think critically and generate thoughtful responses, rather than simply answering immediately. The key points are:
- The goal is to train models to think critically before generating responses by having them generate intermediate reasoning/thought tokens.
- This allows the models to engage in a reasoning process and arrive at more thoughtful answers, rather than just providing an immediate response.
   </div>
</div>



> Notice the limitation of traditional models, it proposes reasoning models as a solution to tackle complex problems that require more deliberation and reasoning ability from AI systems



<div class="definition-container">
  <div class="definition-title">Chat models vs reasoning models</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

> Comparing chat models and reasoning models.

Chat Models:
- Fast and intuitive responses
- Provide a basic chain-of-thought when prompted
- Lower benchmark performance on tasks like math, coding, etc..
- Faster and cheaper to generate responses

   </div>
</div>



<div class="definition-container">
  <div class="definition-title">Chat models vs reasoning models (Cont.)</div>
  <div class="definition-shadebox">
  <div style="width: 800px;"></div>

Reasoning Models:
- Slower but more effortful responses
- Generate high quality chains-of-thought by default
- Higher benchmark performance on reasoning tasks
- Slower and more expensive to run and generate responses
   </div>
</div>



> The key tradeoffs between chat models optimized for conversational ability versus models focused on complex reasoning tasks that require multi-step logical thinking. Chat models prioritize speed and low cost, while reasoning models aim for higher quality logical outputs at the expense of latency and computational cost.

<div class="definition-container">

A reasoning model composed of three turns or steps. In each turn, there is an input that goes through a reasoning process to produce an output. The output from the previous turn serves as the input for the next turn's reasoning process. This iterative process continues until the final output is generated, which is then labeled as the "Response." This model illustrates how reasoning can be broken down into multiple steps, with each step taking the output from the previous step as input and performing additional reasoning to refine and advance toward the final response.

<div class="definition-container">
  <div class="definition-title">Why do reasoning models perform so well?</div>
  <div class="definition-shadebox">

The key reasons stated for why reasoning models perform so well are:

- The use of reasoning tokens allows creating rich context and analysis.

<div class="definition-container">

The key reasons stated for why reasoning models perform so well are:

- The number of turns or iterations is variable, decided by the model or set manually.
- They often employ reinforcement learning strategies, which recognize and correct mistakes, improve critical reasoning skills, and use a reward over label approach to enable critical problem-solving.

   </div>

> Here, we highlight capabilities like human-like problem solving, contextual reasoning through tokens, flexible iterative processes, and reinforcement learning techniques as factors contributing to strong performance in these AI systems.

	- Models need to explore different strategies and prioritize promising ones
	- Enables critical 	problem solving

@torch.inference_mode()
def generate_chat(
    messages: list[dict[str, str]],
    *,
    max_new_tokens: int = 500,
) -> str:
    """Generate one assistant message from a list of chat messages."""
    prompt = tokenizer.apply_chat_template(
        messages,
        tokenize=False,
        add_generation_prompt=True,
    )
    encoded = tokenizer(
        prompt,
        return_tensors="pt",
        truncation=True,
        max_length=MAX_INPUT_TOKENS,
    )
    encoded = {name: tensor.to(model.device) for name, tensor in encoded.items()}

    generated = model.generate(
        **encoded,
        max_new_tokens=max_new_tokens,
        do_sample=False,
        pad_token_id=tokenizer.eos_token_id,
    )
    new_tokens = generated[0, encoded["input_ids"].shape[1]:]
    return tokenizer.decode(new_tokens, skip_special_tokens=True).strip()


test_response = generate_chat(
    [{"role": "user", "content": "Reply with exactly: Model ready."}],
    max_new_tokens=20,
)
print(test_response)

WEATHER_CODES = {
    0: "Clear sky",
    1: "Mainly clear",
    2: "Partly cloudy",
    3: "Overcast",
    45: "Fog",
    48: "Depositing rime fog",

def get_current_date() -> dict[str, Any]:
    """Return the current local date, time, weekday, and timezone."""
    now = datetime.now().astimezone()
    return {
        "date": now.date().isoformat(),
        "time": now.strftime("%H:%M:%S"),
        "weekday": now.strftime("%A"),
        "timezone": str(now.tzinfo),
    }


def geocode_city(city: str) -> dict[str, Any]:
    """Find coordinates for a city or named place."""
    city = str(city).strip()
    if len(city) < 2:
        return {"error": "Please provide a more specific location name."}

    endpoint = "https://geocoding-api.open-meteo.com/v1/search"
    params = {"name": city, "count": 1, "language": "en", "format": "json"}

    try:
        response = requests.get(endpoint, params=params, timeout=20)
        response.raise_for_status()
        results = response.json().get("results", [])
        if not results:
            return {"error": f"No location found for '{city}'."}

        match = results[0]
        return {
            "query": city,
            "name": match.get("name"),
            "admin1": match.get("admin1"),
            "country": match.get("country"),
            "latitude": match.get("latitude"),
            "longitude": match.get("longitude"),
            "timezone": match.get("timezone"),
        }
    except requests.RequestException as exc:
        return {"error": "Geocoding request failed.", "detail": str(exc)}


def get_weather(latitude: float, longitude: float) -> dict[str, Any]:
    """Get current weather and a two-day forecast for exact coordinates."""
    try:
        latitude = float(latitude)
        longitude = float(longitude)
    except (TypeError, ValueError) as exc:
        return {"error": "Invalid weather arguments.", "detail": str(exc)}

    if not (-90 <= latitude <= 90 and -180 <= longitude <= 180):
        return {"error": "Coordinates are outside valid latitude/longitude ranges."}

    endpoint = "https://api.open-meteo.com/v1/forecast"
    params = {
        "latitude": latitude,
        "longitude": longitude,
        "current": (
            "temperature_2m,apparent_temperature,precipitation,"
            "weather_code,wind_speed_10m"
        ),
        "daily": (
            "weather_code,temperature_2m_max,temperature_2m_min,"
            "precipitation_probability_max"
        ),
        "timezone": "auto",
        "forecast_days": 2,
    }

    try:
        response = requests.get(endpoint, params=params, timeout=20)
        response.raise_for_status()
        data = response.json()

        current = dict(data.get("current", {}))
        current_code = current.get("weather_code")
        current["condition"] = WEATHER_CODES.get(current_code, f"Code {current_code}")

        daily = data.get("daily", {})
        dates = daily.get("time", [])
        codes = daily.get("weather_code", [])
        highs = daily.get("temperature_2m_max", [])
        lows = daily.get("temperature_2m_min", [])
        rain_probs = daily.get("precipitation_probability_max", [])

        forecasts = []
        for index, date_value in enumerate(dates):
            code_value = codes[index] if index < len(codes) else None
            forecasts.append(
                {
                    "date": date_value,
                    "condition": WEATHER_CODES.get(code_value, f"Code {code_value}"),
                    "high_c": highs[index] if index < len(highs) else None,
                    "low_c": lows[index] if index < len(lows) else None,
                    "max_precipitation_probability_percent": (
                        rain_probs[index] if index < len(rain_probs) else None
                    ),
                }
            )

        return {
            "latitude": latitude,
            "longitude": longitude,
            "timezone": data.get("timezone"),
            "current": current,
            "forecast": forecasts,
        }
    except requests.RequestException as exc:
        return {"error": "Weather request failed.", "detail": str(exc)}


TOOLS: list[Callable[..., dict[str, Any]]] = [
    get_current_date,
    geocode_city,
    get_weather,
]

""".strip()

print(" Shared tools created:", ", ".join(TOOL_REGISTRY))

- For a tool action, the model must return:

```json
{"action":"tool","tool":"geocode_city","arguments":{"city":"Paris, France"}}
```

- For a final answer, it must return:

```json
{"action":"final","answer":"..."}
```

- The model is never asked to output private reasoning. It outputs only the next observable action or final answer.

def extract_first_json_object(text: str) -> dict[str, Any]:
    """Extract and parse the first valid JSON object contained in text."""
    decoder = json.JSONDecoder()
    for match in re.finditer(r"\{", text):
        try:
            value, _ = decoder.raw_decode(text[match.start():])
        except json.JSONDecodeError:
            continue
        if isinstance(value, dict):
            return value
    raise ValueError(f"No valid JSON object found in model output: {text[:500]}")


def normalize_action(value: dict[str, Any]) -> dict[str, Any]:
    action = value.get("action")
    if action == "final":
        answer = str(value.get("answer", "")).strip()
        if not answer:
            raise ValueError("A final action must include a nonempty answer.")
        return {"action": "final", "answer": answer}

    if action == "tool":
        tool_name = str(value.get("tool", "")).strip()
        arguments = value.get("arguments", {})
        if not tool_name:
            raise ValueError("A tool action must include a tool name.")
        if not isinstance(arguments, dict):
            raise ValueError("Tool arguments must be a JSON object.")
        return {"action": "tool", "tool": tool_name, "arguments": arguments}

    raise ValueError("Action must be either 'tool' or 'final'.")


def request_json_action(
    system_prompt: str,
    user_prompt: str,
    *,
    max_new_tokens: int = 260,
) -> tuple[dict[str, Any], str, int]:
    """Ask for a structured action, retrying once if formatting is invalid."""
    messages = [
        {"role": "system", "content": system_prompt},
        {"role": "user", "content": user_prompt},
    ]

    raw = generate_chat(messages, max_new_tokens=max_new_tokens)
    try:
        return normalize_action(extract_first_json_object(raw)), raw, 1
    except (ValueError, json.JSONDecodeError):
        repair_messages = messages + [
            {"role": "assistant", "content": raw},
            {
                "role": "user",
                "content": (
                    "Your previous response was not valid for the required protocol. "
                    "Return exactly one valid JSON object with no markdown, commentary, "
                    "or reasoning. Use either "
                    '{"action":"tool","tool":"name","arguments":{}} or '
                    '{"action":"final","answer":"text"}.'
                ),
            },
        ]
        repaired = generate_chat(repair_messages, max_new_tokens=max_new_tokens)
        return normalize_action(extract_first_json_object(repaired)), repaired, 2


def execute_tool(tool_name: str, arguments: dict[str, Any]) -> dict[str, Any]:
    """Validate and execute one registered read-only tool."""
    function = TOOL_REGISTRY.get(tool_name)
    if function is None:
        return {"error": f"Unknown tool: {tool_name}"}

    try:
        signature = inspect.signature(function)
        signature.bind(**arguments)
    except TypeError as exc:
        return {"error": f"Invalid arguments for {tool_name}.", "detail": str(exc)}

    try:
        return function(**arguments)
    except Exception as exc:
        return {
            "error": f"{type(exc).__name__} while running {tool_name}",
            "detail": str(exc),
        }

print(" JSON action protocol ready.")

- Step 6 - System B — Single-shot tool-calling workflow

The developer controls the sequence:

	- The model may select **one** tool.
	- Python executes that tool.
	- The model receives the result and must give a final answer.
	- No second tool-selection round is allowed.

This workflow is predictable and bounded, but it cannot finish tasks that naturally require dependent actions such as **city → coordinates → weather**.

SINGLE_SHOT_SELECTOR_PROMPT = f"""
You select the next action for a SINGLE-SHOT tool workflow.

{TOOL_CATALOG}

Rules:
- Return exactly one JSON object and nothing else.
- Do not include reasoning, markdown, or extra fields.
- Choose at most one tool.
- Use get_current_date for a current date question.
- Use geocode_city for a place-name lookup.
- get_weather may be selected only when exact latitude and longitude are already
  explicitly available in the user query. Never guess coordinates.
- For weather requested by city name, select geocode_city first. The workflow
  will not permit a second tool round, so the later final response must explain
  that limitation.
- If no tool is needed, return a final answer.

Allowed forms:
{{"action":"tool","tool":"get_current_date","arguments":{{}}}}
{{"action":"tool","tool":"geocode_city","arguments":{{"city":"Paris, France"}}}}
{{"action":"tool","tool":"get_weather","arguments":{{"latitude":48.8566,"longitude":2.3522}}}}
{{"action":"final","answer":"your answer"}}
""".strip()


class SingleShotToolWorkflow:
    def __init__(self):
        self.trace: list[dict[str, Any]] = []
        self.model_calls = 0

    def process_query(self, query: str) -> str:
        self.trace = []
        self.model_calls = 0

        action, raw, calls = request_json_action(
            SINGLE_SHOT_SELECTOR_PROMPT,
            f"User query: {query}",
        )
        self.model_calls += calls

        if action["action"] == "final":
            return action["answer"]

        result = execute_tool(action["tool"], action["arguments"])
        self.trace.append(
            {
                "tool": action["tool"],
                "arguments": action["arguments"],
                "result": result,
            }
        )

        final_prompt = f"""
You are writing the final response for a SINGLE-SHOT workflow. No additional
 tools can be called now.

Original user query:
{query}

The one selected tool action:
{json.dumps(action, ensure_ascii=False)}

Tool result:
{json.dumps(result, ensure_ascii=False)}

Write a concise, accurate answer. Use only the evidence supplied above for live
facts. If another dependent tool call would be required, clearly say what is
still missing and why this bounded workflow cannot complete it. Do not invent
coordinates, weather, dates, or tool results.
""".strip()

        self.model_calls += 1
        return generate_chat(
            [
                {
                    "role": "system",
                    "content": "Write the final user-facing answer without exposing private reasoning.",
                },
                {"role": "user", "content": final_prompt},
            ],
            max_new_tokens=450,
        )

- Step 7 - System C — Bounded multi-step agent

The agent adds a controlled loop:

	- The model selects a tool or returns a final answer.
	- Python executes the selected tool.
	- The result becomes an observation.
	- The model sees the observations and chooses the next action.
	- The loop stops at a final answer or a maximum step count.

The code records only observable actions and results. A step limit, duplicate-call guard, argument validation, and read-only tools make the exercise safer and easier to debug.


   </div>
</div>

AGENT_ACTION_PROMPT = f"""
You select the next observable action for a bounded open-source agent.

{TOOL_CATALOG}

Rules:
- Return exactly one JSON object and nothing else.
- Do not include chain-of-thought, reasoning, markdown, or extra fields.
- Use tools whenever current or external information is required.
- For weather by place name: call geocode_city, inspect its coordinates, then
  call get_weather with those exact values.
- For today, tomorrow, or weekday-dependent requests, call get_current_date when
  needed to interpret the returned dated forecast.
- Never guess tool results or coordinates.
- Do not repeat an identical successful tool call.
- When enough evidence is available, return a concise final answer.

Allowed forms:
{{"action":"tool","tool":"tool_name","arguments":{{}}}}
{{"action":"final","answer":"your evidence-grounded answer"}}
""".strip()


class OpenSourceAgent:
    def __init__(self, max_steps: int = 6):
        self.max_steps = max_steps
        self.trace: list[dict[str, Any]] = []
        self.model_calls = 0

    def process_query(self, query: str) -> str:
        self.trace = []
        self.model_calls = 0
        seen_calls: set[str] = set()

        for step in range(1, self.max_steps + 1):
            observations = [
                {
                    "step": item["step"],
                    "tool": item["tool"],
                    "arguments": item["arguments"],
                    "result": item["result"],
                }
                for item in self.trace
            ]

            action, raw, calls = request_json_action(
                AGENT_ACTION_PROMPT,
                (
                    f"Original user query:\n{query}\n\n"
                    f"Observable tool history:\n"
                    f"{json.dumps(observations, ensure_ascii=False, indent=2)}\n\n"
                    "Select the next action."
                ),
            )
            self.model_calls += calls

            if action["action"] == "final":
                return action["answer"]

            signature = json.dumps(
                {"tool": action["tool"], "arguments": action["arguments"]},
                sort_keys=True,
            )
            if signature in seen_calls:
                result = {
                    "error": "Duplicate tool call blocked.",
                    "instruction": "Use existing observations or choose a different action.",
                }
            else:
                seen_calls.add(signature)
                result = execute_tool(action["tool"], action["arguments"])

            self.trace.append(
                {
                    "step": step,
                    "tool": action["tool"],
                    "arguments": action["arguments"],
                    "result": result,
                }
            )

        return (
            "The agent reached its maximum number of steps before producing a "
            "final answer. Review the observable trace and prompts."
        )


agent = OpenSourceAgent(max_steps=6)
print(" Bounded multi-step agent created.")

def compact_trace(trace: list[dict[str, Any]]) -> str:
    if not trace:
        return "No tools"
    lines = []
    for item in trace:
        prefix = f"Step {item['step']}: " if "step" in item else ""
        lines.append(
            f"{prefix}{item['tool']}({json.dumps(item['arguments'], ensure_ascii=False)})"
        )
    return "\n".join(lines)


def compare_all_systems(query: str) -> pd.DataFrame:
    systems = [
        ("Plain LLM", plain_llm),
        ("Single-shot tool workflow", tool_workflow),
        ("Bounded multi-step agent", agent),
    ]

    rows = []
    for system_name, system in systems:
        started = time.perf_counter()
        try:
            answer = system.process_query(query)
            status = "Completed"
        except Exception as exc:
            answer = f"{type(exc).__name__}: {exc}"
            status = "Error"
        elapsed = time.perf_counter() - started

        rows.append(
            {
                "System": system_name,
                "Status": status,
                "Model calls": system.model_calls,
                "Tool calls": len(system.trace),
                "Seconds": round(elapsed, 2),
                "Tool trace": compact_trace(system.trace),
                "Answer": answer,
            }
        )

    frame = pd.DataFrame(rows)
    with pd.option_context("display.max_colwidth", 220):
        display(frame)
    return frame
