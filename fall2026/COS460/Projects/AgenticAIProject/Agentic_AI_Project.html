		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}

<div class="definition-com-container">
  <div class="definition-com-title">Overview</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- In this project, you will investigate a real, manageable problem in a clearly defined domain and design, configure, adapt, or evaluate an agentic AI system that addresses that problem. Your work must go beyond demonstrating a chatbot. You must provide evidence that the system can pursue a goal, use information or tools, respond to observations, operate within defined boundaries, and be evaluated systematically.

   </div>
</div>



<div class="definition-com-container">
  <div class="definition-com-title">Overview (Cont.) - Central research question</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- The central question is not simply “Can the AI produce a good answer?” The central question is:

   <div id="shadebox">
   Does an agentic design provide measurable value over a simpler non-agent approach for this problem, and what reliability, safety, cost, latency, and human-oversight tradeoffs does it introduce?
   </div>

- Note: A strong paper may conclude that the agent is useful, only useful under limited conditions, or unnecessary for the selected problem. A well-supported negative conclusion can earn full credit.
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Learning Outcomes</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Explain the difference among a base LLM, a prompt-only assistant, a RAG assistant, and an agentic AI system.
- Justify when agentic AI is appropriate and when a rule-based, prompt-only, or RAG-only solution is sufficient.
- Design a goal-oriented workflow with planning, information retrieval, tool use, feedback, adaptation, and human oversight as appropriate.
- Build or configure a specialized agent using a code-free, local, or code-first platform.
   </div>
</div>




<div class="definition-com-container">
  <div class="definition-com-title">Learning Outcomes (Cont.)</div>
  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Create a safe knowledge base or dataset and document its origin, scope, licensing, and limitations.
- Design reproducible experiments, define success criteria, collect evidence, and analyze failures.
- Evaluate system-level, task-level, tool-level, and responsible-AI metrics.
- Communicate results using a formal research-paper structure, tables, figures, citations, limitations, and conclusions.
   </div>
</div>

<div class="definition-com-container">
  <div class="definition-com-title">Required Agentic Features (Cont.)</div>
  <div class="definition-com-shadebox">

<table style="font-size: 17px;">
  <thead>
    <tr>
      <th>Feature</th>
      <th>What It Means</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Goal and Success Criteria</strong></td>
      <td>
        A clearly defined objective and measurable completion condition.
      </td>
    </tr>
    <tr>
      <td><strong>Planning or Decomposition</strong></td>
      <td>
        The system breaks a request into steps or selects a workflow.
      </td>
    </tr>
    <tr>
      <td><strong>Knowledge Retrieval</strong></td>
      <td>
        The agent queries a local or approved knowledge base and distinguishes
        retrieved evidence from general knowledge.
      </td>
    </tr>
    <tr>
      <td><strong>Tool Use</strong></td>
      <td>
        The agent selects and invokes a calculator, database, code executor,
        file search, classifier, URL checker, calendar simulator, or another
        safe tool.
      </td>
    </tr>
    <tr>
      <td><strong>Observation-Feedback Loop</strong></td>
      <td>
        The system uses tool results or environmental feedback before deciding
        the next action.
      </td>
    </tr>
    <tr>
      <td><strong>Adaptation, Retry, or Clarification</strong></td>
      <td>
        The agent changes its plan, retries safely, or asks a clarifying
        question when needed.
      </td>
    </tr>
    <tr>
      <td><strong>Memory or State</strong></td>
      <td>
        The system maintains task state, prior decisions, or bounded episodic
        memory.
      </td>
    </tr>
    <tr>
      <td><strong>Human-in-the-Loop</strong></td>
      <td>
        The agent pauses for approval before a risky, irreversible, or
        uncertain action.
      </td>
    </tr>
    <tr>
      <td><strong>Multi-Agent Orchestration</strong></td>
      <td>
        A router, supervisor, or peer agent delegates work to specialized
        agents.
      </td>
    </tr>
    <tr>
      <td><strong>Guardrails and Least Privilege</strong></td>
      <td>
        The agent refuses out-of-scope actions and receives only the
        permissions required for the task.
      </td>
    </tr>
  </tbody>
</table>

- Before implementation, compare your proposed agent with three simpler alternatives:
	- A deterministic rule-based workflow.
	- A one-shot or few-shot LLM prompt.
	- A RAG-only question-answering system without planning or actions.
- Explain why the agentic approach is expected to add value. If your experiments later show that the simpler system is better, discuss that result honestly.
   </div>

- Research questions and hypotheses

- State two to four research questions. At least one question must compare the agentic system with a simpler baseline. Example: “Does adding retrieval, tool use, and a clarification step improve task success and grounded accuracy compared with a prompt-only LLM?”

</div>

  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Systems to compare
	- Baseline 1 — Prompt-only LLM: the same or a comparable base model receives a direct prompt without agent tools or a knowledge base.
	- Baseline 2 — Optional but encouraged: RAG-only or rule-based system.
	- Proposed system — the initial agentic implementation.
	- Revised system — the agent after one evidence-based modification. The modification must be motivated by observed failures.
   </div>
</div>



<div class="definition-com-container">

  <div class="definition-com-shadebox">
  <div style="width: 800px;"></div>

- Evaluation set: Create a documented evaluation set of at least 30 distinct scenarios. Forty to sixty scenarios are recommended. Include at least five categories:
	- Normal in-scope requests.
	- Ambiguous or incomplete requests that may require clarification.
	- Questions whose answers are present in the knowledge base.
	- Questions whose answers are missing from the knowledge base and should trigger uncertainty or abstention.
	- Adversarial, unsafe, privacy-sensitive, or out-of-scope requests.
	- Tool-error or unavailable-resource cases, when tools are used.
   </div>
</div>



<div class="definition-com-container">

</div>

<div style="font-size: 22px;">
Sample abstract - Phishing remains a practical cybersecurity challenge because users must interpret ambiguous language, sender context, links, urgency cues, and institutional policies. This project designed PhishShield, a low-autonomy agentic AI system that combines a language model, retrieval from a curated cybersecurity knowledge base, a deterministic URL/domain checker, a clarification step, and human-in-the-loop safety boundaries. The study compared a prompt-only baseline, an initial agent, and a revised agent across 60 synthetic evaluation cases spanning benign messages, obvious phishing, ambiguous requests, missing information, and adversarial prompts. Each case was evaluated for task success, grounded accuracy, safety compliance, abstention, latency, and failure type. Illustrative results showed that the revised agent achieved 92.2% task success compared with 70.0% for the baseline, while grounded accuracy increased from 61.7% to 95.0%. The agent required more time per task, but substantially reduced hallucination and unsafe advice. These results suggest that an agentic design can improve evidence use and safety for phishing education when autonomy is limited and human judgment remains central. The numerical results are synthetic and demonstrate the expected analysis format rather than validated empirical findings.
</div>

<div style="font-size: 22px;">
Introduction and motivation - A phishing-awareness assistant is a suitable agentic-AI problem because the workflow is not fully deterministic. A user may provide a complete email, only a subject line, a screenshot description, or a vague statement such as “Is this safe?” The system must determine what information is available, decide whether retrieval or a tool is needed, ask for clarification when key evidence is missing, and provide a safe recommendation. A simple classifier can label a message, but it may not explain its reasoning, cite institutional guidance, or respond appropriately when the input is incomplete. A general LLM can produce fluent advice, but it may rely on unsupported assumptions or recommend unsafe actions. The proposed agent therefore combines language understanding with evidence retrieval, a limited deterministic tool, explicit abstention, and human oversight.
The project was motivated by three practical needs. First, students need explanations rather than labels alone. Second, the system must distinguish course or institutional guidance from general knowledge. Third, a false sense of certainty can be harmful: an agent should admit uncertainty rather than invent details. The main contribution is not a new language model. It is a controlled workflow and evaluation showing whether agentic components improve reliability over a simpler baseline.

(function () {
  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'bubbleCanvas';
      layer.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const colors = [
      'rgba(255,255,255,0.38)',
      'rgba(187,247,208,0.34)',
      'rgba(191,219,254,0.34)',
      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
