		Reveal.initialize({
			controls: true,

		function startTime() {
			const today = new Date();
			let h = today.getHours();
			let m = today.getMinutes();
			let s = today.getSeconds();
			m = checkTime(m);
			s = checkTime(s);
			document.getElementById('realtimeclock').innerHTML =  h + ":" + m + ":" + s;
			setTimeout(startTime, 1000);
		}

		function checkTime(i) {
			if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
			return i;
		}

		function startCountdown() {
			const countdownBox = document.getElementById('classCountdown');
			if (!countdownBox) return;

			// Target: Last day of classes, Saturday, December 5, 2026.
			const targetDate = new Date(2026, 11, 5, 0, 0, 0).getTime();

			function updateCountdown() {
				const now = new Date().getTime();
				const distance = targetDate - now;

				if (distance <= 0) {
					const today = new Date();
					if (today.getFullYear() === 2026 && today.getMonth() === 11 && today.getDate() === 5) {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Today — Dec. 5, 2026</span>';
					} else {
						countdownBox.innerHTML = '<span class="count-label">Last day of classes</span><span class="count-time">Completed — Dec. 5, 2026</span>';
					}
					return;
				}

				const days = Math.floor(distance / (1000 * 60 * 60 * 24));
				const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
				const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
				const seconds = Math.floor((distance % (1000 * 60)) / 1000);

				countdownBox.innerHTML = '<span class="count-label">Last day of classes: Dec. 5, 2026</span>' +
					'<span class="count-time">' + days + 'd ' + hours + 'h ' + minutes + 'm ' + seconds + 's</span>';
			}

			updateCountdown();
			setInterval(updateCountdown, 1000);
		}

		function startBubbleAnimation() {
			const bubbleLayer = document.getElementById('bubbleLayer');
			if (!bubbleLayer) return;

			function createBubble() {
				const bubble = document.createElement('span');
				const size = Math.floor(8 + Math.random() * 22);
				const left = Math.random() * 100;
				const duration = Math.floor(28 + Math.random() * 22);
				const drift = Math.floor(-120 + Math.random() * 240);

				bubble.className = 'floating-bubble';
				bubble.style.width = size + 'px';
				bubble.style.height = size + 'px';
				bubble.style.left = left + 'vw';
				bubble.style.animationDuration = duration + 's';
				bubble.style.setProperty('--bubble-drift', drift + 'px');

				bubbleLayer.appendChild(bubble);
				setTimeout(function () {
					bubble.remove();
				}, duration * 1000 + 500);
			}

			function createBubbleBurst() {
				const bubbleCount = 18 + Math.floor(Math.random() * 12);
				for (let i = 0; i < bubbleCount; i++) {
					setTimeout(createBubble, i * 260);
				}
			}

			// Show one soft burst shortly after loading, then repeat every 3 minutes.
			setTimeout(createBubbleBurst, 2500);
			setInterval(createBubbleBurst, 180000);
		}
	</script>

  function initVisibleBubbles() {
    if (window.__visibleCanvasBubblesStarted) return;
    window.__visibleCanvasBubblesStarted = true;

    const layer = document.getElementById('bubbleLayer');
    if (!layer) return;

    let canvas = document.getElementById('bubbleCanvas');

    const colors = [

      'rgba(254,240,138,0.30)',
      'rgba(252,231,243,0.32)',
      'rgba(221,214,254,0.32)'
    ];

    let bubbles = [];

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.ceil(window.innerWidth * dpr);
      canvas.height = Math.ceil(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeBubble(now, delay) {
      const radius = 5 + Math.random() * 11;
      return {
        start: now + delay,
        duration: 30000 + Math.random() * 15000,
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + radius + Math.random() * 35,
        radius: radius,
        drift: -90 + Math.random() * 180,
        wobble: 8 + Math.random() * 22,
        color: colors[Math.floor(Math.random() * colors.length)]
      };
    }

    function burst() {
      const now = performance.now();
      const count = 28 + Math.floor(Math.random() * 12);
      for (let i = 0; i < count; i++) {
        bubbles.push(makeBubble(now, i * 110));
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      bubbles = bubbles.filter(function (b) {
        const t = (now - b.start) / b.duration;
        if (t < 0) return true;
        if (t > 1) return false;

        const ease = 1 - Math.pow(1 - t, 1.8);
        const x = b.x + b.drift * ease + Math.sin(t * Math.PI * 4) * b.wobble;
        const y = b.y - (window.innerHeight + 120) * ease;
        const alpha = Math.sin(Math.PI * t);

        ctx.globalAlpha = 0.55 * alpha;
        ctx.beginPath();
        ctx.arc(x, y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        ctx.globalAlpha = 0.45 * alpha;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.stroke();

        return true;
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Show once when opened, then every 3 minutes.
    burst();
    setInterval(burst, 180000);
    requestAnimationFrame(draw);
  }

  window.startBubbleAnimation = initVisibleBubbles;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVisibleBubbles);
  } else {
    initVisibleBubbles();
  }
})();
</script>
